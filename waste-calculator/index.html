<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定期回収計算ツール</title>
<style>
  /* モダンSaaS風のクリーンなライト／ダークテーマ（フラットデザイン）。 */
  :root {
    --bg: #f7f8fa;
    --bg-accent: #f1f4f8;
    --panel: #ffffff;
    --border: #e2e6ea;
    --border-soft: #edf0f3;
    --text: #1a2233;
    --muted: #6b7280;
    --accent: #2f5fdb;
    --accent-hover: #244bb0;
    --accent-soft: rgba(47, 95, 219, 0.1);
    --accent-contrast: #ffffff;
    --accent2: #0891b2;
    --accent2-hover: #0e7490;
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.08);
    --header: #111827;
    --fun-accent: #ca8a04;
    --fun-accent-soft: rgba(202, 138, 4, 0.12);
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1420; --bg-accent: #182030; --panel: #171d2b; --border: #2b3446; --border-soft: #232b3a;
      --text: #e6e9ef; --muted: #94a0b4; --accent: #5b8def; --accent-hover: #7ba3f2; --accent-soft: rgba(91, 141, 239, 0.16);
      --accent-contrast: #0b1220; --accent2: #38bdf8; --accent2-hover: #67cdfa; --danger: #f87171; --danger-soft: rgba(248, 113, 113, 0.14);
      --header: #f1f5f9; --fun-accent: #fbbf24; --fun-accent-soft: rgba(251, 191, 36, 0.18);
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3); --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1420; --bg-accent: #182030; --panel: #171d2b; --border: #2b3446; --border-soft: #232b3a;
    --text: #e6e9ef; --muted: #94a0b4; --accent: #5b8def; --accent-hover: #7ba3f2; --accent-soft: rgba(91, 141, 239, 0.16);
    --accent-contrast: #0b1220; --accent2: #38bdf8; --accent2-hover: #67cdfa; --danger: #f87171; --danger-soft: rgba(248, 113, 113, 0.14);
    --header: #f1f5f9; --fun-accent: #fbbf24; --fun-accent-soft: rgba(251, 191, 36, 0.18);
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3); --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --bg-accent: #f1f4f8; --panel: #ffffff; --border: #e2e6ea; --border-soft: #edf0f3;
    --text: #1a2233; --muted: #6b7280; --accent: #2f5fdb; --accent-hover: #244bb0; --accent-soft: rgba(47, 95, 219, 0.1);
    --accent-contrast: #ffffff; --accent2: #0891b2; --accent2-hover: #0e7490; --danger: #dc2626; --danger-soft: rgba(220, 38, 38, 0.08);
    --header: #111827; --fun-accent: #ca8a04; --fun-accent-soft: rgba(202, 138, 4, 0.12);
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04); --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 40px 32px;
    line-height: 1.6;
  }
  h1 {
    font-size: 1.5rem; font-weight: 700; margin: 0 0 6px; color: var(--header);
    font-family: "MS Gothic", "ＭＳ ゴシック", "Courier New", monospace; letter-spacing: 0.04em;
  }
  .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }
  .container { max-width: 1180px; margin: 0 auto; }
  .quote-container { max-width: 720px; margin: 0 auto; }
  .advanced-settings {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 2px 20px; margin: 24px 0 20px;
  }
  .advanced-settings summary {
    cursor: pointer; padding: 14px 0; font-size: 0.88rem; color: var(--muted); font-weight: 600;
    list-style: none;
  }
  .advanced-settings summary::-webkit-details-marker { display: none; }
  .advanced-settings summary::before { content: "▸ "; color: var(--muted); }
  .advanced-settings[open] summary::before { content: "▾ "; color: var(--muted); }
  .advanced-settings-body { padding: 2px 0 18px; }
  .field-block { display: block; font-size: 0.88rem; color: var(--muted); font-weight: 600; }
  .field-block input { display: block; margin-top: 6px; width: 100px; }
  input, select {
    font-family: inherit; font-size: 1rem; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg-accent); color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    font-family: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
    padding: 9px 16px; color: var(--text);
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  button:hover { background: var(--bg-accent); border-color: var(--border); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-contrast); }
  .btn-danger { color: var(--danger); border-color: var(--border); }
  .btn-danger:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }
  /* 最重要アクション：フラットな単色ボタンだが、ホバー時だけ小さな「▶」カーソルが覗く遊び心を残す */
  .btn-quote {
    background: var(--accent); color: var(--accent-contrast); border: none; position: relative;
    font-size: 1.05rem; padding: 14px 32px 14px 24px; font-weight: 700; letter-spacing: 0.01em;
    border-radius: 8px;
    box-shadow: var(--shadow);
    transition: background 0.15s ease, box-shadow 0.15s ease, padding-left 0.15s ease;
  }
  .btn-quote::before {
    content: "▶"; display: inline-block; width: 0; opacity: 0; overflow: hidden;
    transition: width 0.15s ease, opacity 0.15s ease, margin-right 0.15s ease;
  }
  .btn-quote:hover:not([disabled]) { background: var(--accent-hover); }
  .btn-quote:hover:not([disabled])::before { width: 0.8em; opacity: 1; margin-right: 6px; }
  .btn-quote[disabled] { background: var(--bg-accent); color: var(--muted); box-shadow: none; }
  .btn-quote[disabled]:hover { background: var(--bg-accent); }
  .site-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px 28px 0; margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
  .site-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .site-name-field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; }
  .site-name-field .field-label-text { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .required-badge { color: var(--danger); font-size: 0.7rem; font-weight: 700; margin-left: 4px; }
  .site-head input[type=text] { font-size: 1.1rem; font-weight: 600; }
  .btn-delete-site {
    width: 32px; height: 32px; min-width: 32px; padding: 0; border-radius: 50%;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 0.95rem; font-weight: 600; line-height: 1; flex-shrink: 0;
  }
  .btn-delete-site:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  button[disabled]:hover { background: var(--panel); border-color: var(--border); color: var(--text); }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  thead th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 0.78rem;
    padding: 0 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 14px 10px; vertical-align: middle; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  .num-col { text-align: right; }
  .monthly-qty-value { font-size: 1.3rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .monthly-qty-value .qty-unit { font-size: 0.74rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .qty-range-note { display: block; font-size: 0.78rem; }
  .qty-pair { display: flex; align-items: center; gap: 6px; }
  .qty-pair input { width: 64px; }
  .row-actions { text-align: center; }
  .row-actions button {
    width: 26px; height: 26px; min-width: 26px; padding: 0; border-radius: 50%;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 0.8rem; font-weight: 600; line-height: 1;
  }
  .row-actions button:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .site-summary {
    display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border-soft); font-size: 1rem;
  }
  .site-summary .stat {
    background: var(--bg-accent); border: 1px solid var(--border-soft); border-radius: 8px; padding: 12px 18px; min-width: 160px;
  }
  .site-summary .stat b { display: block; font-size: 1.35rem; font-weight: 700; color: var(--header); font-variant-numeric: tabular-nums; }
  .site-summary .stat span { color: var(--muted); font-size: 0.82rem; }
  .card-actions {
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px;
    margin: 24px -28px 0; padding: 20px 28px;
    background: var(--bg-accent); border-top: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
  }
  .add-row-btn { margin-top: 12px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 0.88rem; margin-top: 10px; }
  a.note { color: var(--accent2); text-decoration: underline; cursor: pointer; align-self: center; }
  select.type-select { min-width: 110px; }
  .custom-type-input { width: 100px; }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 36px; }
  .table-scroll { overflow-x: auto; }

  /* スマホ表示（幅640px以下）：品目テーブルをカード形式に積み替え、余白も詰める */
  @media (max-width: 640px) {
    body { padding: 20px 16px; }
    h1 { font-size: 1.25rem; }
    .site-card { padding: 18px 18px 0; }
    .card-actions { margin: 20px -18px 0; padding: 16px 18px; }
    .quote-screen, .guide-screen { padding: 24px 18px; }
    .quote-amount-big { font-size: 2.4rem; }
    .site-head { flex-direction: column; align-items: stretch; }
    .site-name-field { min-width: 0; }
    .table-scroll table, .table-scroll tbody, .table-scroll tr { display: block; width: 100%; }
    .table-scroll thead { display: none; }
    .table-scroll tr {
      border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 12px;
    }
    .table-scroll td {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px;
      padding: 7px 2px; border-bottom: none; text-align: left;
    }
    .table-scroll td[data-label]::before {
      content: attr(data-label); color: var(--muted); font-size: 0.72rem; font-weight: 600; flex-shrink: 0;
    }
    .table-scroll td.row-actions { justify-content: flex-end; }
    .table-scroll .num-col { text-align: right; }
  }

  /* 金額提示画面 */
  .quote-screen {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 44px 36px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .quote-screen .quote-site-name { font-size: 1.05rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .quote-screen .quote-headline { font-size: 0.95rem; font-weight: 500; color: var(--muted); margin: 0 0 20px; }
  .quote-amount-big {
    font-family: "MS Gothic", "ＭＳ ゴシック", "Courier New", monospace;
    font-size: 3.1rem; font-weight: 800; color: var(--header); font-variant-numeric: tabular-nums;
    line-height: 1.15; margin: 6px 0 14px; letter-spacing: 0.02em;
  }
  .quote-screen .quote-breakdown { font-size: 0.92rem; color: var(--muted); margin: 4px 0 20px; }
  .quote-screen .quote-breakdown div { margin: 3px 0; }
  .setup-fee-toggle {
    display: inline-flex; align-items: center; gap: 10px; font-size: 0.92rem; font-weight: 500; color: var(--text);
    background: var(--bg-accent); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; cursor: pointer; margin-bottom: 24px;
  }
  .setup-fee-toggle input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  /* お楽しみ要素：ここだけはドラクエ風に、点線ウィンドウ枠と金色のアクセントを残す */
  .monster-encounter {
    margin: 4px 0 24px; padding: 18px 16px; background: var(--bg-accent); border: 2px dashed var(--fun-accent-soft);
    border-radius: 10px;
  }
  .monster-emoji { font-size: 2.3rem; line-height: 1.2; animation: monster-bounce 1.6s ease-in-out infinite; }
  .monster-name { font-size: 1rem; font-weight: 700; color: var(--fun-accent); margin-top: 6px; }
  .monster-level { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
  @keyframes monster-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .quote-warning {
    background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; padding: 10px 16px;
    font-size: 0.88rem; margin: 0 0 18px; text-align: left;
  }
  .back-btn { margin-bottom: 20px; }

  /* 最低基本料金 */
  .min-fee-panel {
    margin-top: 20px; padding: 16px 18px; border-radius: 8px; background: var(--bg-accent); border: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .min-fee-panel label { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); font-weight: 600; }
  .min-fee-panel input { width: 120px; }

  /* 入力バリデーション */
  .input-error { border-color: var(--danger) !important; background: var(--danger-soft) !important; }
  .field-error { color: var(--danger); font-size: 0.76rem; margin-top: 2px; display: block; }

  /* 見積前提条件 */
  .terms-section { margin-top: 24px; text-align: left; }
  .terms-section h3 { font-size: 0.92rem; font-weight: 600; color: var(--header); margin: 0 0 8px; }
  .terms-section textarea {
    width: 100%; min-height: 180px; font-family: inherit; font-size: 0.88rem; padding: 14px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg-accent); color: var(--text); resize: vertical;
  }
  .terms-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px; }
  .copy-feedback { color: var(--accent2); font-size: 0.88rem; font-weight: 600; }
  .work-conditions-field { margin-top: 16px; }
  .work-conditions-field label { display: block; font-size: 0.88rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .work-conditions-field textarea {
    width: 100%; min-height: 70px; font-family: inherit; font-size: 0.95rem; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg-accent); color: var(--text); resize: vertical;
  }

  /* 使い方・単価表 */
  .guide-screen {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 34px;
    box-shadow: var(--shadow-sm);
    text-align: left;
  }
  .guide-screen h2 { font-size: 1.02rem; font-weight: 700; color: var(--header); margin: 26px 0 12px; }
  .guide-screen h2:first-child { margin-top: 0; }
  .guide-steps { margin: 0; padding-left: 1.4em; }
  .guide-steps li { margin-bottom: 10px; line-height: 1.7; }
  .guide-price-table { font-size: 0.95rem; }
  .guide-price-table th, .guide-price-table td { padding: 10px 12px; }
  .guide-price-table thead th { background: var(--bg-accent); border-bottom: none; }
  .guide-price-table tbody tr:nth-child(odd) { background: var(--bg-accent); }
</style>
</head>

<div class="container" id="app"></div>

<script>
const STORAGE_KEY = "haikibutsu-connect-calc-v1";

const TYPE_PRESETS = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル", "段ボール", "その他"];

// 袋サイズ・重量・単価の前提（詳しくは「使い方・単価表」画面にも一覧を表示）。
// 可燃ごみ：45L≈5kg・70L≈8kg、不燃ごみ：45L≈3kg・70L≈5kg、段ボール：1枚≈1kg。
// これらの重量に、可燃46円/kg（東京23区の事業系一般廃棄物処理手数料。令和5年10月改定の現行水準）・
// 不燃100円/kg・段ボール35円/kgを掛けた金額が下記の単価。
const BAG_SIZES = [45, 70];
const BAG_SIZE_TYPES = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル"];
const PRICE_PER_KG = { "可燃ごみ": 46, "不燃ごみ": 100, "段ボール": 35 };
const WEIGHT_TABLE = {
  "可燃ごみ": { 45: 5, 70: 8 },
  "不燃ごみ": { 45: 3, 70: 5 }
};
const CARDBOARD_WEIGHT_PER_SHEET = 1; // kg/枚

// 入力画面には出さず、金額提示のときだけ内部で使う1個あたりの単価テーブル。
const PRICE_TABLE = {
  "可燃ごみ": { 45: WEIGHT_TABLE["可燃ごみ"][45] * PRICE_PER_KG["可燃ごみ"], 70: WEIGHT_TABLE["可燃ごみ"][70] * PRICE_PER_KG["可燃ごみ"] },
  "不燃ごみ": { 45: WEIGHT_TABLE["不燃ごみ"][45] * PRICE_PER_KG["不燃ごみ"], 70: WEIGHT_TABLE["不燃ごみ"][70] * PRICE_PER_KG["不燃ごみ"] },
  "段ボール": CARDBOARD_WEIGHT_PER_SHEET * PRICE_PER_KG["段ボール"]
};

function getUnitPrice(item) {
  const entry = PRICE_TABLE[item.type];
  if (entry === undefined) return undefined;
  if (typeof entry === "number") return entry;
  return entry[item.bagSize];
}

const SETUP_FEE = 3000;
const DEFAULT_MIN_MONTHLY_FEE = 5000;

// 金額提示画面のお楽しみ要素：金額が2,000円上がるごとに、より強いモンスターが出現する。
const MONSTER_TIER_STEP = 1500; // 円

  { name: "フロストウルフ", emoji: "❄️" },
  { name: "のろいのめだま", emoji: "👁️" },

function getMonsterTier(amount) {
  const idx = Math.min(Math.floor(Math.max(amount, 0) / MONSTER_TIER_STEP), MONSTER_TIERS.length - 1);
  return { ...MONSTER_TIERS[idx], level: idx + 1 };
}

function migrateSite(site) {
  if (site.minMonthlyFee === undefined) site.minMonthlyFee = DEFAULT_MIN_MONTHLY_FEE;
  if (site.workConditions === undefined) site.workConditions = "";
  if (site.includeSetupFee === undefined) site.includeSetupFee = true;
  if (site.contractStartDate === undefined) site.contractStartDate = "";
  site.minMonthlyFee = normalizeHalfWidth(site.minMonthlyFee);
  (site.items || []).forEach(item => {
    if (item.bagSize === undefined) item.bagSize = 45;
    // 以前保存された全角数字（例：「２」）をここで半角に補正し、既存データも自己修復させる。
    item.qtyMin = normalizeHalfWidth(item.qtyMin);
    item.qtyMax = normalizeHalfWidth(item.qtyMax);
    item.daysPerWeek = normalizeHalfWidth(item.daysPerWeek);
  });
  return site;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      parsed.view = "list"; // URLを開くたびに必ずトップ（一覧）画面から始める
      parsed.sites = (parsed.sites || []).map(migrateSite);
      if (parsed.weeksPerMonth !== undefined) parsed.weeksPerMonth = normalizeHalfWidth(parsed.weeksPerMonth);
      return parsed;
    }
  } catch (e) { /* ignore */ }
  return { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("")] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 全角数字（IMEが有効なまま数字を打つと「２」のようになることがある）や全角の.－を
// 半角に変換する。Number()は全角文字をNaN扱いしてしまい、無効値として0にフォールバック
// されてしまう（見た目は正しそうなのに計算だけ狂う）ため、検証・保存の前に必ず通す。
function normalizeHalfWidth(str) {
  if (str === null || str === undefined) return str;
  return String(str)
    .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, " ")
    .replace(/−/g, "-")
    .trim();
}

// 数値入力の検証：空欄は許可、マイナス値や数値として解釈できない値はエラー扱いにする。
// 計算には使わせず（0として扱う）、入力欄を赤く縁取りしてエラー文言を出す。
function validateNumberField(rawValue, { min = 0, allowBlank = true, fallback = 0 } = {}) {
  const normalized = normalizeHalfWidth(rawValue);
  if (normalized === "" || normalized === null || normalized === undefined) {
    return allowBlank
      ? { invalid: false, value: fallback }
      : { invalid: true, message: "数値を入力してください", value: fallback };
  }
  const num = Number(normalized);
  if (Number.isNaN(num) || !Number.isFinite(num)) {
    return { invalid: true, message: "数値を入力してください", value: fallback };
  }
  if (num < min) {
    return { invalid: true, message: `${min}以上の値を入力してください`, value: fallback };
  }
  return { invalid: false, value: num };
}

function validateRequiredText(value) {
  const trimmed = (value || "").trim();
  if (!trimmed) return { invalid: true, message: "企業名を入力してください" };
  return { invalid: false };
}

function markFieldValidity(inputEl, result) {
  inputEl.classList.toggle("input-error", result.invalid);
  const container = inputEl.closest("td, label") || inputEl.parentElement;
  const errorEl = container ? container.querySelector(".field-error") : null;
  if (errorEl) errorEl.textContent = result.invalid ? result.message : "";
}

// monthly avg / min / max quantity for an item
function computeItem(item) {
  const weeks = validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }).value;
  const qtyMin = validateNumberField(item.qtyMin).value;
  // 最大値が未入力なら「範囲」ではなく最小値と同じ単一の数量として扱う
  const qtyMaxRaw = item.qtyMax;
  const hasMax = qtyMaxRaw !== "" && qtyMaxRaw !== null && qtyMaxRaw !== undefined && !Number.isNaN(Number(normalizeHalfWidth(qtyMaxRaw)));
  const qtyMax = hasMax ? validateNumberField(qtyMaxRaw).value : qtyMin;
  // 表示用の範囲は常に小さい方〜大きい方の順にする（数量maxに数量min未満の値を入れても逆転表示にならないように）
  const qtyLo = Math.min(qtyMin, qtyMax);
  const qtyHi = Math.max(qtyMin, qtyMax);
  const avg = (qtyMin + qtyMax) / 2;
  const days = validateNumberField(item.daysPerWeek).value;

  const monthlyMin = qtyLo * days * weeks;
  const monthlyMax = qtyHi * days * weeks;
  const monthlyAvg = avg * days * weeks;

  return { monthlyMin, monthlyMax, monthlyAvg };
}

function itemLabelPlain(item) {
  return item.type === "その他" ? (item.customType || "その他") : item.type;
}

function itemLabel(item) {
  const base = itemLabelPlain(item);
  return BAG_SIZE_TYPES.includes(item.type) ? `${base}(${item.bagSize}L)` : base;
}

// 種別・袋サイズから、社内共有メール向けの「1kg◯円、月◯袋想定(1袋◯kgの場合)」を組み立てるための重量・単価情報。
function getPriceDetail(item) {
  const pricePerKg = PRICE_PER_KG[item.type];
  if (pricePerKg === undefined) return null;
  if (item.type === "段ボール") {
    return { pricePerKg, weightPerUnit: CARDBOARD_WEIGHT_PER_SHEET, unitLabel: "枚" };
  }
  if (WEIGHT_TABLE[item.type]) {
    return { pricePerKg, weightPerUnit: WEIGHT_TABLE[item.type][item.bagSize], unitLabel: "袋" };
  }
  return null;
}

function computeSite(site) {
  let totalQty = 0, totalCost = 0, pricedCount = 0, unpricedCount = 0;
  const breakdown = [];
  site.items.forEach(item => {
    const monthlyAvg = computeItem(item).monthlyAvg;
    totalQty += monthlyAvg;
    const unitPrice = getUnitPrice(item);
    if (unitPrice !== undefined) {
      const cost = monthlyAvg * unitPrice;
      totalCost += cost;
      pricedCount++;
      breakdown.push({ label: itemLabel(item), qty: monthlyAvg, unitPrice, cost });
    } else {
      unpricedCount++;
    }
  });

  const minMonthlyFee = validateNumberField(site.minMonthlyFee).value;
  const minimumApplied = totalCost < minMonthlyFee;
  const monthlyCost = minimumApplied ? minMonthlyFee : totalCost;
  const setupFee = site.includeSetupFee ? SETUP_FEE : 0;
  const quoteTotal = monthlyCost + setupFee;

  return { totalQty, totalCost, monthlyCost, minimumApplied, minMonthlyFee, setupFee, quoteTotal, breakdown, pricedCount, unpricedCount };
}

function fmt(n, digits = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function yen(n) { return "¥" + n.toLocaleString("ja-JP", { maximumFractionDigits: 0 }); }

// render()は毎回DOMを丸ごと作り直すため、そのままだと入力中の要素がフォーカスを失い、
// 1文字打つたびに入力が止まってしまう。再描画の前後でフォーカス位置・カーソル位置を記録して復元する。
function captureFocus() {
  const active = document.activeElement;
  if (!active || !active.dataset || !active.dataset.role) return null;
  const siteCard = active.closest("[data-site-id]");
  const itemRow = active.closest("[data-item-id]");
  return {
    role: active.dataset.role,
    siteId: siteCard ? siteCard.dataset.siteId : null,
    itemId: itemRow ? itemRow.dataset.itemId : null,
    selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
    selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null
  };
}

function restoreFocus(info) {
  if (!info) return;
  let scope = document;
  if (info.siteId) {
    scope = document.querySelector(`[data-site-id="${info.siteId}"]`) || document;
  }
  if (info.itemId && scope !== document) {
    scope = scope.querySelector(`[data-item-id="${info.itemId}"]`) || scope;
  }
  const el = scope.querySelector(`[data-role="${info.role}"]`);
  if (!el) return;
  el.focus();
  if (info.selectionStart !== null && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(info.selectionStart, info.selectionEnd); } catch (e) { /* ignore */ }
  }
}

let lastRenderedView = null; // 画面切り替え（一覧⇔金額提示⇔使い方）のときだけ先頭にスクロールするための記録

function render() {
  const focusInfo = captureFocus();
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view === "quote") {
    const site = state.sites.find(s => s.id === state.activeSiteId);
    if (!site) { state.view = "list"; saveState(); return render(); }
    app.appendChild(renderQuoteScreen(site));
  } else if (state.view === "guide") {
    app.appendChild(renderGuideScreen());
  } else {
    app.appendChild(renderListScreen());
  }
  if (state.view !== lastRenderedView) {
    window.scrollTo(0, 0);
    lastRenderedView = state.view;
  }
  restoreFocus(focusInfo);
  saveState();
}

        <input type="text" inputmode="decimal" data-role="qtyMin" value="${item.qtyMin}"> 〜
        <input type="text" inputmode="decimal" data-role="qtyMax" value="${item.qtyMax}" placeholder="－" title="数量が1つだけの場合は空欄でOK（最小値のみで計算します）">
      </div>
      <span class="field-error"></span>
    </td>
    <td data-label="頻度(週◯回)">
      <input type="text" inputmode="numeric" data-role="daysPerWeek" value="${item.daysPerWeek}" style="width:70px;">
      <span class="field-error"></span>
    </td>
    <td class="num-col" data-label="月間量（目安）">
      <div class="monthly-qty-value">${fmt(c.monthlyAvg)}<span class="qty-unit">個/月</span></div>
      ${showRange ? `<span class="note qty-range-note">目安 ${fmt(c.monthlyMin)}〜${fmt(c.monthlyMax)}個</span>` : ""}
    </td>
    <td class="row-actions"><button class="btn-danger" data-role="delete-item" title="削除">×</button></td>
  `;

  tr.querySelector('[data-role="type"]').addEventListener("change", (e) => {
    item.type = e.target.value;
    render();
  });
  const customInput = tr.querySelector('[data-role="customType"]');
  if (customInput) {
    // こちらも企業名欄と同様、入力中の再描画によるスマホでの入力しづらさを避けるため
    // 入力中は再描画せず、フォーカスが外れたタイミングでのみ再描画する。
    customInput.addEventListener("input", (e) => {
      item.customType = e.target.value;
      saveState();
    });
    customInput.addEventListener("blur", () => { setTimeout(render, 0); });
  }
  const bagSizeEl = tr.querySelector('[data-role="bagSize"]');
  if (bagSizeEl) {
    bagSizeEl.addEventListener("change", (e) => { item.bagSize = Number(e.target.value); render(); });
  }
  const qtyMinEl = tr.querySelector('[data-role="qtyMin"]');
  const qtyMaxEl = tr.querySelector('[data-role="qtyMax"]');
  const daysEl = tr.querySelector('[data-role="daysPerWeek"]');
  // 再描画のたびに現在値で検証しなおし、エラー表示が消えないようにする
  markFieldValidity(qtyMinEl, validateNumberField(item.qtyMin));
  markFieldValidity(qtyMaxEl, validateNumberField(item.qtyMax));
  markFieldValidity(daysEl, validateNumberField(item.daysPerWeek));
  qtyMinEl.addEventListener("input", (e) => { item.qtyMin = normalizeHalfWidth(e.target.value); render(); });
  qtyMaxEl.addEventListener("input", (e) => { item.qtyMax = normalizeHalfWidth(e.target.value); render(); });
  daysEl.addEventListener("input", (e) => { item.daysPerWeek = normalizeHalfWidth(e.target.value); render(); });
  tr.querySelector('[data-role="delete-item"]').addEventListener("click", () => {
    site.items = site.items.filter(i => i.id !== item.id);
    render();
  });

  return tr;
}

  const lines = [];
  lines.push("【お見積り前提条件】");
  lines.push(`企業名：${site.name || "(未入力)"}`);
  lines.push("下記の内容を前提として、本お見積りを算定しております。");
  lines.push("");
  if (site.items.length) {
    site.items.forEach(item => {
      const c = computeItem(item);
      const label = itemLabel(item);
      const hasMax = item.qtyMax !== "" && item.qtyMax !== null && item.qtyMax !== undefined && !Number.isNaN(Number(normalizeHalfWidth(item.qtyMax)));
      const qtyText = hasMax && String(item.qtyMax) !== String(item.qtyMin) ? `${item.qtyMin}〜${item.qtyMax}` : `${item.qtyMin}`;
      lines.push(`・${label}：1回あたり${qtyText}個、週${item.daysPerWeek}回収集（月間想定 ${fmt(c.monthlyAvg)}個）`);
    });
  } else {
    lines.push("・（品目が登録されていません）");
  }
  lines.push("");
  if (site.workConditions && site.workConditions.trim()) {
    lines.push("【作業条件・特記事項】");
    lines.push(site.workConditions.trim());
    lines.push("");
  }
  lines.push("実際の排出量が上記の想定数量を大きく上回る場合、または収集頻度・排出場所などの条件に変更が生じた場合は、");
  lines.push("別途お見積りを再算定させていただく場合がございますので、あらかじめご了承ください。");
  return lines.join("\n");
}

// ------------------------------------------------------------------
// 契約書（Word/.docx）の生成
// 外部ライブラリを使わず、ZIP（storeモード）とOOXMLを直接組み立てて .docx を出力する。
// ------------------------------------------------------------------

const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16le(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
function u32le(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }

// files: [{ name, data: Uint8Array }] を、無圧縮（store）ZIPにまとめる。
function buildZip(files) {
  const DOS_TIME = 0x0000;
  const DOS_DATE = 0x0021; // 1980-01-01（DOS日付のダミー値）
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(file => {
    const nameBytes = encoder.encode(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new Uint8Array([
      ...u32le(0x04034b50), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(DOS_TIME), ...u16le(DOS_DATE),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0)
    ]);
    const localEntry = new Uint8Array(localHeader.length + nameBytes.length + data.length);
    localEntry.set(localHeader, 0);
    localEntry.set(nameBytes, localHeader.length);
    localEntry.set(data, localHeader.length + nameBytes.length);
    localParts.push(localEntry);

    const centralHeader = new Uint8Array([
      ...u32le(0x02014b50), ...u16le(20), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(DOS_TIME), ...u16le(DOS_DATE),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0), ...u16le(0), ...u16le(0), ...u16le(0),
      ...u32le(0), ...u32le(offset)
    ]);
    const centralEntry = new Uint8Array(centralHeader.length + nameBytes.length);
    centralEntry.set(centralHeader, 0);
    centralEntry.set(nameBytes, centralHeader.length);
    centralParts.push(centralEntry);

    offset += localEntry.length;
  });

  const centralSize = centralParts.reduce((sum, p) => sum + p.length, 0);
  const centralOffset = offset;
  const eocd = new Uint8Array([
    ...u32le(0x06054b50), ...u16le(0), ...u16le(0),
    ...u16le(files.length), ...u16le(files.length),
    ...u32le(centralSize), ...u32le(centralOffset), ...u16le(0)
  ]);

  const result = new Uint8Array(offset + centralSize + eocd.length);
  let pos = 0;
  localParts.forEach(p => { result.set(p, pos); pos += p.length; });
  centralParts.forEach(p => { result.set(p, pos); pos += p.length; });
  result.set(eocd, pos);
  return result;
}

function escapeXml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// テキスト（改行含む）を1つのランに変換。改行は<w:br/>で表現する。
// フォントは雛形に合わせてMS明朝で統一する。
function docxRun(text, opts = {}) {
  const rPrParts = [`<w:rFonts w:ascii="MS Mincho" w:hAnsi="MS Mincho" w:eastAsia="MS Mincho" w:hint="eastAsia"/>`];
  if (opts.bold) rPrParts.push("<w:b/><w:bCs/>");
  const size = opts.size || 20;
  rPrParts.push(`<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`);
  const rPr = `<w:rPr>${rPrParts.join("")}</w:rPr>`;
  const lines = String(text).split("\n");
  const body = lines.map((line, i) => (i > 0 ? "<w:br/>" : "") + `<w:t xml:space="preserve">${escapeXml(line)}</w:t>`).join("");
  return `<w:r>${rPr}${body}</w:r>`;
}

// 段落（見出し／本文）を1つ生成。indentLeft/indentHanging/indentFirstLineはtwips指定（雛形のw:ind値をそのまま渡す）。
function docxParagraph(text, opts = {}) {
  const pPrParts = [];
  if (opts.align) pPrParts.push(`<w:jc w:val="${opts.align}"/>`);
  if (opts.indentLeft !== undefined || opts.indentHanging !== undefined || opts.indentFirstLine !== undefined) {
    const attrs = [];
    if (opts.indentLeft !== undefined) attrs.push(`w:left="${opts.indentLeft}"`);
    if (opts.indentHanging !== undefined) attrs.push(`w:hanging="${opts.indentHanging}"`);
    if (opts.indentFirstLine !== undefined) attrs.push(`w:firstLine="${opts.indentFirstLine}"`);
    pPrParts.push(`<w:ind ${attrs.join(" ")}/>`);
  }
  const before = opts.spacingBefore !== undefined ? opts.spacingBefore : 0;
  const after = opts.spacingAfter !== undefined ? opts.spacingAfter : 0;
  pPrParts.push(`<w:spacing w:before="${before}" w:after="${after}"/>`);
  const pPr = `<w:pPr>${pPrParts.join("")}</w:pPr>`;
  return `<w:p>${pPr}${docxRun(text, opts)}</w:p>`;
}

// 「2026年　6月　19日」のような、雛形と同じ書式（全角スペース区切り・0埋めなし）の日付文字列を作る。
function formatJapaneseDate(y, m, d) {
  return `${y}年　${m}月　${d}日`;
}

// 契約開始日（YYYY-MM-DD）から、第14条関係の契約期間（開始日〜1年後の前日）を計算する。
function computeContractPeriod(startDateStr) {
  if (!startDateStr) return null;
  const parts = startDateStr.split("-").map(Number);
  const [y, m, d] = parts;
  if (!y || !m || !d) return null;
  const start = new Date(y, m - 1, d);
  const end = new Date(y + 1, m - 1, d);
  end.setDate(end.getDate() - 1);
  return {
    startText: formatJapaneseDate(start.getFullYear(), start.getMonth() + 1, start.getDate()),
    endText: formatJapaneseDate(end.getFullYear(), end.getMonth() + 1, end.getDate())
  };
}

const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

function buildContractDocxBytes(site) {
  const paragraphs = generateContractParagraphs(site);
  const bodyXml = paragraphs.map(p => docxParagraph(p.text, p)).join("");
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${bodyXml}
    <w:sectPr>
      <w:pgSz w:w="11907" w:h="16840" w:code="9"/>
      <w:pgMar w:top="851" w:right="1134" w:bottom="851" w:left="1134" w:header="851" w:footer="992" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const encoder = new TextEncoder();
  return buildZip([
    { name: "[Content_Types].xml", data: encoder.encode(contentTypesXml) },
    { name: "_rels/.rels", data: encoder.encode(relsXml) },
    { name: "word/document.xml", data: encoder.encode(documentXml) }
  ]);
}

function buildContractDocxBlob(site) {
  return new Blob([buildContractDocxBytes(site)], { type: DOCX_MIME });
}

// bytes -> base64（大きいバイト列でもスタックオーバーフローしないようchunk分割する）
function uint8ToBase64(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// Artifact（claude.ai）のiframeサンドボックスでは<a download>クリックが反応しないことがあるため、
// data:URIへの通常のリンク遷移（target="_blank"）でも開けるようにしておく保険。
function buildContractDocxDataUrl(site) {
  const base64 = uint8ToBase64(buildContractDocxBytes(site));
  return `data:${DOCX_MIME};base64,${base64}`;
}

// ブラウザによってはダウンロードのファイル名に日本語が使えず「download」（拡張子なし）に
// 化けてしまうことがあるため、ファイル名は英数字のみ（日時ベース）にしておく。
function formatTimestampForFilename() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

// Artifact（claude.ai）上では、iframeのサンドボックス制約によりブラウザへの直接ダウンロード
// （<a download>のクリック）が反応しないことがあるため、window.claude.downloadsが使える場合は
// そちらを優先する。使えない場合（ローカルでindex.htmlを直接開いた場合など）は従来方式にする。
async function downloadBlob(blob, filename) {
  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({ filename, data: blob });
      return { ok: true };
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") {
        return { ok: false, message: "ダウンロードがキャンセルされました。" };
      }
      if (code === "extension_not_enabled" || code === "rejected_extension") {
        return { ok: false, message: "この画面ではWordファイルのダウンロードに対応していません。", needsTextFallback: true };
      }
      if (code === "rate_limited") {
        return { ok: false, message: "少し時間をおいてから、もう一度お試しください。" };
      }
      // unavailable・not_granted等：従来方式にフォールバックしてみる
    }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return { ok: true };
  } catch (err) {
    return { ok: false, message: "ダウンロードに失敗しました。" };
  }
}

// 契約書（Word）のダウンロードに対応していない画面向けの、書式なしテキスト版フォールバック。
function generateContractPlainText(site) {
  return generateContractParagraphs(site).map(p => p.text).join("\n");
}

async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* フォールバックへ */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

      feedback.textContent = result.message || "ダウンロードに失敗しました。";
    }
    setTimeout(() => { feedback.textContent = ""; }, 4000);
  });

  frag.appendChild(wrap);
  return frag;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

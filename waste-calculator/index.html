<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃棄物コネクト 案件量計算ツール</title>
<style>
  /* ドラゴンクエスト風「青いウィンドウ」テーマ。ライト/ダーク切替でも見た目を統一する。 */
  :root {
    --bg: #050a28;
    --bg-accent: #0d1442;
    --panel: #1b1f6b;

    --accent2-hover: #86e6ff;

    --danger-soft: rgba(255, 92, 92, 0.2);

      --bg: #050a28; --bg-accent: #0d1442; --panel: #1b1f6b; --border: #ffffff; --border-soft: rgba(255, 255, 255, 0.4);
      --text: #ffffff; --muted: #b9c6ff; --accent: #ffd23f; --accent-hover: #ffe27a; --accent-soft: rgba(255, 210, 63, 0.16);
      --accent-contrast: #1b1f6b; --accent2: #4fd8ff; --accent2-hover: #86e6ff; --danger: #ff5c5c; --danger-soft: rgba(255, 92, 92, 0.2);
      --header: #ffd23f; --shadow: 4px 4px 0 rgba(0, 0, 0, 0.45); --shadow-sm: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #050a28; --bg-accent: #0d1442; --panel: #1b1f6b; --border: #ffffff; --border-soft: rgba(255, 255, 255, 0.4);
    --text: #ffffff; --muted: #b9c6ff; --accent: #ffd23f; --accent-hover: #ffe27a; --accent-soft: rgba(255, 210, 63, 0.16);
    --accent-contrast: #1b1f6b; --accent2: #4fd8ff; --accent2-hover: #86e6ff; --danger: #ff5c5c; --danger-soft: rgba(255, 92, 92, 0.2);
    --header: #ffd23f; --shadow: 4px 4px 0 rgba(0, 0, 0, 0.45); --shadow-sm: 3px 3px 0 rgba(0, 0, 0, 0.4);

    --bg: #050a28; --bg-accent: #0d1442; --panel: #1b1f6b; --border: #ffffff; --border-soft: rgba(255, 255, 255, 0.4);
    --text: #ffffff; --muted: #b9c6ff; --accent: #ffd23f; --accent-hover: #ffe27a; --accent-soft: rgba(255, 210, 63, 0.16);

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  * { box-sizing: border-box; }
  body {
    font-family: "MS Gothic", "ＭＳ ゴシック", "Osaka－等幅", "Yu Gothic", "Noto Sans JP", monospace;
    background:
      radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,0.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 8%, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 30%, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 65% 60%, rgba(255,255,255,0.5) 50%, transparent 51%),

  .container { max-width: 1180px; margin: 0 auto; }

  .advanced-settings {

  .advanced-settings summary {

    list-style: none;
  }
  .advanced-settings summary::-webkit-details-marker { display: none; }
  .advanced-settings summary::before { content: "▸ "; color: var(--accent); }
  .advanced-settings[open] summary::before { content: "▾ "; color: var(--accent); }
  .advanced-settings-body { padding: 2px 0 16px; }
  .field-block { display: block; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
  .field-block input { display: block; margin-top: 6px; width: 100px; }
  input, select {
    font-family: inherit; font-size: 1.05rem; padding: 9px 12px;
    border: 2px solid var(--border); border-radius: 3px; background: var(--bg-accent); color: var(--text);

  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {

  /* 金額提示画面 */

  .monster-encounter {

  .terms-section textarea {

  }
  .terms-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px; }
  .copy-feedback { color: var(--accent2); font-size: 0.9rem; font-weight: 700; }

  .work-conditions-field label { display: block; font-size: 0.9rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .work-conditions-field textarea {

<body>
<div class="container" id="app"></div>

<script>
const STORAGE_KEY = "haikibutsu-connect-calc-v1";

const TYPE_PRESETS = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル", "段ボール", "その他"];

// 袋サイズ・重量・単価の前提（詳しくは「使い方・単価表」画面にも一覧を表示）。
// 可燃ごみ：45L≈5kg・70L≈8kg、不燃ごみ：45L≈3kg・70L≈5kg、段ボール：1枚≈1kg。
// これらの重量に、可燃40円/kg・不燃100円/kg・段ボール35円/kgを掛けた金額が下記の単価。
const BAG_SIZES = [45, 70];
const BAG_SIZE_TYPES = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル"];
const PRICE_PER_KG = { "可燃ごみ": 40, "不燃ごみ": 100, "段ボール": 35 };
const WEIGHT_TABLE = {
  "可燃ごみ": { 45: 5, 70: 8 },
  "不燃ごみ": { 45: 3, 70: 5 }
};
const CARDBOARD_WEIGHT_PER_SHEET = 1; // kg/枚

// 入力画面には出さず、金額提示のときだけ内部で使う1個あたりの単価テーブル。
const PRICE_TABLE = {
  "可燃ごみ": { 45: WEIGHT_TABLE["可燃ごみ"][45] * PRICE_PER_KG["可燃ごみ"], 70: WEIGHT_TABLE["可燃ごみ"][70] * PRICE_PER_KG["可燃ごみ"] },
  "不燃ごみ": { 45: WEIGHT_TABLE["不燃ごみ"][45] * PRICE_PER_KG["不燃ごみ"], 70: WEIGHT_TABLE["不燃ごみ"][70] * PRICE_PER_KG["不燃ごみ"] },
  "段ボール": CARDBOARD_WEIGHT_PER_SHEET * PRICE_PER_KG["段ボール"]
};

function getUnitPrice(item) {
  const entry = PRICE_TABLE[item.type];
  if (entry === undefined) return undefined;
  if (typeof entry === "number") return entry;
  return entry[item.bagSize];
}

const SETUP_FEE = 3000;
const DEFAULT_MIN_MONTHLY_FEE = 5000;

// 金額提示画面のお楽しみ要素：金額が2,000円上がるごとに、より強いモンスターが出現する。
const MONSTER_TIER_STEP = 2000; // 円
const MONSTER_TIERS = [
  { name: "スライム", emoji: "🟢" },
  { name: "ドラキー", emoji: "🦇" },
  { name: "ゴースト", emoji: "👻" },
  { name: "ゴブリン", emoji: "👺" },
  { name: "コボルト", emoji: "🐺" },
  { name: "マタンゴ", emoji: "🍄" },
  { name: "さまようよろい", emoji: "🛡️" },
  { name: "しにがみ", emoji: "💀" },
  { name: "キラーパンサー", emoji: "🐆" },
  { name: "ゴーレム", emoji: "🗿" },
  { name: "デビルアーマー", emoji: "⚔️" },
  { name: "キメラ", emoji: "🦅" },
  { name: "リッチ", emoji: "🧙" },
  { name: "ドラゴン", emoji: "🐉" },
  { name: "だいまどう", emoji: "🔮" },
  { name: "まおう", emoji: "👑" }
];

function getMonsterTier(amount) {
  const idx = Math.min(Math.floor(Math.max(amount, 0) / MONSTER_TIER_STEP), MONSTER_TIERS.length - 1);
  return { ...MONSTER_TIERS[idx], level: idx + 1 };
}

function uid() { return Math.random().toString(36).slice(2, 10); }

function defaultItem(type) {
  return {
    id: uid(),
    type: type || "可燃ごみ",
    customType: "",
    bagSize: 45,
    qtyMin: 1,
    qtyMax: 2,
    daysPerWeek: 5
  };
}

function defaultSite(name) {
  return {
    id: uid(),
    name: name || "",
    includeSetupFee: true,
    minMonthlyFee: DEFAULT_MIN_MONTHLY_FEE,
    workConditions: "",
    items: [
      defaultItem("可燃ごみ"),
      defaultItem("不燃ごみ")
    ]
  };
}

let state = loadState();
let advancedSettingsOpen = false; // render()毎にDOMを作り直すため、開閉状態はここで別管理する

function migrateSite(site) {
  if (site.minMonthlyFee === undefined) site.minMonthlyFee = DEFAULT_MIN_MONTHLY_FEE;
  if (site.workConditions === undefined) site.workConditions = "";
  if (site.includeSetupFee === undefined) site.includeSetupFee = true;
  (site.items || []).forEach(item => {
    if (item.bagSize === undefined) item.bagSize = 45;
  });
  return site;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.view) parsed.view = "list";
      parsed.sites = (parsed.sites || []).map(migrateSite);
      return parsed;
    }
  } catch (e) { /* ignore */ }
  return { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("")] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 数値入力の検証：空欄は許可、マイナス値や数値として解釈できない値はエラー扱いにする。
// 計算には使わせず（0として扱う）、入力欄を赤く縁取りしてエラー文言を出す。
function validateNumberField(rawValue, { min = 0, allowBlank = true, fallback = 0 } = {}) {
  if (rawValue === "" || rawValue === null || rawValue === undefined) {
    return allowBlank
      ? { invalid: false, value: fallback }
      : { invalid: true, message: "数値を入力してください", value: fallback };
  }
  const num = Number(rawValue);
  if (Number.isNaN(num) || !Number.isFinite(num)) {
    return { invalid: true, message: "数値を入力してください", value: fallback };
  }
  if (num < min) {
    return { invalid: true, message: `${min}以上の値を入力してください`, value: fallback };
  }
  return { invalid: false, value: num };
}

// 日本語などIME変換を伴うテキスト入力欄に「入力のたびにDOMを再描画する」処理を
// そのまま繋ぐと、変換中にrender()が要素を作り直してしまい入力が壊れる（例:「ｋい」のような文字化け）。
// 変換確定前（isComposing中）はrender()を呼ばず、変換確定時（compositionend）に反映する。
function bindImeSafeInput(inputEl, onChange) {
  inputEl.addEventListener("input", (e) => {
    onChange(e.target.value, { composing: e.isComposing === true });
  });
  inputEl.addEventListener("compositionend", (e) => {
    onChange(e.target.value, { composing: false });
  });
}

function validateRequiredText(value) {
  const trimmed = (value || "").trim();
  if (!trimmed) return { invalid: true, message: "企業名を入力してください" };
  return { invalid: false };
}

function markFieldValidity(inputEl, result) {
  inputEl.classList.toggle("input-error", result.invalid);
  const container = inputEl.closest("td, label") || inputEl.parentElement;
  const errorEl = container ? container.querySelector(".field-error") : null;
  if (errorEl) errorEl.textContent = result.invalid ? result.message : "";
}

// monthly avg / min / max quantity for an item
function computeItem(item) {
  const weeks = validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }).value;
  const qtyMin = validateNumberField(item.qtyMin).value;
  // 最大値が未入力なら「範囲」ではなく最小値と同じ単一の数量として扱う
  const qtyMaxRaw = item.qtyMax;
  const hasMax = qtyMaxRaw !== "" && qtyMaxRaw !== null && qtyMaxRaw !== undefined && !Number.isNaN(Number(qtyMaxRaw));
  const qtyMax = hasMax ? validateNumberField(qtyMaxRaw).value : qtyMin;
  // 表示用の範囲は常に小さい方〜大きい方の順にする（数量maxに数量min未満の値を入れても逆転表示にならないように）
  const qtyLo = Math.min(qtyMin, qtyMax);
  const qtyHi = Math.max(qtyMin, qtyMax);
  const avg = (qtyMin + qtyMax) / 2;
  const days = validateNumberField(item.daysPerWeek).value;

  const monthlyMin = qtyLo * days * weeks;
  const monthlyMax = qtyHi * days * weeks;
  const monthlyAvg = avg * days * weeks;

  return { monthlyMin, monthlyMax, monthlyAvg };
}

function itemLabelPlain(item) {
  return item.type === "その他" ? (item.customType || "その他") : item.type;
}

function itemLabel(item) {
  const base = itemLabelPlain(item);
  return BAG_SIZE_TYPES.includes(item.type) ? `${base}(${item.bagSize}L)` : base;
}

// 種別・袋サイズから、社内共有メール向けの「1kg◯円、月◯袋想定(1袋◯kgの場合)」を組み立てるための重量・単価情報。
function getPriceDetail(item) {
  const pricePerKg = PRICE_PER_KG[item.type];
  if (pricePerKg === undefined) return null;
  if (item.type === "段ボール") {
    return { pricePerKg, weightPerUnit: CARDBOARD_WEIGHT_PER_SHEET, unitLabel: "枚" };
  }
  if (WEIGHT_TABLE[item.type]) {
    return { pricePerKg, weightPerUnit: WEIGHT_TABLE[item.type][item.bagSize], unitLabel: "袋" };
  }
  return null;
}

function computeSite(site) {
  let totalQty = 0, totalCost = 0, pricedCount = 0, unpricedCount = 0;
  const breakdown = [];
  site.items.forEach(item => {
    const monthlyAvg = computeItem(item).monthlyAvg;
    totalQty += monthlyAvg;
    const unitPrice = getUnitPrice(item);
    if (unitPrice !== undefined) {
      const cost = monthlyAvg * unitPrice;
      totalCost += cost;
      pricedCount++;
      breakdown.push({ label: itemLabel(item), qty: monthlyAvg, unitPrice, cost });
    } else {
      unpricedCount++;
    }
  });

  const minMonthlyFee = validateNumberField(site.minMonthlyFee).value;
  const minimumApplied = totalCost < minMonthlyFee;
  const monthlyCost = minimumApplied ? minMonthlyFee : totalCost;
  const setupFee = site.includeSetupFee ? SETUP_FEE : 0;
  const quoteTotal = monthlyCost + setupFee;

  return { totalQty, totalCost, monthlyCost, minimumApplied, minMonthlyFee, setupFee, quoteTotal, breakdown, pricedCount, unpricedCount };
}

function fmt(n, digits = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function yen(n) { return "¥" + n.toLocaleString("ja-JP", { maximumFractionDigits: 0 }); }

// render()は毎回DOMを丸ごと作り直すため、そのままだと入力中の要素がフォーカスを失い、
// 1文字打つたびに入力が止まってしまう。再描画の前後でフォーカス位置・カーソル位置を記録して復元する。
function captureFocus() {
  const active = document.activeElement;
  if (!active || !active.dataset || !active.dataset.role) return null;
  const siteCard = active.closest("[data-site-id]");
  const itemRow = active.closest("[data-item-id]");
  return {
    role: active.dataset.role,
    siteId: siteCard ? siteCard.dataset.siteId : null,
    itemId: itemRow ? itemRow.dataset.itemId : null,
    selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
    selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null
  };
}

function restoreFocus(info) {
  if (!info) return;
  let scope = document;
  if (info.siteId) {
    scope = document.querySelector(`[data-site-id="${info.siteId}"]`) || document;
  }
  if (info.itemId && scope !== document) {
    scope = scope.querySelector(`[data-item-id="${info.itemId}"]`) || scope;
  }
  const el = scope.querySelector(`[data-role="${info.role}"]`);
  if (!el) return;
  el.focus();
  if (info.selectionStart !== null && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(info.selectionStart, info.selectionEnd); } catch (e) { /* ignore */ }
  }
}

function render() {
  const focusInfo = captureFocus();
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view === "quote") {
    const site = state.sites.find(s => s.id === state.activeSiteId);
    if (!site) { state.view = "list"; saveState(); return render(); }
    app.appendChild(renderQuoteScreen(site));
  } else if (state.view === "guide") {
    app.appendChild(renderGuideScreen());
  } else {
    app.appendChild(renderListScreen());
  }
  restoreFocus(focusInfo);
  saveState();
}

function renderListScreen() {

  const wrap = document.createElement("div");

  wrap.innerHTML = `
    <h1>廃棄物コネクト 案件量計算ツール</h1>

      <button class="btn-primary" id="addSiteBtn">＋ 案件を追加</button>
      <button id="guideBtn">使い方・単価表</button>
      <button id="resetBtn" class="btn-danger">全データをクリア</button>
    </div>
    <div id="sitesContainer"></div>
    <details class="advanced-settings" ${advancedSettingsOpen ? "open" : ""}>
      <summary>詳細な計算設定（デフォルト：4.35週）</summary>
      <div class="advanced-settings-body">
        <label class="field-block">1ヶ月あたりの週数
          <input type="text" inputmode="decimal" id="weeksPerMonth" data-role="weeksPerMonth" value="${state.weeksPerMonth}">
          <span class="field-error"></span>
        </label>
        <p class="note" style="margin:8px 0 0;">※既定値は365日÷12ヶ月÷7日で算出した平均週数です。通常は変更不要です。必要な場合のみ調整してください。</p>
      </div>
    </details>
    <footer>廃棄物コネクト｜社内用 案件量計算ツール</footer>
  `;
  frag.appendChild(wrap);

  const sitesContainer = wrap.querySelector("#sitesContainer");
  state.sites.forEach(site => sitesContainer.appendChild(renderSiteCard(site)));

  const weeksEl = wrap.querySelector("#weeksPerMonth");
  markFieldValidity(weeksEl, validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }));
  weeksEl.addEventListener("input", (e) => { state.weeksPerMonth = e.target.value; render(); });
  wrap.querySelector(".advanced-settings").addEventListener("toggle", (e) => {
    advancedSettingsOpen = e.target.open;
  });
  wrap.querySelector("#addSiteBtn").addEventListener("click", () => {
    state.sites.push(defaultSite(""));
    render();
  });
  wrap.querySelector("#guideBtn").addEventListener("click", () => {
    state.view = "guide";
    render();
  });
  wrap.querySelector("#resetBtn").addEventListener("click", () => {
    if (!confirm("全ての案件データを削除して初期状態に戻します。よろしいですか？")) return;
    state = { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("")] };
    render();
  });

  return frag;
}

function renderSiteCard(site) {

  card.className = "site-card";
  card.dataset.siteId = site.id;

  const head = document.createElement("div");
  head.className = "site-head";
  head.innerHTML = `
    <label class="site-name-field">
      <span class="field-label-text">企業名<span class="required-badge">必須</span></span>
      <input type="text" value="${escapeAttr(site.name)}" data-role="site-name" placeholder="例：株式会社サキュレ">
      <span class="field-error"></span>
    </label>
    <button class="btn-danger" data-role="delete-site">この案件を削除</button>
  `;
  card.appendChild(head);

  const table = document.createElement("table");
  table.innerHTML = `
    <thead>
      <tr>
        <th>種別</th>
        <th>袋サイズ</th>
        <th>1回あたり数量(min〜max)</th>
        <th>頻度(週◯回)</th>
        <th class="num-col">月間量（目安）</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");
  site.items.forEach(item => tbody.appendChild(renderItemRow(site, item)));
  const tableScroll = document.createElement("div");
  tableScroll.className = "table-scroll";
  tableScroll.appendChild(table);
  card.appendChild(tableScroll);

  const addRowBtn = document.createElement("button");
  addRowBtn.className = "add-row-btn";
  addRowBtn.textContent = "＋ 項目を追加";
  addRowBtn.addEventListener("click", () => {
    site.items.push(defaultItem());
    render();
  });
  card.appendChild(addRowBtn);

  const summary = computeSite(site);
  const summaryDiv = document.createElement("div");
  summaryDiv.className = "site-summary";
  summaryDiv.innerHTML = `
    <div class="stat"><b>${fmt(summary.totalQty)}</b><span>月間合計 個数（袋+枚）</span></div>
  `;
  card.appendChild(summaryDiv);

  const minFeePanel = document.createElement("div");
  minFeePanel.className = "min-fee-panel";
  minFeePanel.innerHTML = `
    <label>最低基本料金(円/月)
      <input type="text" inputmode="decimal" data-role="minMonthlyFee" value="${escapeAttr(site.minMonthlyFee)}">
      <span class="field-error"></span>
    </label>
    <span class="note" style="margin:0;">※計算した月額がこれを下回る場合、自動的にこの金額まで引き上げます。</span>
  `;
  card.appendChild(minFeePanel);

  const workConditionsDiv = document.createElement("div");
  workConditionsDiv.className = "work-conditions-field";
  workConditionsDiv.innerHTML = `
    <label>作業条件・特記事項（見積前提条件に反映されます）</label>
    <textarea data-role="workConditions" placeholder="例：出入口に段差あり、夜間収集希望、駐車スペース確保が必要　など">${escapeHtml(site.workConditions)}</textarea>
  `;
  card.appendChild(workConditionsDiv);

  const nameValidation = validateRequiredText(site.name);
  const actions = document.createElement("div");
  actions.className = "card-actions";
  actions.innerHTML = `<button class="btn-quote" data-role="show-quote" ${nameValidation.invalid ? `disabled title="企業名を入力してください"` : ""}>💰 金額提示</button>`;
  actions.querySelector('[data-role="show-quote"]').addEventListener("click", () => {
    state.view = "quote";
    state.activeSiteId = site.id;
    render();
  });
  card.appendChild(actions);

  const siteNameEl = head.querySelector('[data-role="site-name"]');
  markFieldValidity(siteNameEl, nameValidation);
  bindImeSafeInput(siteNameEl, (value, { composing }) => {
    site.name = value;
    if (composing) { saveState(); return; }
    render();
  });
  head.querySelector('[data-role="delete-site"]').addEventListener("click", () => {
    if (!confirm(`「${site.name || "(企業名未入力)"}」を削除しますか？`)) return;
    state.sites = state.sites.filter(s => s.id !== site.id);
    render();
  });

  const minFeeEl = minFeePanel.querySelector('[data-role="minMonthlyFee"]');
  markFieldValidity(minFeeEl, validateNumberField(site.minMonthlyFee, { min: 0, allowBlank: false, fallback: DEFAULT_MIN_MONTHLY_FEE }));
  minFeeEl.addEventListener("input", (e) => { site.minMonthlyFee = e.target.value; render(); });
  workConditionsDiv.querySelector('[data-role="workConditions"]').addEventListener("input", (e) => {
    site.workConditions = e.target.value;
    saveState();
  });

  return card;
}

function renderItemRow(site, item) {
  const tr = document.createElement("tr");
  tr.dataset.itemId = item.id;
  const c = computeItem(item);
  const isCustom = item.type === "その他";
  const hasBagSize = BAG_SIZE_TYPES.includes(item.type);
  const showRange = Math.round(c.monthlyMin) !== Math.round(c.monthlyMax);

  tr.innerHTML = `
    <td>
      <select class="type-select" data-role="type">
        ${TYPE_PRESETS.map(t => `<option value="${t}" ${t === item.type ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      ${isCustom ? `<input type="text" class="custom-type-input" data-role="customType" value="${escapeAttr(item.customType)}" placeholder="種別名">` : ""}
    </td>
    <td>
      ${hasBagSize ? `
        <select data-role="bagSize">
          ${BAG_SIZES.map(s => `<option value="${s}" ${s === item.bagSize ? "selected" : ""}>${s}L</option>`).join("")}
        </select>
      ` : `<span class="note" style="margin:0;">－</span>`}
    </td>
    <td>
      <div class="qty-pair">
        <input type="text" inputmode="decimal" data-role="qtyMin" value="${item.qtyMin}"> 〜
        <input type="text" inputmode="decimal" data-role="qtyMax" value="${item.qtyMax}" placeholder="－" title="数量が1つだけの場合は空欄でOK（最小値のみで計算します）">
      </div>
      <span class="field-error"></span>
    </td>
    <td>
      <input type="text" inputmode="numeric" data-role="daysPerWeek" value="${item.daysPerWeek}" style="width:70px;">
      <span class="field-error"></span>
    </td>
    <td class="num-col">
      <div class="monthly-qty-value">${fmt(c.monthlyAvg)}<span class="qty-unit">個/月</span></div>
      ${showRange ? `<span class="note qty-range-note">目安 ${fmt(c.monthlyMin)}〜${fmt(c.monthlyMax)}個</span>` : ""}
    </td>
    <td class="row-actions"><button class="btn-danger" data-role="delete-item" title="削除">×</button></td>
  `;

  tr.querySelector('[data-role="type"]').addEventListener("change", (e) => {
    item.type = e.target.value;
    render();
  });
  const customInput = tr.querySelector('[data-role="customType"]');
  if (customInput) {
    bindImeSafeInput(customInput, (value, { composing }) => {
      item.customType = value;
      if (composing) { saveState(); return; }
      render();
    });
  }
  const bagSizeEl = tr.querySelector('[data-role="bagSize"]');
  if (bagSizeEl) {
    bagSizeEl.addEventListener("change", (e) => { item.bagSize = Number(e.target.value); render(); });
  }
  const qtyMinEl = tr.querySelector('[data-role="qtyMin"]');
  const qtyMaxEl = tr.querySelector('[data-role="qtyMax"]');
  const daysEl = tr.querySelector('[data-role="daysPerWeek"]');
  // 再描画のたびに現在値で検証しなおし、エラー表示が消えないようにする
  markFieldValidity(qtyMinEl, validateNumberField(item.qtyMin));
  markFieldValidity(qtyMaxEl, validateNumberField(item.qtyMax));
  markFieldValidity(daysEl, validateNumberField(item.daysPerWeek));
  qtyMinEl.addEventListener("input", (e) => { item.qtyMin = e.target.value; render(); });
  qtyMaxEl.addEventListener("input", (e) => { item.qtyMax = e.target.value; render(); });
  daysEl.addEventListener("input", (e) => { item.daysPerWeek = e.target.value; render(); });
  tr.querySelector('[data-role="delete-item"]').addEventListener("click", () => {
    site.items = site.items.filter(i => i.id !== item.id);
    render();
  });

  return tr;
}

// 契約時のトラブル防止のための「見積前提条件」文面を、入力済みの項目から自動で組み立てる。
function generateTermsText(site) {
  const lines = [];
  lines.push("【お見積り前提条件】");
  lines.push(`企業名：${site.name || "(未入力)"}`);
  lines.push("下記の内容を前提として、本お見積りを算定しております。");
  lines.push("");
  if (site.items.length) {
    site.items.forEach(item => {
      const c = computeItem(item);
      const label = itemLabel(item);
      const hasMax = item.qtyMax !== "" && item.qtyMax !== null && item.qtyMax !== undefined && !Number.isNaN(Number(item.qtyMax));
      const qtyText = hasMax && String(item.qtyMax) !== String(item.qtyMin) ? `${item.qtyMin}〜${item.qtyMax}` : `${item.qtyMin}`;
      lines.push(`・${label}：1回あたり${qtyText}個、週${item.daysPerWeek}回収集（月間想定 ${fmt(c.monthlyAvg)}個）`);
    });
  } else {
    lines.push("・（品目が登録されていません）");
  }
  lines.push("");
  if (site.workConditions && site.workConditions.trim()) {
    lines.push("【作業条件・特記事項】");
    lines.push(site.workConditions.trim());
    lines.push("");
  }
  lines.push("実際の排出量が上記の想定数量を大きく上回る場合、または収集頻度・排出場所などの条件に変更が生じた場合は、");
  lines.push("別途お見積りを再算定させていただく場合がございますので、あらかじめご了承ください。");
  return lines.join("\n");
}

// 社内共有用の見積内訳文面（担当者が実際に使っている「1kg◯円、月◯袋想定(1袋◯kgの場合)」の形式）。
function generateBreakdownEmailText(site) {
  const summary = computeSite(site);
  const lines = [];
  lines.push(`件名：${site.name || "(未入力)"} 御見積のご案内`);
  lines.push("");
  lines.push("お世話になっております。");
  lines.push(`${site.name || "(未入力)"}様の御見積の内訳を記載しましたのでご確認をお願いいたします。`);
  lines.push("");
  site.items.forEach(item => {
    const detail = getPriceDetail(item);
    if (!detail) return;
    const monthlyQty = Math.round(computeItem(item).monthlyAvg);
    lines.push(`${itemLabelPlain(item)}：1kg${detail.pricePerKg}円、月${monthlyQty}${detail.unitLabel}想定(1${detail.unitLabel}${detail.weightPerUnit}kgの場合)`);
  });
  if (site.includeSetupFee) {
    lines.push(`初回手数料:${SETUP_FEE.toLocaleString("ja-JP")}円`);
  }
  lines.push("");
  lines.push(`合計金額：${yen(summary.quoteTotal)}`);
  if (summary.unpricedCount > 0) {
    lines.push("");
    lines.push(`※単価未設定の品目（${summary.unpricedCount}種別）は上記に含まれていません。`);
  }
  return lines.join("\n");
}

// ------------------------------------------------------------------
// 契約書（Word/.docx）の生成
// 外部ライブラリを使わず、ZIP（storeモード）とOOXMLを直接組み立てて .docx を出力する。
// ------------------------------------------------------------------

const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16le(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
function u32le(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }

// files: [{ name, data: Uint8Array }] を、無圧縮（store）ZIPにまとめる。
function buildZip(files) {
  const DOS_TIME = 0x0000;
  const DOS_DATE = 0x0021; // 1980-01-01（DOS日付のダミー値）
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(file => {
    const nameBytes = encoder.encode(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new Uint8Array([
      ...u32le(0x04034b50), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(DOS_TIME), ...u16le(DOS_DATE),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0)
    ]);
    const localEntry = new Uint8Array(localHeader.length + nameBytes.length + data.length);
    localEntry.set(localHeader, 0);
    localEntry.set(nameBytes, localHeader.length);
    localEntry.set(data, localHeader.length + nameBytes.length);
    localParts.push(localEntry);

    const centralHeader = new Uint8Array([
      ...u32le(0x02014b50), ...u16le(20), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(DOS_TIME), ...u16le(DOS_DATE),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0), ...u16le(0), ...u16le(0), ...u16le(0),
      ...u32le(0), ...u32le(offset)
    ]);
    const centralEntry = new Uint8Array(centralHeader.length + nameBytes.length);
    centralEntry.set(centralHeader, 0);
    centralEntry.set(nameBytes, centralHeader.length);
    centralParts.push(centralEntry);

    offset += localEntry.length;
  });

  const centralSize = centralParts.reduce((sum, p) => sum + p.length, 0);
  const centralOffset = offset;
  const eocd = new Uint8Array([
    ...u32le(0x06054b50), ...u16le(0), ...u16le(0),
    ...u16le(files.length), ...u16le(files.length),
    ...u32le(centralSize), ...u32le(centralOffset), ...u16le(0)
  ]);

  const result = new Uint8Array(offset + centralSize + eocd.length);
  let pos = 0;
  localParts.forEach(p => { result.set(p, pos); pos += p.length; });
  centralParts.forEach(p => { result.set(p, pos); pos += p.length; });
  result.set(eocd, pos);
  return result;
}

function escapeXml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// テキスト（改行含む）を1つのランに変換。改行は<w:br/>で表現する。
function docxRun(text, opts = {}) {
  const rPrParts = [];
  if (opts.bold) rPrParts.push("<w:b/>");
  if (opts.size) rPrParts.push(`<w:sz w:val="${opts.size}"/><w:szCs w:val="${opts.size}"/>`);
  const rPr = rPrParts.length ? `<w:rPr>${rPrParts.join("")}</w:rPr>` : "";
  const lines = String(text).split("\n");
  const body = lines.map((line, i) => (i > 0 ? "<w:br/>" : "") + `<w:t xml:space="preserve">${escapeXml(line)}</w:t>`).join("");
  return `<w:r>${rPr}${body}</w:r>`;
}

// 段落（見出し／本文）を1つ生成。
function docxParagraph(text, opts = {}) {
  const pPrParts = [];
  if (opts.align) pPrParts.push(`<w:jc w:val="${opts.align}"/>`);
  const before = opts.spacingBefore !== undefined ? opts.spacingBefore : 0;
  const after = opts.spacingAfter !== undefined ? opts.spacingAfter : 120;
  pPrParts.push(`<w:spacing w:before="${before}" w:after="${after}"/>`);
  const pPr = `<w:pPr>${pPrParts.join("")}</w:pPr>`;
  return `<w:p>${pPr}${docxRun(text, opts)}</w:p>`;
}

// 案件データから、簡易な廃棄物収集運搬業務委託契約書の条文一式を組み立てる。
function generateContractParagraphs(site) {
  const summary = computeSite(site);
  const companyName = site.name || "（企業名未入力）";
  const paragraphs = [];

  paragraphs.push({ text: "廃棄物収集運搬業務委託契約書", bold: true, size: 32, align: "center", spacingAfter: 360 });
  paragraphs.push({
    text: `${companyName}（以下「甲」という。）と株式会社サキュレ（以下「乙」という。）は、甲の事業所から排出される廃棄物の収集運搬業務の委託に関し、次のとおり契約（以下「本契約」という。）を締結する。`
  });

  paragraphs.push({ text: "第1条（目的）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "本契約は、乙が甲の事業所から排出される廃棄物の収集運搬業務を受託するにあたり、甲乙間の権利義務関係を定めることを目的とする。" });

  paragraphs.push({ text: "第2条（業務内容）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "乙は、次の品目について、甲の事業所から廃棄物を収集運搬する。" });
  if (site.items.length) {
    site.items.forEach(item => {
      const c = computeItem(item);
      const label = itemLabel(item);
      const hasMax = item.qtyMax !== "" && item.qtyMax !== null && item.qtyMax !== undefined && !Number.isNaN(Number(item.qtyMax));
      const qtyText = hasMax && String(item.qtyMax) !== String(item.qtyMin) ? `${item.qtyMin}〜${item.qtyMax}` : `${item.qtyMin}`;
      paragraphs.push({ text: `・${label}：1回あたり${qtyText}個、週${item.daysPerWeek}回収集（月間想定 ${fmt(c.monthlyAvg)}個）` });
    });
  } else {
    paragraphs.push({ text: "・（品目が登録されていません）" });
  }

  paragraphs.push({ text: "第3条（委託料金）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: `1. 甲は乙に対し、本業務の対価として月額 ${yen(summary.monthlyCost)}（消費税別）を支払うものとする。` });
  let article3No = 2;
  if (site.includeSetupFee) {
    paragraphs.push({ text: `${article3No}. 甲は乙に対し、本契約締結時に初回手数料として ${yen(SETUP_FEE)}（消費税別）を別途支払うものとする。` });
    article3No++;
  }
  paragraphs.push({ text: `${article3No}. 実際の排出量が第2条に定める想定数量を著しく上回る場合、乙は甲と協議のうえ、前項の委託料金を改定できるものとする。` });
  article3No++;
  if (summary.minimumApplied) {
    paragraphs.push({ text: `${article3No}. 前項第1号の委託料金には、月額最低基本料金 ${yen(summary.minMonthlyFee)} を適用する。` });
  }

  paragraphs.push({ text: "第4条（契約期間）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "本契約の有効期間は、契約締結日から1年間とする。ただし、期間満了の1ヶ月前までに甲乙いずれからも文書による別段の意思表示がないときは、同一条件でさらに1年間自動更新されるものとし、以降も同様とする。" });

  paragraphs.push({ text: "第5条（支払方法）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "乙は、毎月末日をもって当月分の委託料金を締め、翌月末日までに甲へ請求するものとする。甲は、請求書記載の期日までに、乙が指定する銀行口座に振り込む方法により支払うものとする。振込手数料は甲の負担とする。" });

  paragraphs.push({ text: "第6条（作業条件）", bold: true, spacingBefore: 200 });
  if (site.workConditions && site.workConditions.trim()) {
    paragraphs.push({ text: "本業務に関する作業条件・特記事項は、次のとおりとする。" });
    paragraphs.push({ text: site.workConditions.trim() });
  } else {
    paragraphs.push({ text: "特記すべき作業条件はない。" });
  }

  paragraphs.push({ text: "第7条（免責事項）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "1. 天災地変その他不可抗力による損害については、乙はその責を負わないものとする。" });
  paragraphs.push({ text: "2. 収集作業開始直後に生じた事故等による損害についても、乙は返金その他の補償を行わないものとする。" });

  paragraphs.push({ text: "第8条（秘密保持）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "甲及び乙は、本契約の履行に関して知り得た相手方の業務上の秘密を、相手方の書面による承諾なく第三者に開示又は漏洩してはならない。" });

  paragraphs.push({ text: "第9条（解約）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "甲又は乙は、解約希望日の1ヶ月前までに書面（電子メールを含む。）により相手方に通知することにより、本契約を解約することができる。" });

  paragraphs.push({ text: "第10条（協議事項）", bold: true, spacingBefore: 200 });
  paragraphs.push({ text: "本契約に定めのない事項又は本契約の解釈に疑義が生じた事項については、甲乙誠実に協議のうえ解決するものとする。" });

  paragraphs.push({ text: "以上、本契約の成立を証するため、本書2通を作成し、甲乙記名押印のうえ、各自1通を保有する。", spacingBefore: 300 });
  paragraphs.push({ text: "　　　　年　　月　　日", spacingBefore: 300 });
  paragraphs.push({ text: "甲　住所：\n　　名称：" + companyName + "\n　　代表者：　　　　　　　　　　印", spacingBefore: 300 });
  paragraphs.push({ text: "乙　住所：\n　　名称：株式会社サキュレ\n　　代表者：　　　　　　　　　　印", spacingBefore: 300 });

  return paragraphs;
}

function buildContractDocxBlob(site) {
  const paragraphs = generateContractParagraphs(site);
  const bodyXml = paragraphs.map(p => docxParagraph(p.text, p)).join("");
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${bodyXml}
    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="720" w:footer="720" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const encoder = new TextEncoder();
  const zipBytes = buildZip([
    { name: "[Content_Types].xml", data: encoder.encode(contentTypesXml) },
    { name: "_rels/.rels", data: encoder.encode(relsXml) },
    { name: "word/document.xml", data: encoder.encode(documentXml) }
  ]);

  return new Blob([zipBytes], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

// ブラウザによってはダウンロードのファイル名に日本語が使えず「download」（拡張子なし）に
// 化けてしまうことがあるため、ファイル名は英数字のみ（日時ベース）にしておく。
function formatTimestampForFilename() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* フォールバックへ */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

    ? `<div>内訳合計 ${yen(summary.totalCost)} → 最低月額 ${yen(summary.minMonthlyFee)} を適用</div>`
    : "";

    ? `<div class="quote-warning">※このうち ${summary.unpricedCount} 種別は単価未設定のため金額に含まれていません。金額をご案内する前に必ず内訳をご確認ください。</div>`

  wrap.innerHTML = `

      </div>
      ${warningHtml}
      <label class="setup-fee-toggle">
        <input type="checkbox" data-role="setupFee" ${site.includeSetupFee ? "checked" : ""}>
        初回手数料（¥3,000）を含める
      </label>
      <div class="terms-section">
        <h3>見積前提条件（コピーしてお客様への文面にお使いください）</h3>
        <textarea data-role="termsText" readonly>${escapeHtml(termsText)}</textarea>
        <div class="terms-actions">
          <span class="copy-feedback" data-role="copyFeedback"></span>
          <button data-role="copyTerms">📋 コピーする</button>
        </div>
      </div>
      <div class="terms-section">
        <h3>見積内訳メール文面（社内共有用）</h3>
        <textarea data-role="breakdownEmailText" readonly>${escapeHtml(breakdownEmailText)}</textarea>
        <div class="terms-actions">
          <span class="copy-feedback" data-role="copyFeedback2"></span>
          <button data-role="copyBreakdownEmail">📋 コピーする</button>
        </div>
      </div>
      <div class="terms-section">
        <h3>契約書（Wordファイルをダウンロード）</h3>
        <p class="note" style="margin:0 0 10px;">品目・料金・作業条件をもとにした簡易な契約書の雛形です。住所・代表者名などは空欄になっているので、実際の契約締結前に内容を確認・加筆してください。<br>※ブラウザの都合上、ファイル名は「keiyakusho_日時.docx」になります（日本語ファイル名にできないため）。保存後、必要に応じてリネームしてください。</p>
        <div class="terms-actions" style="justify-content:flex-start;">
          <button data-role="downloadContract">📄 契約書をダウンロード（Word）</button>
        </div>
      </div>
    </div>
  `;

  wrap.querySelector('[data-role="back"]').addEventListener("click", () => {
    state.view = "list";
    render();
  });
  wrap.querySelector('[data-role="setupFee"]').addEventListener("change", (e) => {
    site.includeSetupFee = e.target.checked;
    render();
  });
  wrap.querySelector('[data-role="copyTerms"]').addEventListener("click", async (e) => {
    const ok = await copyTextToClipboard(termsText);
    const feedback = wrap.querySelector('[data-role="copyFeedback"]');
    feedback.textContent = ok ? "コピーしました！" : "コピーできませんでした。手動で選択してください。";
    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });
  wrap.querySelector('[data-role="copyBreakdownEmail"]').addEventListener("click", async (e) => {

    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });
  wrap.querySelector('[data-role="downloadContract"]').addEventListener("click", () => {
    const blob = buildContractDocxBlob(site);
    downloadBlob(blob, `keiyakusho_${formatTimestampForFilename()}.docx`);
  });

  frag.appendChild(wrap);
  return frag;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

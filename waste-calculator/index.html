<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃棄物コネクト 案件量計算ツール</title>
<style>
  /* ドラゴンクエスト風「青いウィンドウ」テーマ。ライト/ダーク切替でも見た目を統一する。 */
  :root {
    --bg: #050a28;
    --bg-accent: #0d1442;
    --panel: #1b1f6b;
    --border: #ffffff;
    --border-soft: rgba(255, 255, 255, 0.4);
    --text: #ffffff;
    --muted: #b9c6ff;
    --accent: #ffd23f;
    --accent-hover: #ffe27a;
    --accent-soft: rgba(255, 210, 63, 0.16);
    --accent-contrast: #1b1f6b;
    --accent2: #4fd8ff;
    --accent2-hover: #86e6ff;
    --danger: #ff5c5c;
    --danger-soft: rgba(255, 92, 92, 0.2);
    --header: #ffd23f;
    --shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
    --shadow-sm: 3px 3px 0 rgba(0, 0, 0, 0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #050a28; --bg-accent: #0d1442; --panel: #1b1f6b; --border: #ffffff; --border-soft: rgba(255, 255, 255, 0.4);
      --text: #ffffff; --muted: #b9c6ff; --accent: #ffd23f; --accent-hover: #ffe27a; --accent-soft: rgba(255, 210, 63, 0.16);
      --accent-contrast: #1b1f6b; --accent2: #4fd8ff; --accent2-hover: #86e6ff; --danger: #ff5c5c; --danger-soft: rgba(255, 92, 92, 0.2);
      --header: #ffd23f; --shadow: 4px 4px 0 rgba(0, 0, 0, 0.45); --shadow-sm: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #050a28; --bg-accent: #0d1442; --panel: #1b1f6b; --border: #ffffff; --border-soft: rgba(255, 255, 255, 0.4);
    --text: #ffffff; --muted: #b9c6ff; --accent: #ffd23f; --accent-hover: #ffe27a; --accent-soft: rgba(255, 210, 63, 0.16);
    --accent-contrast: #1b1f6b; --accent2: #4fd8ff; --accent2-hover: #86e6ff; --danger: #ff5c5c; --danger-soft: rgba(255, 92, 92, 0.2);
    --header: #ffd23f; --shadow: 4px 4px 0 rgba(0, 0, 0, 0.45); --shadow-sm: 3px 3px 0 rgba(0, 0, 0, 0.4);
  }
  :root[data-theme="light"] {
    --bg: #050a28; --bg-accent: #0d1442; --panel: #1b1f6b; --border: #ffffff; --border-soft: rgba(255, 255, 255, 0.4);
    --text: #ffffff; --muted: #b9c6ff; --accent: #ffd23f; --accent-hover: #ffe27a; --accent-soft: rgba(255, 210, 63, 0.16);
    --accent-contrast: #1b1f6b; --accent2: #4fd8ff; --accent2-hover: #86e6ff; --danger: #ff5c5c; --danger-soft: rgba(255, 92, 92, 0.2);
    --header: #ffd23f; --shadow: 4px 4px 0 rgba(0, 0, 0, 0.45); --shadow-sm: 3px 3px 0 rgba(0, 0, 0, 0.4);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  * { box-sizing: border-box; }
  body {
    font-family: "MS Gothic", "ＭＳ ゴシック", "Osaka－等幅", "Yu Gothic", "Noto Sans JP", monospace;
    background:
      radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,0.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 8%, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 30%, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 65% 60%, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 25% 75%, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 92% 85%, rgba(255,255,255,0.5) 50%, transparent 51%),
      linear-gradient(180deg, #050a28 0%, #0d1442 55%, #131c56 100%);
    background-attachment: fixed;
    color: var(--text);
    margin: 0;
    padding: 28px;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 1.6rem; font-weight: 700; margin: 0 0 6px; color: var(--header); text-wrap: balance;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    letter-spacing: 0.06em;
  }
  .subtitle { color: var(--muted); margin: 0 0 22px; font-size: 0.98rem; }
  .container { max-width: 1180px; margin: 0 auto; }
  .quote-container { max-width: 720px; margin: 0 auto; }
  .advanced-settings {
    background: var(--panel); border: 3px solid var(--border); border-radius: 4px;
    padding: 2px 16px; margin: 22px 0 20px; box-shadow: var(--shadow-sm);
  }
  .advanced-settings summary {
    cursor: pointer; padding: 12px 0; font-size: 0.88rem; color: var(--muted); font-weight: 600;
    list-style: none;
  }
  .advanced-settings summary::-webkit-details-marker { display: none; }
  .advanced-settings summary::before { content: "▸ "; color: var(--accent); }
  .advanced-settings[open] summary::before { content: "▾ "; color: var(--accent); }
  .advanced-settings-body { padding: 2px 0 16px; }
  .field-block { display: block; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
  .field-block input { display: block; margin-top: 6px; width: 100px; }
  input, select {
    font-family: inherit; font-size: 1.05rem; padding: 9px 12px;
    border: 2px solid var(--border); border-radius: 3px; background: var(--bg-accent); color: var(--text);
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    font-family: inherit; font-size: 0.98rem; font-weight: 600; cursor: pointer;
    border: 2px solid var(--border); border-radius: 3px; background: var(--panel);
    padding: 10px 18px 10px 26px; color: var(--text); position: relative;
    transition: color 0.1s ease; box-shadow: var(--shadow-sm);
  }
  button::before {
    content: "▶"; position: absolute; left: 9px; top: 50%; transform: translateY(-50%) scale(0);
    color: var(--accent); transition: transform 0.1s ease; font-size: 0.85em;
  }
  button:hover { color: var(--accent); }
  button:hover::before, button:focus-visible::before { transform: translateY(-50%) scale(1); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn-primary::before { color: var(--accent-contrast); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-contrast); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }
  .btn-danger::before { color: var(--danger); }
  .btn-quote {
    background: var(--accent2); color: var(--accent-contrast); border-color: var(--accent2);
    font-size: 1.05rem; padding: 12px 26px 12px 34px; font-weight: 700;
  }
  .btn-quote::before { color: var(--accent-contrast); }
  .btn-quote:hover { background: var(--accent2-hover); border-color: var(--accent2-hover); color: var(--accent-contrast); }
  .site-card {
    background: var(--panel); border: 3px solid var(--border); border-radius: 4px;
    padding: 22px; margin-bottom: 24px; box-shadow: var(--shadow), inset 0 0 0 2px rgba(255,255,255,0.18);
  }
  .site-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .site-name-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px; }
  .site-name-field .field-label-text { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .required-badge { color: var(--danger); font-size: 0.7rem; font-weight: 700; margin-left: 4px; }
  .site-head input[type=text] { font-size: 1.15rem; font-weight: 700; }
  button[disabled] { opacity: 0.45; cursor: not-allowed; }
  button[disabled]:hover { color: var(--text); background: var(--panel); border-color: var(--border); }
  button[disabled]:hover::before { transform: translateY(-50%) scale(0); }
  table { border-collapse: collapse; width: 100%; font-size: 1rem; }
  thead th {
    text-align: left; color: var(--muted); font-weight: 700; font-size: 0.9rem;
    padding: 8px 10px; border-bottom: 2px solid var(--border-soft); white-space: nowrap;
  }
  tbody td { padding: 10px 10px; vertical-align: middle; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  .num-col { text-align: right; }
  .monthly-qty-value { font-size: 1.2rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .monthly-qty-value .qty-unit { font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .qty-range-note { display: block; font-size: 0.8rem; }
  .qty-pair { display: flex; align-items: center; gap: 6px; }
  .qty-pair input { width: 68px; }
  .row-actions { text-align: center; }
  .row-actions button { padding: 6px 12px; }
  .row-actions button::before { content: none; }
  .site-summary {
    display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px;
    border-top: 2px dashed var(--border); font-size: 1.05rem;
  }
  .site-summary .stat {
    background: var(--bg-accent); border: 2px solid var(--border-soft); border-radius: 3px; padding: 10px 18px; min-width: 140px;
  }
  .site-summary .stat b { display: block; font-size: 1.4rem; font-weight: 700; color: var(--header); font-variant-numeric: tabular-nums; }
  .site-summary .stat span { color: var(--muted); font-size: 0.85rem; }
  .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 12px; }
  .add-row-btn { margin-top: 10px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 0.92rem; margin-top: 10px; }
  select.type-select { min-width: 110px; }
  .custom-type-input { width: 100px; }
  footer { text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 30px; }
  .table-scroll { overflow-x: auto; }

  /* 金額提示画面 */
  .quote-screen {
    background: var(--panel); border: 3px solid var(--border); border-radius: 4px;
    padding: 40px 32px; box-shadow: var(--shadow), inset 0 0 0 2px rgba(255,255,255,0.18); text-align: center;
  }
  .quote-screen .quote-site-name { font-size: 1.1rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .quote-screen .quote-headline { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0 0 18px; }
  .quote-amount-big {
    font-size: 3.4rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
    line-height: 1.15; margin: 6px 0 10px;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .quote-screen .quote-breakdown { font-size: 0.95rem; color: var(--muted); margin: 4px 0 20px; }
  .quote-screen .quote-breakdown div { margin: 2px 0; }
  .setup-fee-toggle {
    display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 600; color: var(--text);
    background: var(--bg-accent); border: 2px solid var(--border-soft); padding: 10px 18px; border-radius: 3px; cursor: pointer; margin-bottom: 22px;
  }
  .setup-fee-toggle input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .monster-encounter {
    margin: 4px 0 20px; padding: 14px 16px; background: var(--bg-accent); border: 2px solid var(--border-soft);
    border-radius: 3px;
  }
  .monster-emoji { font-size: 2.2rem; line-height: 1.2; animation: monster-bounce 1.4s ease-in-out infinite; }
  .monster-name { font-size: 1.05rem; font-weight: 700; color: var(--header); margin-top: 4px; }
  .monster-level { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  @keyframes monster-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .quote-warning {
    background: var(--danger-soft); color: var(--danger); border: 2px solid var(--danger); border-radius: 3px; padding: 10px 16px;
    font-size: 0.92rem; margin: 0 0 18px; text-align: left;
  }
  .back-btn { margin-bottom: 20px; }

  /* 最低基本料金 */
  .min-fee-panel {
    margin-top: 16px; padding: 14px 18px; border-radius: 3px; background: var(--bg-accent); border: 2px solid var(--border-soft);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .min-fee-panel label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
  .min-fee-panel input { width: 120px; }

  /* 入力バリデーション */
  .input-error { border-color: var(--danger) !important; background: var(--danger-soft) !important; }
  .field-error { color: var(--danger); font-size: 0.78rem; margin-top: 2px; display: block; }

  /* 見積前提条件 */
  .terms-section { margin-top: 22px; text-align: left; }
  .terms-section h3 { font-size: 0.98rem; color: var(--header); margin: 0 0 8px; }
  .terms-section textarea {
    width: 100%; min-height: 180px; font-family: inherit; font-size: 0.9rem; padding: 14px;
    border-radius: 3px; border: 2px solid var(--border); background: var(--bg-accent); color: var(--text); resize: vertical;
  }
  .terms-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px; }
  .copy-feedback { color: var(--accent2); font-size: 0.9rem; font-weight: 700; }
  .work-conditions-field { margin-top: 14px; }
  .work-conditions-field label { display: block; font-size: 0.9rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .work-conditions-field textarea {
    width: 100%; min-height: 70px; font-family: inherit; font-size: 1rem; padding: 10px 12px;
    border-radius: 3px; border: 2px solid var(--border); background: var(--bg-accent); color: var(--text); resize: vertical;
  }

  /* 使い方・単価表 */
  .guide-screen {
    background: var(--panel); border: 3px solid var(--border); border-radius: 4px;
    padding: 28px 30px; box-shadow: var(--shadow-sm), inset 0 0 0 2px rgba(255,255,255,0.18); text-align: left;
  }
  .guide-screen h2 { font-size: 1.1rem; color: var(--header); margin: 24px 0 12px; }
  .guide-screen h2:first-child { margin-top: 0; }
  .guide-steps { margin: 0; padding-left: 1.4em; }
  .guide-steps li { margin-bottom: 10px; line-height: 1.7; }
  .guide-price-table { font-size: 1rem; }
  .guide-price-table th, .guide-price-table td { padding: 8px 12px; }
  .guide-price-table thead th { background: var(--accent-soft); border-bottom: none; }
  .guide-price-table tbody tr:nth-child(odd) { background: var(--bg-accent); }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const STORAGE_KEY = "haikibutsu-connect-calc-v1";

const TYPE_PRESETS = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル", "段ボール", "その他"];

// 袋サイズ・重量・単価の前提（詳しくは「使い方・単価表」画面にも一覧を表示）。
// 可燃ごみ：45L≈5kg・70L≈8kg、不燃ごみ：45L≈3kg・70L≈5kg、段ボール：1枚≈1kg。
// これらの重量に、可燃40円/kg・不燃100円/kg・段ボール35円/kgを掛けた金額が下記の単価。
const BAG_SIZES = [45, 70];
const BAG_SIZE_TYPES = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル"];
const PRICE_PER_KG = { "可燃ごみ": 40, "不燃ごみ": 100, "段ボール": 35 };
const WEIGHT_TABLE = {
  "可燃ごみ": { 45: 5, 70: 8 },
  "不燃ごみ": { 45: 3, 70: 5 }
};
const CARDBOARD_WEIGHT_PER_SHEET = 1; // kg/枚

// 入力画面には出さず、金額提示のときだけ内部で使う1個あたりの単価テーブル。
const PRICE_TABLE = {
  "可燃ごみ": { 45: WEIGHT_TABLE["可燃ごみ"][45] * PRICE_PER_KG["可燃ごみ"], 70: WEIGHT_TABLE["可燃ごみ"][70] * PRICE_PER_KG["可燃ごみ"] },
  "不燃ごみ": { 45: WEIGHT_TABLE["不燃ごみ"][45] * PRICE_PER_KG["不燃ごみ"], 70: WEIGHT_TABLE["不燃ごみ"][70] * PRICE_PER_KG["不燃ごみ"] },
  "段ボール": CARDBOARD_WEIGHT_PER_SHEET * PRICE_PER_KG["段ボール"]
};

function getUnitPrice(item) {
  const entry = PRICE_TABLE[item.type];
  if (entry === undefined) return undefined;
  if (typeof entry === "number") return entry;
  return entry[item.bagSize];
}

const SETUP_FEE = 3000;
const DEFAULT_MIN_MONTHLY_FEE = 5000;

// 金額提示画面のお楽しみ要素：金額が2,000円上がるごとに、より強いモンスターが出現する。
const MONSTER_TIER_STEP = 2000; // 円
const MONSTER_TIERS = [
  { name: "スライム", emoji: "🟢" },
  { name: "ドラキー", emoji: "🦇" },
  { name: "ゴースト", emoji: "👻" },
  { name: "ゴブリン", emoji: "👺" },
  { name: "コボルト", emoji: "🐺" },
  { name: "マタンゴ", emoji: "🍄" },
  { name: "さまようよろい", emoji: "🛡️" },
  { name: "しにがみ", emoji: "💀" },
  { name: "キラーパンサー", emoji: "🐆" },
  { name: "ゴーレム", emoji: "🗿" },
  { name: "デビルアーマー", emoji: "⚔️" },
  { name: "キメラ", emoji: "🦅" },
  { name: "リッチ", emoji: "🧙" },
  { name: "ドラゴン", emoji: "🐉" },
  { name: "だいまどう", emoji: "🔮" },
  { name: "まおう", emoji: "👑" }
];

function getMonsterTier(amount) {
  const idx = Math.min(Math.floor(Math.max(amount, 0) / MONSTER_TIER_STEP), MONSTER_TIERS.length - 1);
  return { ...MONSTER_TIERS[idx], level: idx + 1 };
}

function uid() { return Math.random().toString(36).slice(2, 10); }

function defaultItem(type) {
  return {
    id: uid(),
    type: type || "可燃ごみ",
    customType: "",
    bagSize: 45,
    qtyMin: 1,
    qtyMax: 2,
    daysPerWeek: 5
  };
}

function defaultSite(name) {
  return {
    id: uid(),
    name: name || "",
    includeSetupFee: true,
    minMonthlyFee: DEFAULT_MIN_MONTHLY_FEE,
    workConditions: "",
    items: [
      defaultItem("可燃ごみ"),
      defaultItem("不燃ごみ")
    ]
  };
}

let state = loadState();
let advancedSettingsOpen = false; // render()毎にDOMを作り直すため、開閉状態はここで別管理する

function migrateSite(site) {
  if (site.minMonthlyFee === undefined) site.minMonthlyFee = DEFAULT_MIN_MONTHLY_FEE;
  if (site.workConditions === undefined) site.workConditions = "";
  if (site.includeSetupFee === undefined) site.includeSetupFee = true;
  (site.items || []).forEach(item => {
    if (item.bagSize === undefined) item.bagSize = 45;
  });
  return site;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.view) parsed.view = "list";
      parsed.sites = (parsed.sites || []).map(migrateSite);
      return parsed;
    }
  } catch (e) { /* ignore */ }
  return { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("")] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 数値入力の検証：空欄は許可、マイナス値や数値として解釈できない値はエラー扱いにする。
// 計算には使わせず（0として扱う）、入力欄を赤く縁取りしてエラー文言を出す。
function validateNumberField(rawValue, { min = 0, allowBlank = true, fallback = 0 } = {}) {
  if (rawValue === "" || rawValue === null || rawValue === undefined) {
    return allowBlank
      ? { invalid: false, value: fallback }
      : { invalid: true, message: "数値を入力してください", value: fallback };
  }
  const num = Number(rawValue);
  if (Number.isNaN(num) || !Number.isFinite(num)) {
    return { invalid: true, message: "数値を入力してください", value: fallback };
  }
  if (num < min) {
    return { invalid: true, message: `${min}以上の値を入力してください`, value: fallback };
  }
  return { invalid: false, value: num };
}

function validateRequiredText(value) {
  const trimmed = (value || "").trim();
  if (!trimmed) return { invalid: true, message: "企業名を入力してください" };
  return { invalid: false };
}

function markFieldValidity(inputEl, result) {
  inputEl.classList.toggle("input-error", result.invalid);
  const container = inputEl.closest("td, label") || inputEl.parentElement;
  const errorEl = container ? container.querySelector(".field-error") : null;
  if (errorEl) errorEl.textContent = result.invalid ? result.message : "";
}

// monthly avg / min / max quantity for an item
function computeItem(item) {
  const weeks = validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }).value;
  const qtyMin = validateNumberField(item.qtyMin).value;
  // 最大値が未入力なら「範囲」ではなく最小値と同じ単一の数量として扱う
  const qtyMaxRaw = item.qtyMax;
  const hasMax = qtyMaxRaw !== "" && qtyMaxRaw !== null && qtyMaxRaw !== undefined && !Number.isNaN(Number(qtyMaxRaw));
  const qtyMax = hasMax ? validateNumberField(qtyMaxRaw).value : qtyMin;
  // 表示用の範囲は常に小さい方〜大きい方の順にする（数量maxに数量min未満の値を入れても逆転表示にならないように）
  const qtyLo = Math.min(qtyMin, qtyMax);
  const qtyHi = Math.max(qtyMin, qtyMax);
  const avg = (qtyMin + qtyMax) / 2;
  const days = validateNumberField(item.daysPerWeek).value;

  const monthlyMin = qtyLo * days * weeks;
  const monthlyMax = qtyHi * days * weeks;
  const monthlyAvg = avg * days * weeks;

  return { monthlyMin, monthlyMax, monthlyAvg };
}

function itemLabelPlain(item) {
  return item.type === "その他" ? (item.customType || "その他") : item.type;
}

function itemLabel(item) {
  const base = itemLabelPlain(item);
  return BAG_SIZE_TYPES.includes(item.type) ? `${base}(${item.bagSize}L)` : base;
}

// 種別・袋サイズから、社内共有メール向けの「1kg◯円、月◯袋想定(1袋◯kgの場合)」を組み立てるための重量・単価情報。
function getPriceDetail(item) {
  const pricePerKg = PRICE_PER_KG[item.type];
  if (pricePerKg === undefined) return null;
  if (item.type === "段ボール") {
    return { pricePerKg, weightPerUnit: CARDBOARD_WEIGHT_PER_SHEET, unitLabel: "枚" };
  }
  if (WEIGHT_TABLE[item.type]) {
    return { pricePerKg, weightPerUnit: WEIGHT_TABLE[item.type][item.bagSize], unitLabel: "袋" };
  }
  return null;
}

function computeSite(site) {
  let totalQty = 0, totalCost = 0, pricedCount = 0, unpricedCount = 0;
  const breakdown = [];
  site.items.forEach(item => {
    const monthlyAvg = computeItem(item).monthlyAvg;
    totalQty += monthlyAvg;
    const unitPrice = getUnitPrice(item);
    if (unitPrice !== undefined) {
      const cost = monthlyAvg * unitPrice;
      totalCost += cost;
      pricedCount++;
      breakdown.push({ label: itemLabel(item), qty: monthlyAvg, unitPrice, cost });
    } else {
      unpricedCount++;
    }
  });

  const minMonthlyFee = validateNumberField(site.minMonthlyFee).value;
  const minimumApplied = totalCost < minMonthlyFee;
  const monthlyCost = minimumApplied ? minMonthlyFee : totalCost;
  const setupFee = site.includeSetupFee ? SETUP_FEE : 0;
  const quoteTotal = monthlyCost + setupFee;

  return { totalQty, totalCost, monthlyCost, minimumApplied, minMonthlyFee, setupFee, quoteTotal, breakdown, pricedCount, unpricedCount };
}

function fmt(n, digits = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function yen(n) { return "¥" + n.toLocaleString("ja-JP", { maximumFractionDigits: 0 }); }

// render()は毎回DOMを丸ごと作り直すため、そのままだと入力中の要素がフォーカスを失い、
// 1文字打つたびに入力が止まってしまう。再描画の前後でフォーカス位置・カーソル位置を記録して復元する。
function captureFocus() {
  const active = document.activeElement;
  if (!active || !active.dataset || !active.dataset.role) return null;
  const siteCard = active.closest("[data-site-id]");
  const itemRow = active.closest("[data-item-id]");
  return {
    role: active.dataset.role,
    siteId: siteCard ? siteCard.dataset.siteId : null,
    itemId: itemRow ? itemRow.dataset.itemId : null,
    selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
    selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null
  };
}

function restoreFocus(info) {
  if (!info) return;
  let scope = document;
  if (info.siteId) {
    scope = document.querySelector(`[data-site-id="${info.siteId}"]`) || document;
  }
  if (info.itemId && scope !== document) {
    scope = scope.querySelector(`[data-item-id="${info.itemId}"]`) || scope;
  }
  const el = scope.querySelector(`[data-role="${info.role}"]`);
  if (!el) return;
  el.focus();
  if (info.selectionStart !== null && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(info.selectionStart, info.selectionEnd); } catch (e) { /* ignore */ }
  }
}

function render() {
  const focusInfo = captureFocus();
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view === "quote") {
    const site = state.sites.find(s => s.id === state.activeSiteId);
    if (!site) { state.view = "list"; saveState(); return render(); }
    app.appendChild(renderQuoteScreen(site));
  } else if (state.view === "guide") {
    app.appendChild(renderGuideScreen());
  } else {
    app.appendChild(renderListScreen());
  }
  restoreFocus(focusInfo);
  saveState();
}

// 契約時のトラブル防止のための「見積前提条件」文面を、入力済みの項目から自動で組み立てる。
function generateTermsText(site) {
  const lines = [];
  lines.push("【お見積り前提条件】");
  lines.push(`企業名：${site.name || "(未入力)"}`);
  lines.push("下記の内容を前提として、本お見積りを算定しております。");
  lines.push("");
  if (site.items.length) {
    site.items.forEach(item => {
      const c = computeItem(item);
      const label = itemLabel(item);
      const hasMax = item.qtyMax !== "" && item.qtyMax !== null && item.qtyMax !== undefined && !Number.isNaN(Number(item.qtyMax));
      const qtyText = hasMax && String(item.qtyMax) !== String(item.qtyMin) ? `${item.qtyMin}〜${item.qtyMax}` : `${item.qtyMin}`;
      lines.push(`・${label}：1回あたり${qtyText}個、週${item.daysPerWeek}回収集（月間想定 ${fmt(c.monthlyAvg)}個）`);
    });
  } else {
    lines.push("・（品目が登録されていません）");
  }
  lines.push("");
  if (site.workConditions && site.workConditions.trim()) {
    lines.push("【作業条件・特記事項】");
    lines.push(site.workConditions.trim());
    lines.push("");
  }
  lines.push("実際の排出量が上記の想定数量を大きく上回る場合、または収集頻度・排出場所などの条件に変更が生じた場合は、");
  lines.push("別途お見積りを再算定させていただく場合がございますので、あらかじめご了承ください。");
  return lines.join("\n");
}

// 社内共有用の見積内訳文面（担当者が実際に使っている「1kg◯円、月◯袋想定(1袋◯kgの場合)」の形式）。
function generateBreakdownEmailText(site) {
  const summary = computeSite(site);
  const lines = [];
  lines.push(`件名：${site.name || "(未入力)"} 御見積のご案内`);
  lines.push("");
  lines.push("お世話になっております。");
  lines.push(`${site.name || "(未入力)"}様の御見積の内訳を記載しましたのでご確認をお願いいたします。`);
  lines.push("");
  site.items.forEach(item => {
    const detail = getPriceDetail(item);
    if (!detail) return;
    const monthlyQty = Math.round(computeItem(item).monthlyAvg);
    lines.push(`${itemLabelPlain(item)}：1kg${detail.pricePerKg}円、月${monthlyQty}${detail.unitLabel}想定(1${detail.unitLabel}${detail.weightPerUnit}kgの場合)`);
  });
  if (site.includeSetupFee) {
    lines.push(`初回手数料:${SETUP_FEE.toLocaleString("ja-JP")}円`);
  }
  lines.push("");
  lines.push(`合計金額：${yen(summary.quoteTotal)}`);
  if (summary.unpricedCount > 0) {
    lines.push("");
    lines.push(`※単価未設定の品目（${summary.unpricedCount}種別）は上記に含まれていません。`);
  }
  return lines.join("\n");
}

async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* フォールバックへ */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

    const ok = await copyTextToClipboard(breakdownEmailText);
    const feedback = wrap.querySelector('[data-role="copyFeedback2"]');
    feedback.textContent = ok ? "コピーしました！" : "コピーできませんでした。手動で選択してください。";
    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });

  frag.appendChild(wrap);
  return frag;
}

function renderGuideScreen() {
  const frag = document.createDocumentFragment();
  const wrap = document.createElement("div");

  const priceRows = [];
  ["可燃ごみ", "不燃ごみ"].forEach(type => {
    BAG_SIZES.forEach(size => {
      const weight = WEIGHT_TABLE[type][size];
      priceRows.push({ type, size: `${size}L`, weight: `${weight}kg`, perKg: `${PRICE_PER_KG[type]}円/kg`, unitPrice: PRICE_TABLE[type][size] });
    });
  });
  priceRows.push({ type: "段ボール", size: "(1枚)", weight: `${CARDBOARD_WEIGHT_PER_SHEET}kg`, perKg: `${PRICE_PER_KG["段ボール"]}円/kg`, unitPrice: PRICE_TABLE["段ボール"] });

  const priceTableHtml = priceRows.map(r => `
    <tr>
      <td>${escapeHtml(r.type)}</td>
      <td>${escapeHtml(r.size)}</td>
      <td class="num-col">${escapeHtml(r.weight)}</td>
      <td class="num-col">${escapeHtml(r.perKg)}</td>
      <td class="num-col">${yen(r.unitPrice)}</td>
    </tr>
  `).join("");

  wrap.innerHTML = `
    <button class="back-btn" data-role="back">← 入力画面に戻る</button>
    <div class="guide-screen">
      <h2>📖 使い方</h2>
      <ol class="guide-steps">
        <li>「＋ 案件を追加」でお客様の案件を1件作成し、企業名（必須）を入力します。</li>
        <li>品目ごとに「種別」「袋サイズ（45L／70L）」「1回あたり数量」「頻度（週◯回）」を入力します。
          数量が「1〜2袋」のように幅がある場合は両方、「2袋」のように1つだけの場合は数量maxを空欄にします。</li>
        <li>必要に応じて「最低基本料金」「作業条件・特記事項」を編集します。</li>
        <li>「💰 金額提示」ボタンを押すと、お客様にご案内する金額と見積前提条件の文面が表示されます。</li>
      </ol>

      <h2>💴 単価・重量表</h2>
      <p class="note" style="margin:0 0 10px;">
        袋の重量は実測値をもとにした目安です。「1個あたり単価」＝ 想定重量 × 単価(円/kg) を、金額提示の際に内部で使用しています。
      </p>
      <div class="table-scroll">
        <table class="guide-price-table">
          <thead>
            <tr>
              <th>種別</th>
              <th>袋サイズ</th>
              <th class="num-col">想定重量</th>
              <th class="num-col">単価(円/kg)</th>
              <th class="num-col">1個あたり単価</th>
            </tr>
          </thead>
          <tbody>${priceTableHtml}</tbody>
        </table>
      </div>
      <p class="note">
        ・生ごみ／瓶／缶／ペットボトルは袋サイズを選べますが、単価が未確定のため金額計算には含まれません（単価が分かり次第、対応します）。<br>
        ・初回手数料：¥${SETUP_FEE.toLocaleString("ja-JP")}（新規契約時、金額提示画面のチェックボックスでON/OFF可能）。<br>
        ・最低基本料金：既定 ¥${DEFAULT_MIN_MONTHLY_FEE.toLocaleString("ja-JP")}。案件ごとに変更でき、計算した月額がこれを下回ると自動的に引き上がります。
      </p>
    </div>
  `;

  wrap.querySelector('[data-role="back"]').addEventListener("click", () => {
    state.view = "list";
    render();
  });

  frag.appendChild(wrap);
  return frag;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

render();
</script>
</body>
</html>

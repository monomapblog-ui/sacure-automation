<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃棄物コネクト 案件量計算ツール</title>
<style>
  :root {
    --bg: #fff6f9;
    --bg-accent: #eefaf3;
    --panel: #ffffff;
    --border: #ffd9e6;
    --border-soft: #fff0f5;
    --text: #4a3540;
    --muted: #b48a9c;
    --accent: #5fcf9a;
    --accent-hover: #45bd85;
    --accent-soft: #e3f9ee;
    --accent-contrast: #ffffff;
    --pink: #ff8fab;
    --pink-hover: #ff6f95;
    --danger: #ff8fab;
    --danger-soft: #ffe6ee;
    --header: #ec6c96;
    --shadow: 0 6px 18px rgba(255, 143, 171, 0.18);
    --shadow-sm: 0 3px 10px rgba(255, 143, 171, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241823;
      --bg-accent: #1c2620;
      --panel: #2f202d;
      --border: #4d3348;
      --border-soft: #3a2837;
      --text: #f5e6ef;
      --muted: #c99cb5;
      --accent: #6bdba0;
      --accent-hover: #82e6b2;
      --accent-soft: #253a2f;
      --accent-contrast: #1c2620;
      --pink: #ff9dc0;
      --pink-hover: #ffb0cd;
      --danger: #ff9dc0;
      --danger-soft: #3d2333;
      --header: #ff9dc0;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #241823; --bg-accent: #1c2620; --panel: #2f202d; --border: #4d3348; --border-soft: #3a2837;
    --text: #f5e6ef; --muted: #c99cb5; --accent: #6bdba0; --accent-hover: #82e6b2; --accent-soft: #253a2f;
    --accent-contrast: #1c2620; --pink: #ff9dc0; --pink-hover: #ffb0cd; --danger: #ff9dc0; --danger-soft: #3d2333;
    --header: #ff9dc0; --shadow: 0 6px 20px rgba(0, 0, 0, 0.35); --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #fff6f9; --bg-accent: #eefaf3; --panel: #ffffff; --border: #ffd9e6; --border-soft: #fff0f5;
    --text: #4a3540; --muted: #b48a9c; --accent: #5fcf9a; --accent-hover: #45bd85; --accent-soft: #e3f9ee;
    --accent-contrast: #ffffff; --pink: #ff8fab; --pink-hover: #ff6f95; --danger: #ff8fab; --danger-soft: #ffe6ee;
    --header: #ec6c96; --shadow: 0 6px 18px rgba(255, 143, 171, 0.18); --shadow-sm: 0 3px 10px rgba(255, 143, 171, 0.14);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
    background-attachment: fixed;
    color: var(--text);
    margin: 0;
    padding: 28px;
    line-height: 1.6;
  }
  h1 { font-size: 2.1rem; margin: 0 0 6px; color: var(--header); text-wrap: balance; }
  .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 1.1rem; }
  .container { max-width: 1180px; margin: 0 auto; }
  .quote-container { max-width: 720px; margin: 0 auto; }
  .global-bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .global-bar label { font-size: 1.05rem; color: var(--muted); }
  .global-bar input { width: 100px; }
  input, select {
    font-family: inherit; font-size: 1.15rem; padding: 9px 12px;
    border: 2px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text);
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px var(--danger-soft); }
  button {
    font-family: inherit; font-size: 1.08rem; font-weight: 600; cursor: pointer;
    border: 2px solid var(--border); border-radius: 999px; background: var(--panel);
    padding: 10px 20px; color: var(--text); transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn-quote {
    background: linear-gradient(135deg, var(--pink) 0%, var(--header) 100%); color: #ffffff; border-color: transparent;
    font-size: 1.15rem; padding: 12px 26px;
  }
  .btn-quote:hover { filter: brightness(1.06); border-color: transparent; }
  .site-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 22px;
    padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .site-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .site-head input[type=text] { font-size: 1.3rem; font-weight: 700; flex: 1; min-width: 200px; }
  table { border-collapse: collapse; width: 100%; font-size: 1.1rem; }
  thead th {
    text-align: left; color: var(--muted); font-weight: 700; font-size: 0.9rem;
    padding: 8px 10px; border-bottom: 2px solid var(--border-soft); white-space: nowrap;
  }
  tbody td { padding: 10px 10px; vertical-align: middle; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  .num-col { text-align: right; }
  .qty-pair { display: flex; align-items: center; gap: 6px; }
  .qty-pair input { width: 68px; }
  .row-actions { text-align: center; }
  .site-summary {
    display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px;
    border-top: 2px dashed var(--border); font-size: 1.05rem;
  }
  .site-summary .stat {
    background: var(--accent-soft); border-radius: 16px; padding: 10px 18px; min-width: 140px;
  }
  .site-summary .stat b { display: block; font-size: 1.6rem; color: var(--header); font-variant-numeric: tabular-nums; }
  .site-summary .stat span { color: var(--muted); font-size: 0.92rem; }
  .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 12px; }
  .add-row-btn { margin-top: 10px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 0.92rem; margin-top: 10px; }
  select.type-select { min-width: 110px; }
  .custom-type-input { width: 100px; }
  footer { text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 30px; }
  .table-scroll { overflow-x: auto; }

  /* 金額提示画面 */
  .quote-screen {
    background: var(--panel); border: 1px solid var(--border); border-radius: 26px;
    padding: 40px 32px; box-shadow: var(--shadow); text-align: center;
  }
  .quote-screen .quote-site-name { font-size: 1.3rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .quote-screen .quote-headline { font-size: 1.2rem; font-weight: 700; color: var(--header); margin: 0 0 18px; }
  .quote-amount-big {
    font-size: 4.2rem; font-weight: 800; color: var(--header); font-variant-numeric: tabular-nums;
    line-height: 1.15; margin: 6px 0 10px;
  }
  .quote-screen .quote-breakdown { font-size: 1rem; color: var(--muted); margin: 4px 0 20px; }
  .quote-screen .quote-breakdown div { margin: 2px 0; }
  .setup-fee-toggle {
    display: inline-flex; align-items: center; gap: 10px; font-size: 1.02rem; font-weight: 600; color: var(--text);
    background: var(--accent-soft); padding: 10px 18px; border-radius: 999px; cursor: pointer; margin-bottom: 22px;
  }
  .setup-fee-toggle input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--pink); cursor: pointer; }
  .quote-warning {
    background: var(--danger-soft); color: var(--header); border-radius: 12px; padding: 10px 16px;
    font-size: 0.92rem; margin: 0 0 18px; text-align: left;
  }
  .back-btn { margin-bottom: 20px; }

  /* 最低基本料金 */
  .min-fee-panel {
    margin-top: 16px; padding: 14px 18px; border-radius: 16px; background: var(--accent-soft);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .min-fee-panel label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
  .min-fee-panel input { width: 120px; }

  /* 入力バリデーション */
  .input-error { border-color: var(--header) !important; background: var(--danger-soft) !important; }
  .field-error { color: var(--header); font-size: 0.78rem; margin-top: 2px; display: block; }

  /* 見積前提条件 */
  .terms-section { margin-top: 22px; text-align: left; }
  .terms-section h3 { font-size: 1.05rem; color: var(--header); margin: 0 0 8px; }
  .terms-section textarea {
    width: 100%; min-height: 180px; font-family: inherit; font-size: 0.95rem; padding: 14px;
    border-radius: 14px; border: 2px solid var(--border); background: var(--bg-accent); color: var(--text); resize: vertical;
  }
  .terms-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px; }
  .copy-feedback { color: var(--accent-hover); font-size: 0.9rem; font-weight: 700; }
  .work-conditions-field { margin-top: 14px; }
  .work-conditions-field label { display: block; font-size: 0.9rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .work-conditions-field textarea {
    width: 100%; min-height: 70px; font-family: inherit; font-size: 1rem; padding: 10px 12px;
    border-radius: 12px; border: 2px solid var(--border); background: var(--panel); color: var(--text); resize: vertical;
  }

  /* 使い方・単価表 */
  .guide-screen {
    background: var(--panel); border: 1px solid var(--border); border-radius: 22px;
    padding: 28px 30px; box-shadow: var(--shadow); text-align: left;
  }
  .guide-screen h2 { font-size: 1.25rem; color: var(--header); margin: 24px 0 12px; }
  .guide-screen h2:first-child { margin-top: 0; }
  .guide-steps { margin: 0; padding-left: 1.4em; }
  .guide-steps li { margin-bottom: 10px; line-height: 1.7; }
  .guide-price-table { font-size: 1rem; }
  .guide-price-table th, .guide-price-table td { padding: 8px 12px; }
  .guide-price-table thead th { background: var(--accent-soft); border-bottom: none; }
  .guide-price-table tbody tr:nth-child(odd) { background: var(--bg-accent); }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const STORAGE_KEY = "haikibutsu-connect-calc-v1";

const TYPE_PRESETS = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル", "段ボール", "その他"];

// 袋サイズ・重量・単価の前提（詳しくは「使い方・単価表」画面にも一覧を表示）。
// 可燃ごみ：45L≈5kg・70L≈8kg、不燃ごみ：45L≈3kg・70L≈5kg、段ボール：1枚≈1kg。
// これらの重量に、可燃40円/kg・不燃100円/kg・段ボール35円/kgを掛けた金額が下記の単価。
const BAG_SIZES = [45, 70];
const BAG_SIZE_TYPES = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル"];
const PRICE_PER_KG = { "可燃ごみ": 40, "不燃ごみ": 100, "段ボール": 35 };
const WEIGHT_TABLE = {
  "可燃ごみ": { 45: 5, 70: 8 },
  "不燃ごみ": { 45: 3, 70: 5 }
};
const CARDBOARD_WEIGHT_PER_SHEET = 1; // kg/枚

// 入力画面には出さず、金額提示のときだけ内部で使う1個あたりの単価テーブル。
const PRICE_TABLE = {
  "可燃ごみ": { 45: WEIGHT_TABLE["可燃ごみ"][45] * PRICE_PER_KG["可燃ごみ"], 70: WEIGHT_TABLE["可燃ごみ"][70] * PRICE_PER_KG["可燃ごみ"] },
  "不燃ごみ": { 45: WEIGHT_TABLE["不燃ごみ"][45] * PRICE_PER_KG["不燃ごみ"], 70: WEIGHT_TABLE["不燃ごみ"][70] * PRICE_PER_KG["不燃ごみ"] },
  "段ボール": CARDBOARD_WEIGHT_PER_SHEET * PRICE_PER_KG["段ボール"]
};

function getUnitPrice(item) {
  const entry = PRICE_TABLE[item.type];
  if (entry === undefined) return undefined;
  if (typeof entry === "number") return entry;
  return entry[item.bagSize];
}

const SETUP_FEE = 3000;
const DEFAULT_MIN_MONTHLY_FEE = 5000;

function uid() { return Math.random().toString(36).slice(2, 10); }

function defaultItem(type) {
  return {
    id: uid(),
    type: type || "可燃ごみ",
    customType: "",
    bagSize: 45,
    qtyMin: 1,
    qtyMax: 2,
    daysPerWeek: 5
  };
}

function defaultSite(name) {
  return {
    id: uid(),
    name: name || "新規案件",
    includeSetupFee: true,
    minMonthlyFee: DEFAULT_MIN_MONTHLY_FEE,
    workConditions: "",
    items: [
      defaultItem("可燃ごみ"),
      defaultItem("不燃ごみ")
    ]
  };
}

let state = loadState();

function migrateSite(site) {
  if (site.minMonthlyFee === undefined) site.minMonthlyFee = DEFAULT_MIN_MONTHLY_FEE;
  if (site.workConditions === undefined) site.workConditions = "";
  (site.items || []).forEach(item => {
    if (item.bagSize === undefined) item.bagSize = 45;
  });
  return site;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.view) parsed.view = "list";
      parsed.sites = (parsed.sites || []).map(migrateSite);
      return parsed;
    }
  } catch (e) { /* ignore */ }
  return { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("株式会社サンプル")] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 数値入力の検証：空欄は許可、マイナス値や数値として解釈できない値はエラー扱いにする。
// 計算には使わせず（0として扱う）、入力欄を赤く縁取りしてエラー文言を出す。
function validateNumberField(rawValue, { min = 0, allowBlank = true, fallback = 0 } = {}) {
  if (rawValue === "" || rawValue === null || rawValue === undefined) {
    return allowBlank
      ? { invalid: false, value: fallback }
      : { invalid: true, message: "数値を入力してください", value: fallback };
  }
  const num = Number(rawValue);
  if (Number.isNaN(num) || !Number.isFinite(num)) {
    return { invalid: true, message: "数値を入力してください", value: fallback };
  }
  if (num < min) {
    return { invalid: true, message: `${min}以上の値を入力してください`, value: fallback };
  }
  return { invalid: false, value: num };
}

function markFieldValidity(inputEl, result) {
  inputEl.classList.toggle("input-error", result.invalid);
  const container = inputEl.closest("td, label, .global-bar > div") || inputEl.parentElement;
  const errorEl = container ? container.querySelector(".field-error") : null;
  if (errorEl) errorEl.textContent = result.invalid ? result.message : "";
}

// monthly avg / min / max quantity for an item
function computeItem(item) {
  const weeks = validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }).value;
  const qtyMin = validateNumberField(item.qtyMin).value;
  // 最大値が未入力なら「範囲」ではなく最小値と同じ単一の数量として扱う
  const qtyMaxRaw = item.qtyMax;
  const hasMax = qtyMaxRaw !== "" && qtyMaxRaw !== null && qtyMaxRaw !== undefined && !Number.isNaN(Number(qtyMaxRaw));
  const qtyMax = hasMax ? validateNumberField(qtyMaxRaw).value : qtyMin;
  const avg = (qtyMin + qtyMax) / 2;
  const days = validateNumberField(item.daysPerWeek).value;

  const monthlyMin = qtyMin * days * weeks;
  const monthlyMax = qtyMax * days * weeks;
  const monthlyAvg = avg * days * weeks;

  return { monthlyMin, monthlyMax, monthlyAvg };
}

function itemLabelPlain(item) {
  return item.type === "その他" ? (item.customType || "その他") : item.type;
}

function itemLabel(item) {
  const base = itemLabelPlain(item);
  return BAG_SIZE_TYPES.includes(item.type) ? `${base}(${item.bagSize}L)` : base;
}

// 種別・袋サイズから、社内共有メール向けの「1kg◯円、月◯袋想定(1袋◯kgの場合)」を組み立てるための重量・単価情報。
function getPriceDetail(item) {
  const pricePerKg = PRICE_PER_KG[item.type];
  if (pricePerKg === undefined) return null;
  if (item.type === "段ボール") {
    return { pricePerKg, weightPerUnit: CARDBOARD_WEIGHT_PER_SHEET, unitLabel: "枚" };
  }
  if (WEIGHT_TABLE[item.type]) {
    return { pricePerKg, weightPerUnit: WEIGHT_TABLE[item.type][item.bagSize], unitLabel: "袋" };
  }
  return null;
}

function computeSite(site) {
  let totalQty = 0, totalCost = 0, pricedCount = 0, unpricedCount = 0;
  const breakdown = [];
  site.items.forEach(item => {
    const monthlyAvg = computeItem(item).monthlyAvg;
    totalQty += monthlyAvg;
    const unitPrice = getUnitPrice(item);
    if (unitPrice !== undefined) {
      const cost = monthlyAvg * unitPrice;
      totalCost += cost;
      pricedCount++;
      breakdown.push({ label: itemLabel(item), qty: monthlyAvg, unitPrice, cost });
    } else {
      unpricedCount++;
    }
  });

  const minMonthlyFee = validateNumberField(site.minMonthlyFee).value;
  const minimumApplied = totalCost < minMonthlyFee;
  const monthlyCost = minimumApplied ? minMonthlyFee : totalCost;
  const setupFee = site.includeSetupFee ? SETUP_FEE : 0;
  const quoteTotal = monthlyCost + setupFee;

  return { totalQty, totalCost, monthlyCost, minimumApplied, minMonthlyFee, setupFee, quoteTotal, breakdown, pricedCount, unpricedCount };
}

function fmt(n, digits = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function yen(n) { return "¥" + n.toLocaleString("ja-JP", { maximumFractionDigits: 0 }); }

// render()は毎回DOMを丸ごと作り直すため、そのままだと入力中の要素がフォーカスを失い、
// 1文字打つたびに入力が止まってしまう。再描画の前後でフォーカス位置・カーソル位置を記録して復元する。
function captureFocus() {
  const active = document.activeElement;
  if (!active || !active.dataset || !active.dataset.role) return null;
  const siteCard = active.closest("[data-site-id]");
  const itemRow = active.closest("[data-item-id]");
  return {
    role: active.dataset.role,
    siteId: siteCard ? siteCard.dataset.siteId : null,
    itemId: itemRow ? itemRow.dataset.itemId : null,
    selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
    selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null
  };
}

function restoreFocus(info) {
  if (!info) return;
  let scope = document;
  if (info.siteId) {
    scope = document.querySelector(`[data-site-id="${info.siteId}"]`) || document;
  }
  if (info.itemId && scope !== document) {
    scope = scope.querySelector(`[data-item-id="${info.itemId}"]`) || scope;
  }
  const el = scope.querySelector(`[data-role="${info.role}"]`);
  if (!el) return;
  el.focus();
  if (info.selectionStart !== null && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(info.selectionStart, info.selectionEnd); } catch (e) { /* ignore */ }
  }
}

function render() {
  const focusInfo = captureFocus();
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view === "quote") {
    const site = state.sites.find(s => s.id === state.activeSiteId);
    if (!site) { state.view = "list"; saveState(); return render(); }
    app.appendChild(renderQuoteScreen(site));
  } else if (state.view === "guide") {
    app.appendChild(renderGuideScreen());
  } else {
    app.appendChild(renderListScreen());
  }
  restoreFocus(focusInfo);
  saveState();
}

function renderListScreen() {
  const frag = document.createDocumentFragment();
  const wrap = document.createElement("div");

  wrap.innerHTML = `
    <h1>🗑️ 廃棄物コネクト 案件量計算ツール</h1>
    <p class="subtitle">ヒアリング内容（例：「45Lが1〜2袋/日、週5回、不燃物週2日」）を入力すると、月間の袋数と、お客様に提示する金額を計算します。</p>
    <div class="global-bar">
      <div>
        <label>1ヶ月あたりの週数&nbsp;</label>
        <input type="text" inputmode="decimal" id="weeksPerMonth" data-role="weeksPerMonth" value="${state.weeksPerMonth}">
        <span class="field-error"></span>
      </div>
      <span class="note" style="margin:0;">※既定値は365日/12ヶ月/7日で算出した平均週数です。必要に応じて調整してください。</span>
    </div>
    <div class="toolbar">
      <button class="btn-primary" id="addSiteBtn">＋ 案件を追加</button>
      <button id="guideBtn">📖 使い方・単価表</button>
      <button id="resetBtn" class="btn-danger">全データをクリア</button>
    </div>
    <div id="sitesContainer"></div>
    <footer>廃棄物コネクト｜社内用 案件量計算ツール</footer>
  `;
  frag.appendChild(wrap);

  const sitesContainer = wrap.querySelector("#sitesContainer");
  state.sites.forEach(site => sitesContainer.appendChild(renderSiteCard(site)));

  const weeksEl = wrap.querySelector("#weeksPerMonth");
  markFieldValidity(weeksEl, validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }));
  weeksEl.addEventListener("input", (e) => { state.weeksPerMonth = e.target.value; render(); });
  wrap.querySelector("#addSiteBtn").addEventListener("click", () => {
    state.sites.push(defaultSite(`新規案件${state.sites.length + 1}`));
    render();
  });
  wrap.querySelector("#guideBtn").addEventListener("click", () => {
    state.view = "guide";
    render();
  });
  wrap.querySelector("#resetBtn").addEventListener("click", () => {
    if (!confirm("全ての案件データを削除して初期状態に戻します。よろしいですか？")) return;
    state = { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("新規案件")] };
    render();
  });

  return frag;
}

function renderSiteCard(site) {
  const card = document.createElement("div");
  card.className = "site-card";
  card.dataset.siteId = site.id;

  const head = document.createElement("div");
  head.className = "site-head";
  head.innerHTML = `
    <input type="text" value="${escapeAttr(site.name)}" data-role="site-name" placeholder="案件名（例：新宿区新規案件）">
    <button class="btn-danger" data-role="delete-site">この案件を削除</button>
  `;
  card.appendChild(head);

  const table = document.createElement("table");
  table.innerHTML = `
    <thead>
      <tr>
        <th>種別</th>
        <th>袋サイズ</th>
        <th>1回あたり数量(min〜max)</th>
        <th>頻度(週◯回)</th>
        <th class="num-col">月間量(平均)</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");
  site.items.forEach(item => tbody.appendChild(renderItemRow(site, item)));
  const tableScroll = document.createElement("div");
  tableScroll.className = "table-scroll";
  tableScroll.appendChild(table);
  card.appendChild(tableScroll);

  const addRowBtn = document.createElement("button");
  addRowBtn.className = "add-row-btn";
  addRowBtn.textContent = "＋ 項目を追加";
  addRowBtn.addEventListener("click", () => {
    site.items.push(defaultItem());
    render();
  });
  card.appendChild(addRowBtn);

  const summary = computeSite(site);
  const summaryDiv = document.createElement("div");
  summaryDiv.className = "site-summary";
  summaryDiv.innerHTML = `
    <div class="stat"><b>${fmt(summary.totalQty)}</b><span>月間合計 個数（袋+枚）</span></div>
  `;
  card.appendChild(summaryDiv);

  const minFeePanel = document.createElement("div");
  minFeePanel.className = "min-fee-panel";
  minFeePanel.innerHTML = `
    <label>最低基本料金(円/月)
      <input type="text" inputmode="decimal" data-role="minMonthlyFee" value="${escapeAttr(site.minMonthlyFee)}">
      <span class="field-error"></span>
    </label>
    <span class="note" style="margin:0;">※計算した月額がこれを下回る場合、自動的にこの金額まで引き上げます。</span>
  `;
  card.appendChild(minFeePanel);

  const workConditionsDiv = document.createElement("div");
  workConditionsDiv.className = "work-conditions-field";
  workConditionsDiv.innerHTML = `
    <label>作業条件・特記事項（見積前提条件に反映されます）</label>
    <textarea data-role="workConditions" placeholder="例：出入口に段差あり、夜間収集希望、駐車スペース確保が必要　など">${escapeHtml(site.workConditions)}</textarea>
  `;
  card.appendChild(workConditionsDiv);

  const actions = document.createElement("div");
  actions.className = "card-actions";
  actions.innerHTML = `<button class="btn-quote" data-role="show-quote">💰 金額提示</button>`;
  actions.querySelector('[data-role="show-quote"]').addEventListener("click", () => {
    state.view = "quote";
    state.activeSiteId = site.id;
    render();
  });
  card.appendChild(actions);

  head.querySelector('[data-role="site-name"]').addEventListener("input", (e) => {
    site.name = e.target.value;
    saveState();
  });
  head.querySelector('[data-role="delete-site"]').addEventListener("click", () => {
    if (!confirm(`「${site.name}」を削除しますか？`)) return;
    state.sites = state.sites.filter(s => s.id !== site.id);
    render();
  });

  const minFeeEl = minFeePanel.querySelector('[data-role="minMonthlyFee"]');
  markFieldValidity(minFeeEl, validateNumberField(site.minMonthlyFee, { min: 0, allowBlank: false, fallback: DEFAULT_MIN_MONTHLY_FEE }));
  minFeeEl.addEventListener("input", (e) => { site.minMonthlyFee = e.target.value; render(); });
  workConditionsDiv.querySelector('[data-role="workConditions"]').addEventListener("input", (e) => {
    site.workConditions = e.target.value;
    saveState();
  });

  return card;
}

function renderItemRow(site, item) {
  const tr = document.createElement("tr");
  tr.dataset.itemId = item.id;
  const c = computeItem(item);
  const isCustom = item.type === "その他";
  const hasBagSize = BAG_SIZE_TYPES.includes(item.type);

  tr.innerHTML = `
    <td>
      <select class="type-select" data-role="type">
        ${TYPE_PRESETS.map(t => `<option value="${t}" ${t === item.type ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      ${isCustom ? `<input type="text" class="custom-type-input" data-role="customType" value="${escapeAttr(item.customType)}" placeholder="種別名">` : ""}
    </td>
    <td>
      ${hasBagSize ? `
        <select data-role="bagSize">
          ${BAG_SIZES.map(s => `<option value="${s}" ${s === item.bagSize ? "selected" : ""}>${s}L</option>`).join("")}
        </select>
      ` : `<span class="note" style="margin:0;">－</span>`}
    </td>
    <td>
      <div class="qty-pair">
        <input type="text" inputmode="decimal" data-role="qtyMin" value="${item.qtyMin}"> 〜
        <input type="text" inputmode="decimal" data-role="qtyMax" value="${item.qtyMax}" placeholder="－" title="数量が1つだけの場合は空欄でOK（最小値のみで計算します）">
      </div>
      <span class="field-error"></span>
    </td>
    <td>
      <input type="text" inputmode="numeric" data-role="daysPerWeek" value="${item.daysPerWeek}" style="width:70px;">
      <span class="field-error"></span>
    </td>
    <td class="num-col">${fmt(c.monthlyAvg)}<br><span class="note" style="margin:0;">(${fmt(c.monthlyMin)}〜${fmt(c.monthlyMax)})</span></td>
    <td class="row-actions"><button class="btn-danger" data-role="delete-item" title="削除">×</button></td>
  `;

  tr.querySelector('[data-role="type"]').addEventListener("change", (e) => {
    item.type = e.target.value;
    render();
  });
  const customInput = tr.querySelector('[data-role="customType"]');
  if (customInput) {
    customInput.addEventListener("input", (e) => { item.customType = e.target.value; render(); });
  }
  const bagSizeEl = tr.querySelector('[data-role="bagSize"]');
  if (bagSizeEl) {
    bagSizeEl.addEventListener("change", (e) => { item.bagSize = Number(e.target.value); render(); });
  }
  const qtyMinEl = tr.querySelector('[data-role="qtyMin"]');
  const qtyMaxEl = tr.querySelector('[data-role="qtyMax"]');
  const daysEl = tr.querySelector('[data-role="daysPerWeek"]');
  // 再描画のたびに現在値で検証しなおし、エラー表示が消えないようにする
  markFieldValidity(qtyMinEl, validateNumberField(item.qtyMin));
  markFieldValidity(qtyMaxEl, validateNumberField(item.qtyMax));
  markFieldValidity(daysEl, validateNumberField(item.daysPerWeek));
  qtyMinEl.addEventListener("input", (e) => { item.qtyMin = e.target.value; render(); });
  qtyMaxEl.addEventListener("input", (e) => { item.qtyMax = e.target.value; render(); });
  daysEl.addEventListener("input", (e) => { item.daysPerWeek = e.target.value; render(); });
  tr.querySelector('[data-role="delete-item"]').addEventListener("click", () => {
    site.items = site.items.filter(i => i.id !== item.id);
    render();
  });

  return tr;
}

// 契約時のトラブル防止のための「見積前提条件」文面を、入力済みの項目から自動で組み立てる。
function generateTermsText(site) {
  const lines = [];
  lines.push("【お見積り前提条件】");
  lines.push(`案件名：${site.name || "(未入力)"}`);
  lines.push("下記の内容を前提として、本お見積りを算定しております。");
  lines.push("");
  if (site.items.length) {
    site.items.forEach(item => {
      const c = computeItem(item);
      const label = itemLabel(item);
      const hasMax = item.qtyMax !== "" && item.qtyMax !== null && item.qtyMax !== undefined && !Number.isNaN(Number(item.qtyMax));
      const qtyText = hasMax && String(item.qtyMax) !== String(item.qtyMin) ? `${item.qtyMin}〜${item.qtyMax}` : `${item.qtyMin}`;
      lines.push(`・${label}：1回あたり${qtyText}個、週${item.daysPerWeek}回収集（月間想定 ${fmt(c.monthlyAvg)}個）`);
    });
  } else {
    lines.push("・（品目が登録されていません）");
  }
  lines.push("");
  if (site.workConditions && site.workConditions.trim()) {
    lines.push("【作業条件・特記事項】");
    lines.push(site.workConditions.trim());
    lines.push("");
  }
  lines.push("実際の排出量が上記の想定数量を大きく上回る場合、または収集頻度・排出場所などの条件に変更が生じた場合は、");
  lines.push("別途お見積りを再算定させていただく場合がございますので、あらかじめご了承ください。");
  return lines.join("\n");
}

// 社内共有用の見積内訳文面（担当者が実際に使っている「1kg◯円、月◯袋想定(1袋◯kgの場合)」の形式）。
function generateBreakdownEmailText(site) {
  const summary = computeSite(site);
  const lines = [];
  lines.push(`件名：${site.name || "(未入力)"} 御見積のご案内`);
  lines.push("");
  lines.push("お世話になっております。");
  lines.push(`${site.name || "(未入力)"}様の御見積の内訳を記載しましたのでご確認をお願いいたします。`);
  lines.push("");
  site.items.forEach(item => {
    const detail = getPriceDetail(item);
    if (!detail) return;
    const monthlyQty = Math.round(computeItem(item).monthlyAvg);
    lines.push(`${itemLabelPlain(item)}：1kg${detail.pricePerKg}円、月${monthlyQty}${detail.unitLabel}想定(1${detail.unitLabel}${detail.weightPerUnit}kgの場合)`);
  });
  if (site.includeSetupFee) {
    lines.push(`初回手数料:${SETUP_FEE.toLocaleString("ja-JP")}円`);
  }
  lines.push("");
  lines.push(`合計金額：${yen(summary.quoteTotal)}`);
  if (summary.unpricedCount > 0) {
    lines.push("");
    lines.push(`※単価未設定の品目（${summary.unpricedCount}種別）は上記に含まれていません。`);
  }
  return lines.join("\n");
}

async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* フォールバックへ */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function renderQuoteScreen(site) {
  const frag = document.createDocumentFragment();
  const wrap = document.createElement("div");
  wrap.className = "quote-container";

  const summary = computeSite(site);

  const breakdownHtml = summary.breakdown.length
    ? summary.breakdown.map(b => `<div>${escapeHtml(b.label)}　${fmt(b.qty)}個 × ${yen(b.unitPrice)}　＝　${yen(b.cost)}</div>`).join("")
    : `<div>単価が設定されている種別がありません</div>`;

  const minimumHtml = summary.minimumApplied
    ? `<div>内訳合計 ${yen(summary.totalCost)} → 最低月額 ${yen(summary.minMonthlyFee)} を適用</div>`
    : "";

  const warningHtml = summary.unpricedCount > 0
    ? `<div class="quote-warning">※このうち ${summary.unpricedCount} 種別は単価未設定のため金額に含まれていません。金額をご案内する前に必ず内訳をご確認ください。</div>`
    : "";

  const termsText = generateTermsText(site);
  const breakdownEmailText = generateBreakdownEmailText(site);

  wrap.innerHTML = `
    <button class="back-btn" data-role="back">← 入力画面に戻る</button>
    <div class="quote-screen">
      <div class="quote-site-name">${escapeHtml(site.name)}</div>
      <div class="quote-headline">この金額でお客様にご提示ください</div>
      <div class="quote-amount-big">${yen(summary.quoteTotal)}</div>
      <div class="quote-breakdown">
        ${breakdownHtml}
        ${minimumHtml}
        ${site.includeSetupFee ? `<div>初回手数料　＋${yen(SETUP_FEE)}</div>` : ""}
      </div>
      ${warningHtml}
      <label class="setup-fee-toggle">
        <input type="checkbox" data-role="setupFee" ${site.includeSetupFee ? "checked" : ""}>
        初回手数料（¥3,000）を含める
      </label>
      <div class="terms-section">
        <h3>見積前提条件（コピーしてお客様への文面にお使いください）</h3>
        <textarea data-role="termsText" readonly>${escapeHtml(termsText)}</textarea>
        <div class="terms-actions">
          <span class="copy-feedback" data-role="copyFeedback"></span>
          <button data-role="copyTerms">📋 コピーする</button>
        </div>
      </div>
      <div class="terms-section">
        <h3>見積内訳メール文面（社内共有用）</h3>
        <textarea data-role="breakdownEmailText" readonly>${escapeHtml(breakdownEmailText)}</textarea>
        <div class="terms-actions">
          <span class="copy-feedback" data-role="copyFeedback2"></span>
          <button data-role="copyBreakdownEmail">📋 コピーする</button>
        </div>
      </div>
    </div>
  `;

  wrap.querySelector('[data-role="back"]').addEventListener("click", () => {
    state.view = "list";
    render();
  });
  wrap.querySelector('[data-role="setupFee"]').addEventListener("change", (e) => {
    site.includeSetupFee = e.target.checked;
    render();
  });
  wrap.querySelector('[data-role="copyTerms"]').addEventListener("click", async (e) => {
    const ok = await copyTextToClipboard(termsText);
    const feedback = wrap.querySelector('[data-role="copyFeedback"]');
    feedback.textContent = ok ? "コピーしました！" : "コピーできませんでした。手動で選択してください。";
    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });
  wrap.querySelector('[data-role="copyBreakdownEmail"]').addEventListener("click", async (e) => {
    const ok = await copyTextToClipboard(breakdownEmailText);
    const feedback = wrap.querySelector('[data-role="copyFeedback2"]');
    feedback.textContent = ok ? "コピーしました！" : "コピーできませんでした。手動で選択してください。";
    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });

  frag.appendChild(wrap);
  return frag;
}

function renderGuideScreen() {
  const frag = document.createDocumentFragment();
  const wrap = document.createElement("div");

  const priceRows = [];
  ["可燃ごみ", "不燃ごみ"].forEach(type => {
    BAG_SIZES.forEach(size => {
      const weight = WEIGHT_TABLE[type][size];
      priceRows.push({ type, size: `${size}L`, weight: `${weight}kg`, perKg: `${PRICE_PER_KG[type]}円/kg`, unitPrice: PRICE_TABLE[type][size] });
    });
  });
  priceRows.push({ type: "段ボール", size: "(1枚)", weight: `${CARDBOARD_WEIGHT_PER_SHEET}kg`, perKg: `${PRICE_PER_KG["段ボール"]}円/kg`, unitPrice: PRICE_TABLE["段ボール"] });

  const priceTableHtml = priceRows.map(r => `
    <tr>
      <td>${escapeHtml(r.type)}</td>
      <td>${escapeHtml(r.size)}</td>
      <td class="num-col">${escapeHtml(r.weight)}</td>
      <td class="num-col">${escapeHtml(r.perKg)}</td>
      <td class="num-col">${yen(r.unitPrice)}</td>
    </tr>
  `).join("");

  wrap.innerHTML = `
    <button class="back-btn" data-role="back">← 入力画面に戻る</button>
    <div class="guide-screen">
      <h2>📖 使い方</h2>
      <ol class="guide-steps">
        <li>「＋ 案件を追加」でお客様の案件を1件作成し、案件名を入力します。</li>
        <li>品目ごとに「種別」「袋サイズ（45L／70L）」「1回あたり数量」「頻度（週◯回）」を入力します。
          数量が「1〜2袋」のように幅がある場合は両方、「2袋」のように1つだけの場合は数量maxを空欄にします。</li>
        <li>必要に応じて「最低基本料金」「作業条件・特記事項」を編集します。</li>
        <li>「💰 金額提示」ボタンを押すと、お客様にご案内する金額と見積前提条件の文面が表示されます。</li>
      </ol>

      <h2>💴 単価・重量表</h2>
      <p class="note" style="margin:0 0 10px;">
        袋の重量は実測値をもとにした目安です。「1個あたり単価」＝ 想定重量 × 単価(円/kg) を、金額提示の際に内部で使用しています。
      </p>
      <div class="table-scroll">
        <table class="guide-price-table">
          <thead>
            <tr>
              <th>種別</th>
              <th>袋サイズ</th>
              <th class="num-col">想定重量</th>
              <th class="num-col">単価(円/kg)</th>
              <th class="num-col">1個あたり単価</th>
            </tr>
          </thead>
          <tbody>${priceTableHtml}</tbody>
        </table>
      </div>
      <p class="note">
        ・生ごみ／瓶／缶／ペットボトルは袋サイズを選べますが、単価が未確定のため金額計算には含まれません（単価が分かり次第、対応します）。<br>
        ・初回手数料：¥${SETUP_FEE.toLocaleString("ja-JP")}（新規契約時、金額提示画面のチェックボックスでON/OFF可能）。<br>
        ・最低基本料金：既定 ¥${DEFAULT_MIN_MONTHLY_FEE.toLocaleString("ja-JP")}。案件ごとに変更でき、計算した月額がこれを下回ると自動的に引き上がります。
      </p>
    </div>
  `;

  wrap.querySelector('[data-role="back"]').addEventListener("click", () => {
    state.view = "list";
    render();
  });

  frag.appendChild(wrap);
  return frag;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

render();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定期回収計算ツール</title>
<style>
  /* モダンSaaS風のクリーンなライト／ダークテーマ（フラットデザイン）。 */
  :root {
    --bg: #f7f8fa;
    --bg-accent: #f1f4f8;
    --panel: #ffffff;
    --border: #e2e6ea;
    --border-soft: #edf0f3;
    --text: #1a2233;
    --muted: #6b7280;
    --accent: #2f5fdb;
    --accent-hover: #244bb0;
    --accent-soft: rgba(47, 95, 219, 0.1);
    --accent-contrast: #ffffff;
    --accent2: #0891b2;
    --accent2-hover: #0e7490;
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.08);
    --header: #111827;
    --fun-accent: #ca8a04;
    --fun-accent-soft: rgba(202, 138, 4, 0.12);
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1420; --bg-accent: #182030; --panel: #171d2b; --border: #2b3446; --border-soft: #232b3a;
      --text: #e6e9ef; --muted: #94a0b4; --accent: #5b8def; --accent-hover: #7ba3f2; --accent-soft: rgba(91, 141, 239, 0.16);
      --accent-contrast: #0b1220; --accent2: #38bdf8; --accent2-hover: #67cdfa; --danger: #f87171; --danger-soft: rgba(248, 113, 113, 0.14);
      --header: #f1f5f9; --fun-accent: #fbbf24; --fun-accent-soft: rgba(251, 191, 36, 0.18);
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3); --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1420; --bg-accent: #182030; --panel: #171d2b; --border: #2b3446; --border-soft: #232b3a;
    --text: #e6e9ef; --muted: #94a0b4; --accent: #5b8def; --accent-hover: #7ba3f2; --accent-soft: rgba(91, 141, 239, 0.16);
    --accent-contrast: #0b1220; --accent2: #38bdf8; --accent2-hover: #67cdfa; --danger: #f87171; --danger-soft: rgba(248, 113, 113, 0.14);
    --header: #f1f5f9; --fun-accent: #fbbf24; --fun-accent-soft: rgba(251, 191, 36, 0.18);
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3); --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --bg-accent: #f1f4f8; --panel: #ffffff; --border: #e2e6ea; --border-soft: #edf0f3;
    --text: #1a2233; --muted: #6b7280; --accent: #2f5fdb; --accent-hover: #244bb0; --accent-soft: rgba(47, 95, 219, 0.1);
    --accent-contrast: #ffffff; --accent2: #0891b2; --accent2-hover: #0e7490; --danger: #dc2626; --danger-soft: rgba(220, 38, 38, 0.08);
    --header: #111827; --fun-accent: #ca8a04; --fun-accent-soft: rgba(202, 138, 4, 0.12);
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04); --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 40px 32px;
    line-height: 1.6;
  }
  h1 {
    font-size: 1.5rem; font-weight: 700; margin: 0 0 6px; color: var(--header);
    font-family: "MS Gothic", "ＭＳ ゴシック", "Courier New", monospace; letter-spacing: 0.04em;
  }
  .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }
  .container { max-width: 1180px; margin: 0 auto; }
  .quote-container { max-width: 720px; margin: 0 auto; }
  .advanced-settings {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 2px 20px; margin: 24px 0 20px;
  }
  .advanced-settings summary {
    cursor: pointer; padding: 14px 0; font-size: 0.88rem; color: var(--muted); font-weight: 600;
    list-style: none;
  }
  .advanced-settings summary::-webkit-details-marker { display: none; }
  .advanced-settings summary::before { content: "▸ "; color: var(--muted); }
  .advanced-settings[open] summary::before { content: "▾ "; color: var(--muted); }
  .advanced-settings-body { padding: 2px 0 18px; }
  .field-block { display: block; font-size: 0.88rem; color: var(--muted); font-weight: 600; }
  .field-block input { display: block; margin-top: 6px; width: 100px; }
  input, select {
    font-family: inherit; font-size: 1rem; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg-accent); color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button, a.btn-link {
    font-family: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
    padding: 9px 16px; color: var(--text); text-decoration: none; display: inline-block;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  button:hover, a.btn-link:hover { background: var(--bg-accent); border-color: var(--border); }
  button:focus-visible, a.btn-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-contrast); }
  .btn-danger { color: var(--danger); border-color: var(--border); }
  .btn-danger:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }
  /* 最重要アクション：フラットな単色ボタンだが、ホバー時だけ小さな「▶」カーソルが覗く遊び心を残す */
  .btn-quote {
    background: var(--accent); color: var(--accent-contrast); border: none; position: relative;
    font-size: 1.05rem; padding: 14px 32px 14px 24px; font-weight: 700; letter-spacing: 0.01em;
    border-radius: 8px;
    box-shadow: var(--shadow);
    transition: background 0.15s ease, box-shadow 0.15s ease, padding-left 0.15s ease;
  }
  .btn-quote::before {
    content: "▶"; display: inline-block; width: 0; opacity: 0; overflow: hidden;
    transition: width 0.15s ease, opacity 0.15s ease, margin-right 0.15s ease;
  }
  .btn-quote:hover:not([disabled]) { background: var(--accent-hover); }
  .btn-quote:hover:not([disabled])::before { width: 0.8em; opacity: 1; margin-right: 6px; }
  .btn-quote[disabled] { background: var(--bg-accent); color: var(--muted); box-shadow: none; }
  .btn-quote[disabled]:hover { background: var(--bg-accent); }
  .site-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px 28px 0; margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
  .site-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .site-name-field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; }
  .site-name-field .field-label-text { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .required-badge { color: var(--danger); font-size: 0.7rem; font-weight: 700; margin-left: 4px; }
  .site-head input[type=text] { font-size: 1.1rem; font-weight: 600; }
  .btn-delete-site {
    width: 32px; height: 32px; min-width: 32px; padding: 0; border-radius: 50%;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 0.95rem; font-weight: 600; line-height: 1; flex-shrink: 0;
  }
  .btn-delete-site:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  button[disabled]:hover { background: var(--panel); border-color: var(--border); color: var(--text); }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  thead th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 0.78rem;
    padding: 0 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 14px 10px; vertical-align: middle; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  .num-col { text-align: right; }
  .monthly-qty-value { font-size: 1.3rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .monthly-qty-value .qty-unit { font-size: 0.74rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .qty-range-note { display: block; font-size: 0.78rem; }
  .qty-pair { display: flex; align-items: center; gap: 6px; }
  .qty-pair input { width: 64px; }
  .row-actions { text-align: center; }
  .row-actions button {
    width: 26px; height: 26px; min-width: 26px; padding: 0; border-radius: 50%;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 0.8rem; font-weight: 600; line-height: 1;
  }
  .row-actions button:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .site-summary {
    display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding-top: 20px;
    border-top: 1px solid var(--border-soft); font-size: 1rem;
  }
  .site-summary .stat {
    background: var(--bg-accent); border: 1px solid var(--border-soft); border-radius: 8px; padding: 12px 18px; min-width: 160px;
  }
  .site-summary .stat b { display: block; font-size: 1.35rem; font-weight: 700; color: var(--header); font-variant-numeric: tabular-nums; }
  .site-summary .stat span { color: var(--muted); font-size: 0.82rem; }
  .card-actions {
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px;
    margin: 24px -28px 0; padding: 20px 28px;
    background: var(--bg-accent); border-top: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
  }
  .add-row-btn { margin-top: 12px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 0.88rem; margin-top: 10px; }
  a.note { color: var(--accent2); text-decoration: underline; cursor: pointer; align-self: center; }
  select.type-select { min-width: 110px; }
  .custom-type-input { width: 100px; }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 36px; }
  .table-scroll { overflow-x: auto; }

  /* スマホ表示（幅640px以下）：品目テーブルをカード形式に積み替え、余白も詰める */
  @media (max-width: 640px) {
    body { padding: 20px 16px; }
    h1 { font-size: 1.25rem; }
    .site-card { padding: 18px 18px 0; }
    .card-actions { margin: 20px -18px 0; padding: 16px 18px; }
    .quote-screen, .guide-screen { padding: 24px 18px; }
    .quote-amount-big { font-size: 2.4rem; }
    .site-head { flex-direction: column; align-items: stretch; }
    .site-name-field { min-width: 0; }
    .table-scroll table, .table-scroll tbody, .table-scroll tr { display: block; width: 100%; }
    .table-scroll thead { display: none; }
    .table-scroll tr {
      border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 12px;
    }
    .table-scroll td {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px;
      padding: 7px 2px; border-bottom: none; text-align: left;
    }
    .table-scroll td[data-label]::before {
      content: attr(data-label); color: var(--muted); font-size: 0.72rem; font-weight: 600; flex-shrink: 0;
    }
    .table-scroll td.row-actions { justify-content: flex-end; }
    .table-scroll .num-col { text-align: right; }
  }

  /* 金額提示画面 */
  .quote-screen {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 44px 36px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .quote-screen .quote-site-name { font-size: 1.05rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .quote-screen .quote-headline { font-size: 0.95rem; font-weight: 500; color: var(--muted); margin: 0 0 20px; }
  .quote-amount-big {
    font-family: "MS Gothic", "ＭＳ ゴシック", "Courier New", monospace;
    font-size: 3.1rem; font-weight: 800; color: var(--header); font-variant-numeric: tabular-nums;
    line-height: 1.15; margin: 6px 0 4px; letter-spacing: 0.02em;
  }
  .quote-amount-big .quote-amount-tax-note {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 1.1rem; font-weight: 700; color: var(--danger); margin-left: 6px; vertical-align: middle;
  }
  .quote-amount-tax-included { font-size: 0.92rem; color: var(--muted); margin: 0 0 18px; }
  .quote-screen .quote-breakdown { font-size: 0.92rem; color: var(--muted); margin: 4px 0 20px; }
  .quote-screen .quote-breakdown div { margin: 3px 0; }
  .setup-fee-toggle {
    display: inline-flex; align-items: center; gap: 10px; font-size: 0.92rem; font-weight: 500; color: var(--text);
    background: var(--bg-accent); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; cursor: pointer; margin-bottom: 24px;
  }
  .setup-fee-toggle input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  /* お楽しみ要素：ここだけはドラクエ風に、点線ウィンドウ枠と金色のアクセントを残す。
     見積画面が表示されるたびに「モンスターが あらわれた！」の登場演出（フラッシュ→60通りからランダムな登場アニメ→待機バウンス）を再生する。
     登場アニメの種類（animation-name等）はJS側でランダムに選び、インラインstyleで指定する。 */
  .monster-encounter {
    margin: 4px 0 24px; padding: 18px 16px; background: var(--bg-accent); border: 2px dashed var(--fun-accent-soft);
    border-radius: 10px; overflow: hidden;
    animation: monster-flash 0.5s ease-out;
  }
  .monster-encounter.legendary {
    border: 2px solid var(--fun-accent);
    animation: monster-flash 0.5s ease-out, legendary-glow 2s ease-in-out 0.5s infinite;
  }
  .monster-emoji { font-size: 4.5rem; line-height: 1.2; display: inline-block; }
  .monster-emoji svg { display: block; }
  .monster-encounter.legendary .monster-emoji { font-size: 5.2rem; }
  .monster-name {
    font-size: 1rem; font-weight: 700; color: var(--fun-accent); margin-top: 6px;
    opacity: 0; animation: monster-text-in 0.35s ease-out 0.3s both;
  }
  .monster-encounter.legendary .monster-name { font-size: 1.15rem; }
  .monster-level {
    font-size: 0.76rem; color: var(--muted); margin-top: 2px;
    opacity: 0; animation: monster-text-in 0.35s ease-out 0.45s both;
  }
  @keyframes monster-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes monster-flash {
    0% { background: var(--fun-accent-soft); }
    12% { background: var(--panel); }
    30% { background: var(--fun-accent-soft); }
    100% { background: var(--bg-accent); }
  }
  @keyframes legendary-glow {
    0%, 100% { box-shadow: 0 0 0 1px var(--fun-accent-soft), 0 0 14px var(--fun-accent-soft); }
    50% { box-shadow: 0 0 0 1px var(--fun-accent), 0 0 28px var(--fun-accent-soft); }
  }
  @keyframes monster-text-in {
    0% { opacity: 0; transform: translateY(4px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  /* 登場演出：12種類の「動きの型」。向き・回転方向は各パターン共通のCSS変数 --e-dir（1 or -1）で反転させる。 */
  @keyframes entrance-pop {
    0% { transform: scale(0.2) rotate(calc(-10deg * var(--e-dir, 1))); opacity: 0; }
    55% { transform: scale(1.2) rotate(calc(4deg * var(--e-dir, 1))); opacity: 1; }
    75% { transform: scale(0.92) rotate(calc(-2deg * var(--e-dir, 1))); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes entrance-slide-x {
    0% { transform: translateX(calc(160% * var(--e-dir, 1))) scale(0.7); opacity: 0; }
    60% { transform: translateX(calc(-8% * var(--e-dir, 1))) scale(1.05); opacity: 1; }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }
  @keyframes entrance-drop {
    0% { transform: translateY(-220%) scale(0.8); opacity: 0; }
    55% { transform: translateY(10%) scale(1.05); opacity: 1; }
    75% { transform: translateY(-6%) scale(0.97); }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes entrance-rise {
    0% { transform: translateY(220%) scale(0.8); opacity: 0; }
    55% { transform: translateY(-10%) scale(1.05); opacity: 1; }
    75% { transform: translateY(6%) scale(0.97); }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes entrance-spin {
    0% { transform: scale(0.2) rotate(calc(540deg * var(--e-dir, 1))); opacity: 0; }
    70% { transform: scale(1.1) rotate(calc(-15deg * var(--e-dir, 1))); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes entrance-flip {
    0% { transform: perspective(400px) rotateY(calc(100deg * var(--e-dir, 1))) scale(0.6); opacity: 0; }
    60% { transform: perspective(400px) rotateY(calc(-15deg * var(--e-dir, 1))) scale(1.08); opacity: 1; }
    100% { transform: perspective(400px) rotateY(0deg) scale(1); opacity: 1; }
  }
  @keyframes entrance-wobble {
    0% { transform: scale(0.3) rotate(0deg); opacity: 0; }
    20% { transform: scale(0.9) rotate(calc(-14deg * var(--e-dir, 1))); opacity: 1; }
    40% { transform: scale(1.05) rotate(calc(10deg * var(--e-dir, 1))); }
    60% { transform: scale(0.98) rotate(calc(-6deg * var(--e-dir, 1))); }
    80% { transform: scale(1.02) rotate(calc(3deg * var(--e-dir, 1))); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes entrance-shake {
    0% { transform: scale(0.5) translateX(0); opacity: 0; }
    15% { transform: scale(1) translateX(calc(-6px * var(--e-dir, 1))); opacity: 1; }
    30% { transform: translateX(calc(6px * var(--e-dir, 1))); }
    45% { transform: translateX(calc(-4px * var(--e-dir, 1))); }
    60% { transform: translateX(calc(4px * var(--e-dir, 1))); }
    75% { transform: translateX(calc(-2px * var(--e-dir, 1))); }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }
  @keyframes entrance-elastic {
    0% { transform: scale(0, 1.4); opacity: 0; }
    40% { transform: scale(1.3, 0.7); opacity: 1; }
    60% { transform: scale(0.85, 1.15); }
    80% { transform: scale(1.06, 0.96); }
    100% { transform: scale(1, 1); opacity: 1; }
  }
  @keyframes entrance-diagonal {
    0% { transform: translate(calc(120% * var(--e-dir, 1)), -120%) scale(0.5) rotate(calc(20deg * var(--e-dir, 1))); opacity: 0; }
    60% { transform: translate(calc(-6% * var(--e-dir, 1)), 6%) scale(1.08) rotate(calc(-4deg * var(--e-dir, 1))); opacity: 1; }
    100% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes entrance-swing {
    0% { transform-origin: top center; transform: rotate(calc(35deg * var(--e-dir, 1))) scale(0.7); opacity: 0; }
    30% { transform: rotate(calc(-20deg * var(--e-dir, 1))) scale(1); opacity: 1; }
    55% { transform: rotate(calc(12deg * var(--e-dir, 1))) scale(1); }
    75% { transform: rotate(calc(-6deg * var(--e-dir, 1))); }
    100% { transform: rotate(0deg) scale(1); opacity: 1; }
  }
  @keyframes entrance-roll {
    0% { transform: translateX(calc(140% * var(--e-dir, 1))) rotate(calc(360deg * var(--e-dir, 1))) scale(0.6); opacity: 0; }
    70% { transform: translateX(calc(-6% * var(--e-dir, 1))) rotate(calc(-10deg * var(--e-dir, 1))) scale(1.05); opacity: 1; }
    100% { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
  }
  .quote-warning {
    background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; padding: 10px 16px;
    font-size: 0.88rem; margin: 0 0 18px; text-align: left;
  }
  .back-btn { margin-bottom: 20px; }

  /* 最低基本料金 */
  .min-fee-panel {
    margin-top: 20px; padding: 16px 18px; border-radius: 8px; background: var(--bg-accent); border: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .min-fee-panel label { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); font-weight: 600; }
  .min-fee-panel input { width: 120px; }

// 5種類の速さ・イージングの組み合わせで、60通りの登場パターンを用意し、見積画面を開くたびに
// ランダムで1つ選ぶ。--e-dirはキーフレーム側で向き・回転方向を反転させるための共通変数。
const ENTRANCE_ANIMS = [
  "entrance-pop", "entrance-slide-x", "entrance-drop", "entrance-rise",
  "entrance-spin", "entrance-flip", "entrance-wobble", "entrance-shake",
  "entrance-elastic", "entrance-diagonal", "entrance-swing", "entrance-roll"
];
const ENTRANCE_TIMINGS = [
  { duration: "0.42s", easing: "cubic-bezier(0.34,1.56,0.64,1)" },
  { duration: "0.5s", easing: "ease-out" },
  { duration: "0.6s", easing: "cubic-bezier(0.68,-0.55,0.27,1.55)" },

  { duration: "0.48s", easing: "ease-in-out" }
];
const ENTRANCE_PATTERNS = [];
ENTRANCE_ANIMS.forEach(anim => {
  ENTRANCE_TIMINGS.forEach(timing => {
    ENTRANCE_PATTERNS.push({
      anim,
      duration: timing.duration,
      easing: timing.easing,
      dir: ENTRANCE_PATTERNS.length % 2 === 0 ? 1 : -1
    });
  });
});

function pickEntrancePattern() {
  return ENTRANCE_PATTERNS[Math.floor(Math.random() * ENTRANCE_PATTERNS.length)];

    if (item.weeklyQtyMin === undefined) item.weeklyQtyMin = "";

    item.qtyMin = normalizeHalfWidth(item.qtyMin);

      parsed.view = "list"; // URLを開くたびに必ずトップ（一覧）画面から始める
      // 既定の最低基本料金を5,000円→12,000円に変更した際、保存済みデータには反映されない
      // （＝旧デフォルト値のままか、意図的に5,000円へ変更したのか区別できない）ため、
      // 一度だけ「旧デフォルト値と一致する案件」を新デフォルトへ引き上げる移行処理を行う。
      // 移行後はフラグを立てて、以後は5,000円への変更もそのまま尊重する。
      if (!parsed.minFeeDefaultMigrated) {
        (parsed.sites || []).forEach(site => {
          if (Number(site.minMonthlyFee) === 5000) site.minMonthlyFee = DEFAULT_MIN_MONTHLY_FEE;
        });
        parsed.minFeeDefaultMigrated = true;
      }
      parsed.sites = (parsed.sites || []).map(migrateSite);
      if (parsed.weeksPerMonth !== undefined) parsed.weeksPerMonth = normalizeHalfWidth(parsed.weeksPerMonth);
      return parsed;
    }
  } catch (e) { /* ignore */ }
  return { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("")], minFeeDefaultMigrated: true };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// 全角数字（IMEが有効なまま数字を打つと「２」のようになることがある）や全角の.－を
// 半角に変換する。Number()は全角文字をNaN扱いしてしまい、無効値として0にフォールバック
// されてしまう（見た目は正しそうなのに計算だけ狂う）ため、検証・保存の前に必ず通す。
function normalizeHalfWidth(str) {
  if (str === null || str === undefined) return str;
  return String(str)
    .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, " ")
    .replace(/−/g, "-")
    .trim();
}

// 数値入力の検証：空欄は許可、マイナス値や数値として解釈できない値はエラー扱いにする。
// 計算には使わせず（0として扱う）、入力欄を赤く縁取りしてエラー文言を出す。
function validateNumberField(rawValue, { min = 0, allowBlank = true, fallback = 0 } = {}) {
  const normalized = normalizeHalfWidth(rawValue);
  if (normalized === "" || normalized === null || normalized === undefined) {
    return allowBlank
      ? { invalid: false, value: fallback }
      : { invalid: true, message: "数値を入力してください", value: fallback };
  }
  const num = Number(normalized);
  if (Number.isNaN(num) || !Number.isFinite(num)) {
    return { invalid: true, message: "数値を入力してください", value: fallback };
  }
  if (num < min) {
    return { invalid: true, message: `${min}以上の値を入力してください`, value: fallback };
  }
  return { invalid: false, value: num };
}

function validateRequiredText(value) {
  const trimmed = (value || "").trim();
  if (!trimmed) return { invalid: true, message: "企業名を入力してください" };
  return { invalid: false };
}

function markFieldValidity(inputEl, result) {
  inputEl.classList.toggle("input-error", result.invalid);
  const container = inputEl.closest("td, label") || inputEl.parentElement;
  const errorEl = container ? container.querySelector(".field-error") : null;
  if (errorEl) errorEl.textContent = result.invalid ? result.message : "";
}

// 最大値側の欄が実際に入力されているか（空欄なら「範囲」ではなく最小値のみの単一数量として扱う）
function hasNumericValue(raw) {
  return raw !== "" && raw !== null && raw !== undefined && !Number.isNaN(Number(normalizeHalfWidth(raw)));
}

// monthly avg / min / max quantity for an item
function computeItem(item) {
  const weeks = validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }).value;

  if (item.inputMode === "weekly") {
    // 頻度が分からない新規店舗など向け：1回あたり数量×頻度ではなく、週の合計量をざっくり入力する方式
    const wMin = validateNumberField(item.weeklyQtyMin).value;
    const wMax = hasNumericValue(item.weeklyQtyMax) ? validateNumberField(item.weeklyQtyMax).value : wMin;
    const wLo = Math.min(wMin, wMax);
    const wHi = Math.max(wMin, wMax);
    const avg = (wMin + wMax) / 2;
    return { monthlyMin: wLo * weeks, monthlyMax: wHi * weeks, monthlyAvg: avg * weeks };
  }

  const qtyMin = validateNumberField(item.qtyMin).value;
  // 最大値が未入力なら「範囲」ではなく最小値と同じ単一の数量として扱う
  const qtyMax = hasNumericValue(item.qtyMax) ? validateNumberField(item.qtyMax).value : qtyMin;
  // 表示用の範囲は常に小さい方〜大きい方の順にする（数量maxに数量min未満の値を入れても逆転表示にならないように）
  const qtyLo = Math.min(qtyMin, qtyMax);
  const qtyHi = Math.max(qtyMin, qtyMax);
  const avg = (qtyMin + qtyMax) / 2;
  const days = validateNumberField(item.daysPerWeek).value;

  const monthlyMin = qtyLo * days * weeks;
  const monthlyMax = qtyHi * days * weeks;
  const monthlyAvg = avg * days * weeks;

  return { monthlyMin, monthlyMax, monthlyAvg };
}

function itemLabelPlain(item) {
  return item.type === "その他" ? (item.customType || "その他") : item.type;
}

function itemLabel(item) {
  const base = itemLabelPlain(item);
  return BAG_SIZE_TYPES.includes(item.type) ? `${base}(${item.bagSize}L)` : base;
}

// 種別・袋サイズから、社内共有メール向けの「1kg◯円、月◯袋想定(1袋◯kgの場合)」を組み立てるための重量・単価情報。
function getPriceDetail(item) {
  const pricePerKg = PRICE_PER_KG[item.type];
  if (pricePerKg === undefined) return null;
  if (item.type === "段ボール") {
    return { pricePerKg, weightPerUnit: CARDBOARD_WEIGHT_PER_SHEET, unitLabel: "枚" };
  }
  if (WEIGHT_TABLE[item.type]) {
    return { pricePerKg, weightPerUnit: WEIGHT_TABLE[item.type][item.bagSize], unitLabel: "袋" };
  }
  return null;
}

function computeSite(site) {
  let totalQty = 0, totalCost = 0, pricedCount = 0, unpricedCount = 0;
  const breakdown = [];
  site.items.forEach(item => {
    const monthlyAvg = computeItem(item).monthlyAvg;
    totalQty += monthlyAvg;
    const unitPrice = getUnitPrice(item);
    if (unitPrice !== undefined) {
      const cost = monthlyAvg * unitPrice;
      totalCost += cost;
      pricedCount++;
      breakdown.push({ label: itemLabel(item), qty: monthlyAvg, unitPrice, cost });
    } else {
      unpricedCount++;
    }
  });

  const minMonthlyFee = validateNumberField(site.minMonthlyFee).value;
  const minimumApplied = totalCost < minMonthlyFee;
  const monthlyCost = minimumApplied ? minMonthlyFee : totalCost;
  const setupFee = site.includeSetupFee ? SETUP_FEE : 0;
  const quoteTotal = monthlyCost + setupFee;

  return { totalQty, totalCost, monthlyCost, minimumApplied, minMonthlyFee, setupFee, quoteTotal, breakdown, pricedCount, unpricedCount };
}

function fmt(n, digits = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function yen(n) { return "¥" + n.toLocaleString("ja-JP", { maximumFractionDigits: 0 }); }

// render()は毎回DOMを丸ごと作り直すため、そのままだと入力中の要素がフォーカスを失い、
// 1文字打つたびに入力が止まってしまう。再描画の前後でフォーカス位置・カーソル位置を記録して復元する。
function captureFocus() {
  const active = document.activeElement;
  if (!active || !active.dataset || !active.dataset.role) return null;
  const siteCard = active.closest("[data-site-id]");
  const itemRow = active.closest("[data-item-id]");
  return {
    role: active.dataset.role,
    siteId: siteCard ? siteCard.dataset.siteId : null,
    itemId: itemRow ? itemRow.dataset.itemId : null,
    selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
    selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null
  };
}

function restoreFocus(info) {
  if (!info) return;
  let scope = document;
  if (info.siteId) {
    scope = document.querySelector(`[data-site-id="${info.siteId}"]`) || document;
  }
  if (info.itemId && scope !== document) {
    scope = scope.querySelector(`[data-item-id="${info.itemId}"]`) || scope;
  }
  const el = scope.querySelector(`[data-role="${info.role}"]`);
  if (!el) return;
  el.focus();
  if (info.selectionStart !== null && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(info.selectionStart, info.selectionEnd); } catch (e) { /* ignore */ }
  }
}

let lastRenderedView = null; // 画面切り替え（一覧⇔金額提示⇔使い方）のときだけ先頭にスクロールするための記録

function render() {
  const focusInfo = captureFocus();
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view === "quote") {
    const site = state.sites.find(s => s.id === state.activeSiteId);
    if (!site) { state.view = "list"; saveState(); return render(); }
    app.appendChild(renderQuoteScreen(site));
    autoResizeQuoteTextareas();
  } else if (state.view === "guide") {
    app.appendChild(renderGuideScreen());
  } else {
    app.appendChild(renderListScreen());
  }
  if (state.view !== lastRenderedView) {
    window.scrollTo(0, 0);
    lastRenderedView = state.view;
  }
  restoreFocus(focusInfo);
  saveState();
}

function renderListScreen() {
  const frag = document.createDocumentFragment();
  const wrap = document.createElement("div");

  wrap.innerHTML = `
    <h1>定期回収計算ツール</h1>
    <p class="subtitle">企業名を入れて、ゴミの種類と袋数・回数を入れるだけ。金額は自動で計算します。</p>
    <div class="toolbar">
      <button class="btn-primary" id="addSiteBtn">＋ 案件を追加</button>
      <button id="guideBtn">使い方・単価表</button>
      <button id="resetBtn" class="btn-danger">全データをクリア</button>
    </div>
    <div id="sitesContainer"></div>
    <details class="advanced-settings" ${advancedSettingsOpen ? "open" : ""}>
      <summary>詳細な計算設定（デフォルト：4.35週）</summary>
      <div class="advanced-settings-body">
        <label class="field-block">1ヶ月あたりの週数
          <input type="text" inputmode="decimal" id="weeksPerMonth" data-role="weeksPerMonth" value="${state.weeksPerMonth}">
          <span class="field-error"></span>
        </label>
        <p class="note" style="margin:8px 0 0;">※既定値は365日÷12ヶ月÷7日で算出した平均週数です。通常は変更不要です。必要な場合のみ調整してください。</p>
      </div>
    </details>
    <footer>定期回収計算ツール｜社内用</footer>
  `;
  frag.appendChild(wrap);

  const sitesContainer = wrap.querySelector("#sitesContainer");
  state.sites.forEach(site => sitesContainer.appendChild(renderSiteCard(site)));

  const weeksEl = wrap.querySelector("#weeksPerMonth");
  markFieldValidity(weeksEl, validateNumberField(state.weeksPerMonth, { min: 0.01, allowBlank: false, fallback: 4.35 }));
  weeksEl.addEventListener("input", (e) => { state.weeksPerMonth = normalizeHalfWidth(e.target.value); render(); });
  wrap.querySelector(".advanced-settings").addEventListener("toggle", (e) => {
    advancedSettingsOpen = e.target.open;
  });
  wrap.querySelector("#addSiteBtn").addEventListener("click", () => {
    state.sites.push(defaultSite(""));
    render();
  });
  wrap.querySelector("#guideBtn").addEventListener("click", () => {
    state.view = "guide";
    render();
  });
  wrap.querySelector("#resetBtn").addEventListener("click", () => {
    if (!confirm("全ての案件データを削除して初期状態に戻します。よろしいですか？")) return;
    state = { view: "list", activeSiteId: null, weeksPerMonth: 4.35, sites: [defaultSite("")] };
    render();
  });

  return frag;
}

function renderSiteCard(site) {
  const card = document.createElement("div");
  card.className = "site-card";
  card.dataset.siteId = site.id;

  const head = document.createElement("div");
  head.className = "site-head";
  head.innerHTML = `
    <label class="site-name-field">
      <span class="field-label-text">企業名<span class="required-badge">必須</span></span>
      <input type="text" value="${escapeAttr(site.name)}" data-role="site-name" placeholder="例：株式会社サキュレ">
      <span class="field-error"></span>
    </label>
    <button class="btn-delete-site" data-role="delete-site" title="この案件を削除">×</button>
  `;
  card.appendChild(head);

  const table = document.createElement("table");
  table.innerHTML = `
    <thead>
      <tr>
        <th>種別</th>
        <th>袋サイズ</th>
        <th>1回あたり数量(min〜max)</th>
        <th>頻度(週◯回)</th>
        <th class="num-col">月間量（目安）</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");
  site.items.forEach(item => tbody.appendChild(renderItemRow(site, item)));
  const tableScroll = document.createElement("div");
  tableScroll.className = "table-scroll";
  tableScroll.appendChild(table);
  card.appendChild(tableScroll);

  const addRowBtn = document.createElement("button");
  addRowBtn.className = "add-row-btn";
  addRowBtn.textContent = "＋ 項目を追加";
  addRowBtn.addEventListener("click", () => {
    site.items.push(defaultItem());
    render();
  });
  card.appendChild(addRowBtn);

  const summary = computeSite(site);
  const summaryDiv = document.createElement("div");
  summaryDiv.className = "site-summary";
  summaryDiv.innerHTML = `
    <div class="stat"><b>${fmt(summary.totalQty)}</b><span>月間合計 個数（袋+枚）</span></div>
  `;
  card.appendChild(summaryDiv);

  const minFeePanel = document.createElement("div");
  minFeePanel.className = "min-fee-panel";
  minFeePanel.innerHTML = `
    <label>最低基本料金(円/月)
      <input type="text" inputmode="decimal" data-role="minMonthlyFee" value="${escapeAttr(site.minMonthlyFee)}">
      <span class="field-error"></span>
    </label>
    <span class="note" style="margin:0;">※計算した月額がこれを下回る場合、自動的にこの金額まで引き上げます。</span>
  `;
  card.appendChild(minFeePanel);

  const workConditionsDiv = document.createElement("div");
  workConditionsDiv.className = "work-conditions-field";
  workConditionsDiv.innerHTML = `
    <label>作業条件・特記事項（見積前提条件に反映されます）</label>
    <textarea data-role="workConditions" placeholder="例：出入口に段差あり、夜間収集希望、駐車スペース確保が必要　など">${escapeHtml(site.workConditions)}</textarea>
  `;
  card.appendChild(workConditionsDiv);

  const contractDateDiv = document.createElement("div");
  contractDateDiv.className = "work-conditions-field";
  contractDateDiv.innerHTML = `
    <label>契約開始日（契約書に反映・任意。空欄の場合は契約書の該当欄が空欄になります）</label>
    <input type="date" data-role="contractStartDate" value="${escapeAttr(site.contractStartDate)}">
  `;
  card.appendChild(contractDateDiv);

  const staffNameDiv = document.createElement("div");
  staffNameDiv.className = "work-conditions-field";
  staffNameDiv.innerHTML = `
    <label>担当者名（見積書PDFに反映・任意）</label>
    <input type="text" data-role="staffName" value="${escapeAttr(site.staffName)}" style="max-width:200px;">
  `;
  card.appendChild(staffNameDiv);

  const nameValidation = validateRequiredText(site.name);
  const actions = document.createElement("div");
  actions.className = "card-actions";
  actions.innerHTML = `<button class="btn-quote" data-role="show-quote" ${nameValidation.invalid ? `disabled title="企業名を入力してください"` : ""}>見積を出す</button>`;
  actions.querySelector('[data-role="show-quote"]').addEventListener("click", () => {
    site.includeSetupFee = true; // 金額提示画面を開くたびに、初回手数料チェックは常にONへ戻す
    state.view = "quote";
    state.activeSiteId = site.id;
    render();
  });
  card.appendChild(actions);

  const siteNameEl = head.querySelector('[data-role="site-name"]');
  markFieldValidity(siteNameEl, nameValidation);
  // 企業名欄は他の項目のように入力のたびに再描画する必要がないため、入力中は再描画しない
  // （スマホで再描画のたびにキーボードがちらつく・入力しづらくなるのを防ぐため）。
  // フォーカスが外れたタイミングでのみ再描画し、必須チェックの表示を更新する。
  siteNameEl.addEventListener("input", (e) => {
    site.name = e.target.value;
    saveState();
  });
  // setTimeoutで1テック遅らせることで、「フォーカスが外れた直後に別のボタンをクリックする」
  // 操作でblurのrender()がそのクリックの処理と競合し、クリックが効かなくなるのを防ぐ。
  siteNameEl.addEventListener("blur", () => { setTimeout(render, 0); });

    if (!confirm(`「${site.name || "(企業名未入力)"}」を削除しますか？`)) return;

  });
  const staffNameEl = staffNameDiv.querySelector('[data-role="staffName"]');
  // 企業名欄と同様、入力中の再描画によるスマホでの入力しづらさを避けるため、フォーカスが外れたタイミングでのみ再描画する。
  staffNameEl.addEventListener("input", (e) => {
    site.staffName = e.target.value;
    saveState();
  });
  staffNameEl.addEventListener("blur", () => { setTimeout(render, 0); });

  return card;

function renderItemRow(site, item) {
  const tr = document.createElement("tr");
  tr.dataset.itemId = item.id;
  const c = computeItem(item);
  const isCustom = item.type === "その他";
  const hasBagSize = BAG_SIZE_TYPES.includes(item.type);
  const showRange = Math.round(c.monthlyMin) !== Math.round(c.monthlyMax);
  const isWeekly = item.inputMode === "weekly";

  // 頻度が分からない新規店舗などは「1回あたり数量×頻度」の代わりに「週の合計量」をざっくり入力できる。
  // 切り替えても入力済みの値は消さず保持するので、後から回数が分かれば詳しい入力に戻せる。
  const qtyFreqHtml = isWeekly ? `
    <td data-label="週の合計（目安）" colspan="2">
      <div class="qty-pair">
        <input type="text" inputmode="decimal" data-role="weeklyQtyMin" value="${item.weeklyQtyMin}" placeholder="週◯袋"> 〜
        <input type="text" inputmode="decimal" data-role="weeklyQtyMax" value="${item.weeklyQtyMax}" placeholder="－" title="数量が1つだけの場合は空欄でOK（最小値のみで計算します）">
      </div>
      <span class="note" style="margin:2px 0 0;">週合計・だいたいでOK</span>
      <span class="field-error"></span><br>
      <a class="note" data-role="toggle-mode">回数がわかれば詳しく入力に戻す</a>
    </td>
  ` : `
    <td data-label="1回あたり数量">
      <div class="qty-pair">
        <input type="text" inputmode="decimal" data-role="qtyMin" value="${item.qtyMin}"> 〜
        <input type="text" inputmode="decimal" data-role="qtyMax" value="${item.qtyMax}" placeholder="－" title="数量が1つだけの場合は空欄でOK（最小値のみで計算します）">
      </div>
      <span class="field-error"></span>
    </td>

      <span class="field-error"></span><br>
      <a class="note" data-role="toggle-mode">週の合計でざっくり入力</a>
    </td>
  `;

  tr.innerHTML = `
    <td data-label="種別">

    </td>
    <td data-label="袋サイズ">
      ${hasBagSize ? `
        <select data-role="bagSize">
          ${BAG_SIZES.map(s => `<option value="${s}" ${s === item.bagSize ? "selected" : ""}>${s}L</option>`).join("")}

    <td class="num-col" data-label="月間量（目安）">
      <div class="monthly-qty-value">${fmt(c.monthlyAvg)}<span class="qty-unit">個/月</span></div>
      ${showRange ? `<span class="note qty-range-note">目安 ${fmt(c.monthlyMin)}〜${fmt(c.monthlyMax)}個</span>` : ""}
    </td>
    <td class="row-actions"><button class="btn-danger" data-role="delete-item" title="削除">×</button></td>
  `;

  tr.querySelector('[data-role="type"]').addEventListener("change", (e) => {
    item.type = e.target.value;
    render();
  });
  const customInput = tr.querySelector('[data-role="customType"]');

    // こちらも企業名欄と同様、入力中の再描画によるスマホでの入力しづらさを避けるため

    customInput.addEventListener("input", (e) => {

    bagSizeEl.addEventListener("change", (e) => { item.bagSize = Number(e.target.value); render(); });

  tr.querySelector('[data-role="toggle-mode"]').addEventListener("click", (e) => {
    e.preventDefault();
    item.inputMode = isWeekly ? "detail" : "weekly";
    render();
  });

  if (isWeekly) {
    const wMinEl = tr.querySelector('[data-role="weeklyQtyMin"]');
    const wMaxEl = tr.querySelector('[data-role="weeklyQtyMax"]');
    // 再描画のたびに現在値で検証しなおし、エラー表示が消えないようにする
    markFieldValidity(wMinEl, validateNumberField(item.weeklyQtyMin));
    markFieldValidity(wMaxEl, validateNumberField(item.weeklyQtyMax));
    wMinEl.addEventListener("input", (e) => { item.weeklyQtyMin = normalizeHalfWidth(e.target.value); render(); });
    wMaxEl.addEventListener("input", (e) => { item.weeklyQtyMax = normalizeHalfWidth(e.target.value); render(); });
  } else {
    const qtyMinEl = tr.querySelector('[data-role="qtyMin"]');
    const qtyMaxEl = tr.querySelector('[data-role="qtyMax"]');
    const daysEl = tr.querySelector('[data-role="daysPerWeek"]');
    // 再描画のたびに現在値で検証しなおし、エラー表示が消えないようにする
    markFieldValidity(qtyMinEl, validateNumberField(item.qtyMin));
    markFieldValidity(qtyMaxEl, validateNumberField(item.qtyMax));
    markFieldValidity(daysEl, validateNumberField(item.daysPerWeek));
    qtyMinEl.addEventListener("input", (e) => { item.qtyMin = normalizeHalfWidth(e.target.value); render(); });
    qtyMaxEl.addEventListener("input", (e) => { item.qtyMax = normalizeHalfWidth(e.target.value); render(); });
    daysEl.addEventListener("input", (e) => { item.daysPerWeek = normalizeHalfWidth(e.target.value); render(); });
  }

  tr.querySelector('[data-role="delete-item"]').addEventListener("click", () => {
    site.items = site.items.filter(i => i.id !== item.id);
    render();
  });

  return tr;
}

// 契約時のトラブル防止のための「見積前提条件」文面を、入力済みの項目から自動で組み立てる。
function generateTermsText(site) {
  const lines = [];
  lines.push("【お見積り前提条件】");
  lines.push(`企業名：${site.name || "(未入力)"}`);
  lines.push("下記の内容を前提として、本お見積りを算定しております。");
  lines.push("");
  if (site.items.length) {
    site.items.forEach(item => {
      const c = computeItem(item);
      const label = itemLabel(item);
      if (item.inputMode === "weekly") {
        const hasMax = hasNumericValue(item.weeklyQtyMax);
        const qtyText = hasMax && String(item.weeklyQtyMax) !== String(item.weeklyQtyMin) ? `${item.weeklyQtyMin}〜${item.weeklyQtyMax}` : `${item.weeklyQtyMin}`;
        lines.push(`・${label}：週あたり合計${qtyText}個想定（月間想定 ${fmt(c.monthlyAvg)}個）`);
      } else {
        const hasMax = hasNumericValue(item.qtyMax);
        const qtyText = hasMax && String(item.qtyMax) !== String(item.qtyMin) ? `${item.qtyMin}〜${item.qtyMax}` : `${item.qtyMin}`;
        lines.push(`・${label}：1回あたり${qtyText}個、週${item.daysPerWeek}回収集（月間想定 ${fmt(c.monthlyAvg)}個）`);
      }
    });
  } else {
    lines.push("・（品目が登録されていません）");
  }
  lines.push("");
  if (site.workConditions && site.workConditions.trim()) {
    lines.push("【作業条件・特記事項】");
    lines.push(site.workConditions.trim());
    lines.push("");
  }
  const minFee = validateNumberField(site.minMonthlyFee, { min: 0, allowBlank: false, fallback: DEFAULT_MIN_MONTHLY_FEE }).value;
  lines.push(`月間の排出量に基づく料金が最低料金を下回る場合は、基本料金として${yen(minFee)}を頂戴いたします。`);
  lines.push("実際の排出量が上記の想定数量を大きく上回る場合、または収集頻度・排出場所などの条件に変更が生じた場合は、");
  lines.push("別途お見積りを再算定させていただく場合がございますので、あらかじめご了承ください。");
  return lines.join("\n");
}

// 社内共有用の見積内訳文面（担当者が実際に使っている「1kg◯円、月◯袋想定(1袋◯kgの場合)」の形式）。
function generateBreakdownEmailText(site) {
  const summary = computeSite(site);
  const lines = [];
  lines.push(`件名：${site.name || "(未入力)"} 御見積のご案内`);
  lines.push("");
  lines.push("お世話になっております。");
  lines.push(`${site.name || "(未入力)"}様の御見積の内訳を記載しましたのでご確認をお願いいたします。`);
  lines.push("");
  site.items.forEach(item => {
    const detail = getPriceDetail(item);
    if (!detail) return;
    const monthlyQty = Math.round(computeItem(item).monthlyAvg);
    lines.push(`${itemLabelPlain(item)}：1kg${detail.pricePerKg}円、月${monthlyQty}${detail.unitLabel}想定(1${detail.unitLabel}${detail.weightPerUnit}kgの場合)`);
  });
  if (site.includeSetupFee) {
    lines.push(`初回手数料:${SETUP_FEE.toLocaleString("ja-JP")}円`);
  }
  lines.push("");
  lines.push(`合計金額（税別）：${yen(summary.quoteTotal)}`);
  const taxInfo = computeTax(summary.quoteTotal);
  lines.push(`消費税：${yen(taxInfo.tax)}`);
  lines.push(`合計金額（税込）：${yen(taxInfo.totalWithTax)}`);

    lines.push("");

  return lines.join("\n");
}

// ------------------------------------------------------------------
// 契約書（Word/.docx）の生成
// 外部ライブラリを使わず、ZIP（storeモード）とOOXMLを直接組み立てて .docx を出力する。
// ------------------------------------------------------------------

const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16le(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
function u32le(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }

// files: [{ name, data: Uint8Array }] を、無圧縮（store）ZIPにまとめる。
function buildZip(files) {
  const DOS_TIME = 0x0000;
  const DOS_DATE = 0x0021; // 1980-01-01（DOS日付のダミー値）
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(file => {
    const nameBytes = encoder.encode(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new Uint8Array([
      ...u32le(0x04034b50), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(DOS_TIME), ...u16le(DOS_DATE),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0)
    ]);
    const localEntry = new Uint8Array(localHeader.length + nameBytes.length + data.length);
    localEntry.set(localHeader, 0);
    localEntry.set(nameBytes, localHeader.length);
    localEntry.set(data, localHeader.length + nameBytes.length);
    localParts.push(localEntry);

    const centralHeader = new Uint8Array([
      ...u32le(0x02014b50), ...u16le(20), ...u16le(20), ...u16le(0), ...u16le(0),
      ...u16le(DOS_TIME), ...u16le(DOS_DATE),
      ...u32le(crc), ...u32le(size), ...u32le(size),
      ...u16le(nameBytes.length), ...u16le(0), ...u16le(0), ...u16le(0), ...u16le(0),
      ...u32le(0), ...u32le(offset)
    ]);
    const centralEntry = new Uint8Array(centralHeader.length + nameBytes.length);
    centralEntry.set(centralHeader, 0);
    centralEntry.set(nameBytes, centralHeader.length);
    centralParts.push(centralEntry);

    offset += localEntry.length;
  });

  const centralSize = centralParts.reduce((sum, p) => sum + p.length, 0);
  const centralOffset = offset;
  const eocd = new Uint8Array([
    ...u32le(0x06054b50), ...u16le(0), ...u16le(0),
    ...u16le(files.length), ...u16le(files.length),
    ...u32le(centralSize), ...u32le(centralOffset), ...u16le(0)
  ]);

  const result = new Uint8Array(offset + centralSize + eocd.length);
  let pos = 0;
  localParts.forEach(p => { result.set(p, pos); pos += p.length; });
  centralParts.forEach(p => { result.set(p, pos); pos += p.length; });
  result.set(eocd, pos);
  return result;
}

function escapeXml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// テキスト（改行含む）を1つのランに変換。改行は<w:br/>で表現する。
// フォントは雛形に合わせてMS明朝で統一する。
function docxRun(text, opts = {}) {
  const rPrParts = [`<w:rFonts w:ascii="MS Mincho" w:hAnsi="MS Mincho" w:eastAsia="MS Mincho" w:hint="eastAsia"/>`];
  if (opts.bold) rPrParts.push("<w:b/><w:bCs/>");
  const size = opts.size || 20;
  rPrParts.push(`<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`);
  const rPr = `<w:rPr>${rPrParts.join("")}</w:rPr>`;
  const lines = String(text).split("\n");
  const body = lines.map((line, i) => (i > 0 ? "<w:br/>" : "") + `<w:t xml:space="preserve">${escapeXml(line)}</w:t>`).join("");
  return `<w:r>${rPr}${body}</w:r>`;
}

// 段落（見出し／本文）を1つ生成。indentLeft/indentHanging/indentFirstLineはtwips指定（雛形のw:ind値をそのまま渡す）。
function docxParagraph(text, opts = {}) {
  const pPrParts = [];
  if (opts.align) pPrParts.push(`<w:jc w:val="${opts.align}"/>`);
  if (opts.indentLeft !== undefined || opts.indentHanging !== undefined || opts.indentFirstLine !== undefined) {
    const attrs = [];
    if (opts.indentLeft !== undefined) attrs.push(`w:left="${opts.indentLeft}"`);
    if (opts.indentHanging !== undefined) attrs.push(`w:hanging="${opts.indentHanging}"`);
    if (opts.indentFirstLine !== undefined) attrs.push(`w:firstLine="${opts.indentFirstLine}"`);
    pPrParts.push(`<w:ind ${attrs.join(" ")}/>`);
  }
  const before = opts.spacingBefore !== undefined ? opts.spacingBefore : 0;
  const after = opts.spacingAfter !== undefined ? opts.spacingAfter : 0;
  pPrParts.push(`<w:spacing w:before="${before}" w:after="${after}"/>`);
  const pPr = `<w:pPr>${pPrParts.join("")}</w:pPr>`;
  return `<w:p>${pPr}${docxRun(text, opts)}</w:p>`;
}

// 「2026年　6月　19日」のような、雛形と同じ書式（全角スペース区切り・0埋めなし）の日付文字列を作る。
function formatJapaneseDate(y, m, d) {
  return `${y}年　${m}月　${d}日`;
}

// 契約開始日（YYYY-MM-DD）から、第14条関係の契約期間（開始日〜1年後の前日）を計算する。
function computeContractPeriod(startDateStr) {
  if (!startDateStr) return null;
  const parts = startDateStr.split("-").map(Number);
  const [y, m, d] = parts;
  if (!y || !m || !d) return null;
  const start = new Date(y, m - 1, d);
  const end = new Date(y + 1, m - 1, d);
  end.setDate(end.getDate() - 1);
  return {
    startText: formatJapaneseDate(start.getFullYear(), start.getMonth() + 1, start.getDate()),
    endText: formatJapaneseDate(end.getFullYear(), end.getMonth() + 1, end.getDate())
  };
}

// 御社の実際の契約書雛形（一般廃棄物収集運搬処理委託契約書）に準拠して条文一式を組み立てる。
// 条文本文・条番号の有無・字下げなどは雛形をそのまま踏襲し、以下のみ案件データで自動入力する。

const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

function buildContractDocxBytes(site) {
  const paragraphs = generateContractParagraphs(site);
  const bodyXml = paragraphs.map(p => docxParagraph(p.text, p)).join("");
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${bodyXml}
    <w:sectPr>
      <w:pgSz w:w="11907" w:h="16840" w:code="9"/>
      <w:pgMar w:top="851" w:right="1134" w:bottom="851" w:left="1134" w:header="851" w:footer="992" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const encoder = new TextEncoder();
  return buildZip([
    { name: "[Content_Types].xml", data: encoder.encode(contentTypesXml) },
    { name: "_rels/.rels", data: encoder.encode(relsXml) },
    { name: "word/document.xml", data: encoder.encode(documentXml) }
  ]);
}

function buildContractDocxBlob(site) {
  return new Blob([buildContractDocxBytes(site)], { type: DOCX_MIME });
}

// bytes -> base64（大きいバイト列でもスタックオーバーフローしないようchunk分割する）
function uint8ToBase64(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// Artifact（claude.ai）のiframeサンドボックスでは<a download>クリックが反応しないことがあるため、
// data:URIへの通常のリンク遷移（target="_blank"）でも開けるようにしておく保険。
function buildContractDocxDataUrl(site) {
  const base64 = uint8ToBase64(buildContractDocxBytes(site));
  return `data:${DOCX_MIME};base64,${base64}`;
}

// ブラウザによってはダウンロードのファイル名に日本語が使えず「download」（拡張子なし）に
// 化けてしまうことがあるため、ファイル名は英数字のみ（日時ベース）にしておく。
function formatTimestampForFilename() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

// Artifact（claude.ai）上では、iframeのサンドボックス制約によりブラウザへの直接ダウンロード
// （<a download>のクリック）が反応しないことがあるため、window.claude.downloadsが使える場合は
// そちらを優先する。使えない場合（ローカルでindex.htmlを直接開いた場合など）は従来方式にする。
async function downloadBlob(blob, filename) {
  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({ filename, data: blob });
      return { ok: true };
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") {
        return { ok: false, message: "ダウンロードがキャンセルされました。" };
      }
      if (code === "extension_not_enabled" || code === "rejected_extension") {
        return { ok: false, message: "この画面ではWordファイルのダウンロードに対応していません。", needsTextFallback: true };
      }
      if (code === "rate_limited") {
        return { ok: false, message: "少し時間をおいてから、もう一度お試しください。" };
      }
      // unavailable・not_granted等：従来方式にフォールバックしてみる
    }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return { ok: true };
  } catch (err) {
    return { ok: false, message: "ダウンロードに失敗しました。" };
  }
}

// 契約書（Word）のダウンロードに対応していない画面向けの、書式なしテキスト版フォールバック。
function generateContractPlainText(site) {
  return generateContractParagraphs(site).map(p => p.text).join("\n");
}

async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* フォールバックへ */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

      <label class="setup-fee-toggle">
        <input type="checkbox" data-role="setupFee" ${site.includeSetupFee ? "checked" : ""}>
        初回手数料（¥3,000）を含める
      </label>
      <div class="terms-section">
        <h3>見積前提条件（コピーしてお客様への文面にお使いください）</h3>
        <textarea data-role="termsText" readonly>${escapeHtml(termsText)}</textarea>
        <div class="terms-actions">
          <span class="copy-feedback" data-role="copyFeedback"></span>
          <button data-role="copyTerms">コピーする</button>
        </div>
      </div>
      <div class="terms-section">
        <h3>見積内訳メール文面（社内共有用）</h3>
        <textarea data-role="breakdownEmailText" readonly>${escapeHtml(breakdownEmailText)}</textarea>
        <div class="terms-actions">
          <span class="copy-feedback" data-role="copyFeedback2"></span>
          <button data-role="copyBreakdownEmail">コピーする</button>
        </div>
      </div>
      <div class="terms-section">
        <h3>見積書（PDFで保存・印刷）</h3>
        <p class="note" style="margin:0 0 10px;">品目・金額をもとにした見積書のレイアウトを、新しいタブで開きます。開いたタブの「PDFとして保存・印刷する」ボタンを押すと印刷ダイアログが開くので、印刷先（送信先）を「PDFに保存」に選んで保存してください。新しいタブが開けない場合は、代わりにHTMLファイルとしてダウンロードされます（ダウンロードしたファイルを開いて同様に印刷してください）。</p>
        <div class="terms-actions" style="justify-content:flex-start; flex-wrap:wrap;">
          <span class="copy-feedback" data-role="printQuoteFeedback"></span>
          <button data-role="printQuote">見積書を新しいタブで開く</button>
        </div>
      </div>
      <div class="terms-section">
        <h3>契約書（Wordファイルをダウンロード）</h3>
        <p class="note" style="margin:0 0 10px;">品目・料金・作業条件をもとにした簡易な契約書の雛形です。住所・代表者名などは空欄になっているので、実際の契約締結前に内容を確認・加筆してください。<br>※ブラウザの都合上、ファイル名は「keiyakusho_日時.docx」になります（日本語ファイル名にできないため）。保存後、必要に応じてリネームしてください。</p>
        <div class="terms-actions" style="justify-content:flex-start; flex-wrap:wrap;">
          <span class="copy-feedback" data-role="downloadFeedback"></span>
          <button data-role="downloadContract">契約書をダウンロード（Word）</button>
          <a data-role="downloadContractLink" target="_blank" rel="noopener" download="keiyakusho.docx" class="note" style="margin:0;">ダウンロードされない場合はこちら（別ウィンドウで開く）</a>
        </div>
      </div>
    </div>
  `;

  wrap.querySelector('[data-role="back"]').addEventListener("click", () => {
    state.view = "list";
    render();
  });
  wrap.querySelector('[data-role="setupFee"]').addEventListener("change", (e) => {
    site.includeSetupFee = e.target.checked;
    render();
  });
  wrap.querySelector('[data-role="copyTerms"]').addEventListener("click", async (e) => {
    const ok = await copyTextToClipboard(termsText);
    const feedback = wrap.querySelector('[data-role="copyFeedback"]');
    feedback.textContent = ok ? "コピーしました！" : "コピーできませんでした。手動で選択してください。";
    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });
  wrap.querySelector('[data-role="copyBreakdownEmail"]').addEventListener("click", async (e) => {
    const ok = await copyTextToClipboard(breakdownEmailText);
    const feedback = wrap.querySelector('[data-role="copyFeedback2"]');
    feedback.textContent = ok ? "コピーしました！" : "コピーできませんでした。手動で選択してください。";
    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });
  wrap.querySelector('[data-role="printQuote"]').addEventListener("click", async () => {
    const feedback = wrap.querySelector('[data-role="printQuoteFeedback"]');
    feedback.textContent = "";
    const blob = new Blob([buildPrintQuoteDocument(site, summary)], { type: "text/html" });
    const blobUrl = URL.createObjectURL(blob);
    const opened = window.open(blobUrl, "_blank");
    if (opened) {
      // 開いたタブ側でBlobを読み込むまで少し時間を置いてからURLを解放する
      setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
      return;
    }
    // ポップアップブロック等で新しいタブが開けなかった場合は、HTMLファイルとしてダウンロードしてもらう
    URL.revokeObjectURL(blobUrl);
    const result = await downloadBlob(blob, "mitsumorisho.html");
    feedback.textContent = result.ok
      ? "新しいタブを開けなかったため、ファイルをダウンロードしました。開いて印刷してください。"
      : (result.message || "見積書を開けませんでした。");
    setTimeout(() => { feedback.textContent = ""; }, 5000);
  });
  wrap.querySelector('[data-role="downloadContractLink"]').href = buildContractDocxDataUrl(site);
  wrap.querySelector('[data-role="downloadContract"]').addEventListener("click", async () => {
    const feedback = wrap.querySelector('[data-role="downloadFeedback"]');
    feedback.textContent = "";
    const blob = buildContractDocxBlob(site);
    const result = await downloadBlob(blob, `keiyakusho_${formatTimestampForFilename()}.docx`);
    if (result.ok) {
      feedback.textContent = "ダウンロードしました！";
    } else if (result.needsTextFallback) {
      const textResult = await downloadBlob(
        new Blob([generateContractPlainText(site)], { type: "text/plain" }),
        `keiyakusho_${formatTimestampForFilename()}.txt`
      );
      feedback.textContent = textResult.ok
        ? "Wordは非対応のため、テキスト形式でダウンロードしました。"
        : (result.message || "ダウンロードに失敗しました。");
    } else {
      feedback.textContent = result.message || "ダウンロードに失敗しました。";
    }
    setTimeout(() => { feedback.textContent = ""; }, 4000);
  });

  frag.appendChild(wrap);
  return frag;
}

// 見積前提条件・見積内訳メール文面は、テキスト量によって長さが変わるため、スクロールしないと
// 全文が見えない状態を避けるべく、内容に合わせて高さを自動で広げる。scrollHeightはDOMに
// 実際に接続されてからでないと正しく計算できないため、render()側で（appendChild後に）呼び出す。
function autoResizeQuoteTextareas() {
  ["termsText", "breakdownEmailText"].forEach(role => {
    const el = document.querySelector(`[data-role="${role}"]`);
    if (!el) return;
    el.style.height = "auto";
    el.style.height = (el.scrollHeight + 2) + "px";
  });
}

function renderGuideScreen() {
  const frag = document.createDocumentFragment();
  const wrap = document.createElement("div");

  const priceRows = [];
  ["可燃ごみ", "不燃ごみ"].forEach(type => {
    BAG_SIZES.forEach(size => {
      const weight = WEIGHT_TABLE[type][size];
      priceRows.push({ type, size: `${size}L`, weight: `${weight}kg`, perKg: `${PRICE_PER_KG[type]}円/kg`, unitPrice: PRICE_TABLE[type][size] });
    });
  });
  priceRows.push({ type: "段ボール", size: "(1枚)", weight: `${CARDBOARD_WEIGHT_PER_SHEET}kg`, perKg: `${PRICE_PER_KG["段ボール"]}円/kg`, unitPrice: PRICE_TABLE["段ボール"] });

  const priceTableHtml = priceRows.map(r => `
    <tr>
      <td data-label="種別">${escapeHtml(r.type)}</td>
      <td data-label="袋サイズ">${escapeHtml(r.size)}</td>
      <td class="num-col" data-label="想定重量">${escapeHtml(r.weight)}</td>
      <td class="num-col" data-label="単価(円/kg)">${escapeHtml(r.perKg)}</td>
      <td class="num-col" data-label="1個あたり単価">${yen(r.unitPrice)}</td>
    </tr>
  `).join("");

  wrap.innerHTML = `
    <button class="back-btn" data-role="back">← 入力画面に戻る</button>
    <div class="guide-screen">
      <h2>使い方</h2>
      <ol class="guide-steps">
        <li>「＋ 案件を追加」でお客様の案件を1件作成し、企業名（必須）を入力します。</li>
        <li>品目ごとに「種別」「袋サイズ（45L／70L）」「1回あたり数量」「頻度（週◯回）」を入力します。
          数量が「1〜2袋」のように幅がある場合は両方、「2袋」のように1つだけの場合は数量maxを空欄にします。</li>
        <li>新規店舗などで週何回にすべきか分からない場合は、「週の合計でざっくり入力」に切り替えると、
          1回あたり数量・頻度の代わりに「週合計だいたい◯袋」だけで概算できます（後から回数が分かれば
          「詳しく入力に戻す」でいつでも戻せます）。</li>
        <li>必要に応じて「最低基本料金」「作業条件・特記事項」を編集します。</li>
        <li>「見積を出す」ボタンを押すと、お客様にご案内する金額と見積前提条件の文面が表示されます。</li>
      </ol>

      <h2>単価・重量表</h2>
      <p class="note" style="margin:0 0 10px;">
        袋の重量は実測値をもとにした目安です。「1個あたり単価」＝ 想定重量 × 単価(円/kg) を、金額提示の際に内部で使用しています。
      </p>
      <div class="table-scroll">
        <table class="guide-price-table">
          <thead>
            <tr>
              <th>種別</th>
              <th>袋サイズ</th>
              <th class="num-col">想定重量</th>
              <th class="num-col">単価(円/kg)</th>
              <th class="num-col">1個あたり単価</th>
            </tr>
          </thead>
          <tbody>${priceTableHtml}</tbody>
        </table>
      </div>
      <p class="note">
        ・生ごみ／瓶／缶／ペットボトルは袋サイズを選べますが、単価が未確定のため金額計算には含まれません（単価が分かり次第、対応します）。<br>
        ・初回手数料：¥${SETUP_FEE.toLocaleString("ja-JP")}（新規契約時、金額提示画面のチェックボックスでON/OFF可能）。<br>
        ・最低基本料金：既定 ¥${DEFAULT_MIN_MONTHLY_FEE.toLocaleString("ja-JP")}。案件ごとに変更でき、計算した月額がこれを下回ると自動的に引き上がります。
      </p>
    </div>
  `;

  wrap.querySelector('[data-role="back"]').addEventListener("click", () => {
    state.view = "list";
    render();
  });

  frag.appendChild(wrap);
  return frag;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

render();
</script>
</body>
</html>

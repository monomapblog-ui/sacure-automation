<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃棄物コネクト 案件量計算ツール</title>
<style>
  :root {
    --bg: #fff6f9;
    --bg-accent: #eefaf3;
    --panel: #ffffff;
    --border: #ffd9e6;
    --border-soft: #fff0f5;
    --text: #4a3540;
    --muted: #b48a9c;
    --accent: #5fcf9a;
    --accent-hover: #45bd85;
    --accent-soft: #e3f9ee;
    --accent-contrast: #ffffff;
    --pink: #ff8fab;
    --pink-hover: #ff6f95;
    --danger: #ff8fab;
    --danger-soft: #ffe6ee;
    --header: #ec6c96;
    --shadow: 0 6px 18px rgba(255, 143, 171, 0.18);
    --shadow-sm: 0 3px 10px rgba(255, 143, 171, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241823;
      --bg-accent: #1c2620;
      --panel: #2f202d;
      --border: #4d3348;
      --border-soft: #3a2837;
      --text: #f5e6ef;
      --muted: #c99cb5;
      --accent: #6bdba0;
      --accent-hover: #82e6b2;
      --accent-soft: #253a2f;
      --accent-contrast: #1c2620;
      --pink: #ff9dc0;
      --pink-hover: #ffb0cd;
      --danger: #ff9dc0;
      --danger-soft: #3d2333;
      --header: #ff9dc0;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #241823; --bg-accent: #1c2620; --panel: #2f202d; --border: #4d3348; --border-soft: #3a2837;
    --text: #f5e6ef; --muted: #c99cb5; --accent: #6bdba0; --accent-hover: #82e6b2; --accent-soft: #253a2f;
    --accent-contrast: #1c2620; --pink: #ff9dc0; --pink-hover: #ffb0cd; --danger: #ff9dc0; --danger-soft: #3d2333;
    --header: #ff9dc0; --shadow: 0 6px 20px rgba(0, 0, 0, 0.35); --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.3);
  }
  :root[data-theme="light"] {
    --bg: #fff6f9; --bg-accent: #eefaf3; --panel: #ffffff; --border: #ffd9e6; --border-soft: #fff0f5;
    --text: #4a3540; --muted: #b48a9c; --accent: #5fcf9a; --accent-hover: #45bd85; --accent-soft: #e3f9ee;
    --accent-contrast: #ffffff; --pink: #ff8fab; --pink-hover: #ff6f95; --danger: #ff8fab; --danger-soft: #ffe6ee;
    --header: #ec6c96; --shadow: 0 6px 18px rgba(255, 143, 171, 0.18); --shadow-sm: 0 3px 10px rgba(255, 143, 171, 0.14);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
    background-attachment: fixed;
    color: var(--text);
    margin: 0;
    padding: 28px;
    line-height: 1.6;
  }
  h1 { font-size: 2.1rem; margin: 0 0 6px; color: var(--header); text-wrap: balance; }
  .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 1.1rem; }
  .container { max-width: 1180px; margin: 0 auto; }
  .global-bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .global-bar label { font-size: 1.05rem; color: var(--muted); }
  .global-bar input[type=number] { width: 100px; }
  .mode-toggle { display: inline-flex; border: 2px solid var(--border); border-radius: 999px; overflow: hidden; }
  .mode-toggle button {
    border: none; border-radius: 0; padding: 12px 22px; font-size: 1.1rem; font-weight: 600;
    background: var(--panel); color: var(--text); transition: background 0.15s ease, color 0.15s ease;
  }
  .mode-toggle button + button { border-left: 2px solid var(--border); }
  .mode-toggle button.active { background: var(--pink); color: #ffffff; }
  .mode-toggle button:hover:not(.active) { background: var(--accent-soft); }
  .mode-desc { color: var(--muted); font-size: 1.02rem; }
  input, select {
    font-family: inherit; font-size: 1.15rem; padding: 9px 12px;
    border: 2px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text);
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px var(--danger-soft); }
  button {
    font-family: inherit; font-size: 1.08rem; font-weight: 600; cursor: pointer;
    border: 2px solid var(--border); border-radius: 999px; background: var(--panel);
    padding: 10px 20px; color: var(--text); transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible, .mode-toggle button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .site-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 22px;
    padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .site-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .site-head input[type=text] { font-size: 1.3rem; font-weight: 700; flex: 1; min-width: 200px; }
  table { border-collapse: collapse; width: 100%; font-size: 1.1rem; }
  thead th {
    text-align: left; color: var(--muted); font-weight: 700; font-size: 0.9rem;
    padding: 8px 10px; border-bottom: 2px solid var(--border-soft); white-space: nowrap;
  }
  tbody td { padding: 10px 10px; vertical-align: middle; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  .num-col { text-align: right; }
  .qty-pair { display: flex; align-items: center; gap: 6px; }
  .qty-pair input { width: 68px; }
  .row-actions { text-align: center; }
  .site-summary {
    display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px;
    border-top: 2px dashed var(--border); font-size: 1.05rem;
  }
  .site-summary .stat {
    background: var(--accent-soft); border-radius: 16px; padding: 10px 18px; min-width: 140px;
  }
  .site-summary .stat b { display: block; font-size: 1.6rem; color: var(--header); font-variant-numeric: tabular-nums; }
  .site-summary .stat span { color: var(--muted); font-size: 0.92rem; }
  .quote-box {
    margin-top: 18px; padding: 22px 26px; border-radius: 20px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--header) 100%); color: #ffffff;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .quote-box .quote-label { font-size: 1.1rem; font-weight: 700; opacity: 0.92; }
  .quote-box .quote-amount { font-size: 2.8rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .quote-box .quote-note { font-size: 0.92rem; opacity: 0.88; margin-top: 4px; }
  .setup-fee-toggle {
    display: flex; align-items: center; gap: 10px; font-size: 1.02rem; font-weight: 600; color: #ffffff;
    background: rgba(255, 255, 255, 0.18); padding: 10px 16px; border-radius: 999px; cursor: pointer;
  }
  .setup-fee-toggle input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--header); cursor: pointer; }
  .add-row-btn { margin-top: 10px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 0.92rem; margin-top: 10px; }
  select.type-select { min-width: 110px; }
  .custom-type-input { width: 100px; }
  footer { text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 30px; }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>🗑️ 廃棄物コネクト 案件量計算ツール</h1>
  <p class="subtitle">ヒアリング内容（例：「45Lが1〜2袋/日、週5回、不燃物週2日」）を入力すると、月間の袋数・容量・概算料金を自動計算します。</p>

  <div class="global-bar">
    <div class="mode-toggle" role="group" aria-label="表示モード">
      <button type="button" id="modeSimpleBtn">かんたん入力</button>
      <button type="button" id="modeDetailBtn">詳細入力</button>
    </div>
    <span class="mode-desc" id="modeDesc"></span>
  </div>

  <div class="global-bar">
    <div>
      <label>1ヶ月あたりの週数&nbsp;</label>
      <input type="number" id="weeksPerMonth" step="0.01" min="1" value="4.35">
    </div>
    <span class="note" style="margin:0;">※既定値は365日/12ヶ月/7日で算出した平均週数です。必要に応じて調整してください。</span>
  </div>

  <div class="toolbar">
    <button class="btn-primary" id="addSiteBtn">＋ 案件を追加</button>
    <button id="resetBtn" class="btn-danger">全データをクリア</button>
  </div>

  <div id="sitesContainer"></div>

  <footer>廃棄物コネクト｜社内用 案件量計算ツール</footer>
</div>

<script>
const STORAGE_KEY = "haikibutsu-connect-calc-v1";

const TYPE_PRESETS = ["可燃ごみ", "生ごみ", "不燃ごみ", "瓶", "缶", "ペットボトル", "段ボール", "その他"];

// 45L≈5kg・70L≈8kgの実測値から線形換算（可燃・不燃で共通）。段ボールは1枚≈0.3kgが目安。
const PRICE_PRESETS = { "可燃ごみ": 40, "不燃ごみ": 100, "段ボール": 35 };
const SETUP_FEE = 3000;

function suggestWeightPerUnit(item) {
  if (item.type === "段ボール") return 0.3;
  if (item.unit === "袋") {
    const L = Number(item.bagSize) || 0;
    if (L <= 0) return "";
    const kg = 0.12 * (L - 45) + 5;
    return Math.max(0, Math.round(kg * 100) / 100);
  }
  return "";
}

function uid() { return Math.random().toString(36).slice(2, 10); }

function defaultItem(type) {
  const t = type || "可燃ごみ";
  const isCardboard = t === "段ボール";
  const unit = isCardboard ? "枚" : "袋";
  const bagSize = isCardboard ? "" : 45;
  const item = {
    id: uid(),
    type: t,
    customType: "",
    unit,
    freqMode: "day",       // "day" = 袋/日 × 週の収集日数 / "week" = 週あたり直接量
    qtyMin: 1,
    qtyMax: 2,
    daysPerWeek: 5,
    bagSize,
    weightPerUnit: "",
    unitPrice: PRICE_PRESETS[t] !== undefined ? PRICE_PRESETS[t] : ""
  };
  item.weightPerUnit = suggestWeightPerUnit(item);
  return item;
}

function defaultSite(name) {
  return {
    id: uid(),
    name: name || "新規案件",
    includeSetupFee: true,
    items: [
      defaultItem("可燃ごみ"),
      defaultItem("不燃ごみ")
    ]
  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.mode) parsed.mode = "simple";
      return parsed;
    }
  } catch (e) { /* ignore */ }
  return { mode: "simple", weeksPerMonth: 4.35, sites: [defaultSite("株式会社サンプル")] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// monthly avg / min / max quantity for an item
function computeItem(item) {
  const weeks = state.weeksPerMonth;
  const qtyMin = Number(item.qtyMin) || 0;
  // 最大値が未入力なら「範囲」ではなく最小値と同じ単一の数量として扱う
  const qtyMaxRaw = item.qtyMax;
  const hasMax = qtyMaxRaw !== "" && qtyMaxRaw !== null && qtyMaxRaw !== undefined && !Number.isNaN(Number(qtyMaxRaw));
  const qtyMax = hasMax ? Number(qtyMaxRaw) : qtyMin;
  const avg = (qtyMin + qtyMax) / 2;
  const days = Number(item.daysPerWeek) || 0;

  let weeklyMin, weeklyMax, weeklyAvg;
  if (item.freqMode === "day") {
    weeklyMin = qtyMin * days;
    weeklyMax = qtyMax * days;
    weeklyAvg = avg * days;
  } else {
    weeklyMin = qtyMin;
    weeklyMax = qtyMax;
    weeklyAvg = avg;
  }

  const monthlyMin = weeklyMin * weeks;
  const monthlyMax = weeklyMax * weeks;
  const monthlyAvg = weeklyAvg * weeks;

  const bagSize = Number(item.bagSize) || 0;
  const monthlyVolumeL = bagSize > 0 ? monthlyAvg * bagSize : null;

  const weightPerUnit = Number(item.weightPerUnit) || 0;
  const monthlyWeightKg = weightPerUnit > 0 ? monthlyAvg * weightPerUnit : null;

  const unitPrice = Number(item.unitPrice) || 0;
  const monthlyCost = (monthlyWeightKg !== null && unitPrice > 0) ? monthlyWeightKg * unitPrice : null;

  return { monthlyMin, monthlyMax, monthlyAvg, monthlyVolumeL, monthlyWeightKg, monthlyCost };
}

function computeSite(site) {
  let totalQty = 0, totalVolume = 0, totalWeight = 0, totalCost = 0;
  site.items.forEach(item => {
    const c = computeItem(item);
    totalQty += c.monthlyAvg;
    if (c.monthlyVolumeL !== null) totalVolume += c.monthlyVolumeL;
    if (c.monthlyWeightKg !== null) totalWeight += c.monthlyWeightKg;
    if (c.monthlyCost !== null) totalCost += c.monthlyCost;
  });
  const setupFee = site.includeSetupFee ? SETUP_FEE : 0;
  const quoteTotal = totalCost + setupFee;
  return { totalQty, totalVolume, totalWeight, totalCost, setupFee, quoteTotal };
}

function fmt(n, digits = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}

function render() {
  document.getElementById("weeksPerMonth").value = state.weeksPerMonth;
  const isSimple = state.mode === "simple";
  document.getElementById("modeSimpleBtn").classList.toggle("active", isSimple);
  document.getElementById("modeDetailBtn").classList.toggle("active", !isSimple);
  document.getElementById("modeDesc").textContent = isSimple
    ? "※種別・数量・頻度だけで月間袋数を計算します。容量や料金の試算は「詳細入力」で。"
    : "※重量(kg/個)は45L≈5kg・70L≈8kgの目安から自動算出（変更可）。段ボールは1枚≈0.3kgが既定値。単価は円/kgで入力してください。";
  renderSites();
  saveState();
}

function renderSites() {
  const container = document.getElementById("sitesContainer");
  container.innerHTML = "";
  state.sites.forEach(site => container.appendChild(renderSiteCard(site)));
}

function renderSiteCard(site) {
  const card = document.createElement("div");
  card.className = "site-card";

  const head = document.createElement("div");
  head.className = "site-head";
  head.innerHTML = `
    <input type="text" value="${escapeAttr(site.name)}" data-role="site-name" placeholder="案件名（例：新宿区新規案件）">
    <button class="btn-danger" data-role="delete-site">この案件を削除</button>
  `;
  card.appendChild(head);

  const isSimple = state.mode === "simple";
  const table = document.createElement("table");
  table.innerHTML = isSimple ? `
    <thead>
      <tr>
        <th>種別</th>
        <th>1回あたり数量(min〜max)</th>
        <th>頻度(週◯回)</th>
        <th class="num-col">月間量(平均)</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  ` : `
    <thead>
      <tr>
        <th>種別</th>
        <th>単位</th>
        <th>頻度パターン</th>
        <th>1回あたり数量(min〜max)</th>
        <th>週の収集日数</th>
        <th>袋サイズ(L)</th>
        <th>重量(kg/個)</th>
        <th>単価(円/kg)</th>
        <th class="num-col">月間量(平均)</th>
        <th class="num-col">月間容量(L)</th>
        <th class="num-col">月間重量(kg)</th>
        <th class="num-col">月間概算料金</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");
  site.items.forEach(item => tbody.appendChild(renderItemRow(site, item)));
  const tableScroll = document.createElement("div");
  tableScroll.className = "table-scroll";
  tableScroll.appendChild(table);
  card.appendChild(tableScroll);

  const addRowBtn = document.createElement("button");
  addRowBtn.className = "add-row-btn";
  addRowBtn.textContent = "＋ 項目を追加";
  addRowBtn.addEventListener("click", () => {
    site.items.push(defaultItem());
    render();
  });
  card.appendChild(addRowBtn);

  const summary = computeSite(site);
  const summaryDiv = document.createElement("div");
  summaryDiv.className = "site-summary";
  summaryDiv.innerHTML = isSimple ? `
    <div class="stat"><b>${fmt(summary.totalQty)}</b><span>月間合計 個数（袋+枚）</span></div>
  ` : `
    <div class="stat"><b>${fmt(summary.totalQty)}</b><span>月間合計 個数（袋+枚）</span></div>
    <div class="stat"><b>${fmt(summary.totalVolume)}</b><span>月間合計 容量(L)</span></div>
    <div class="stat"><b>${fmt(summary.totalWeight)}</b><span>月間合計 重量(kg)</span></div>
    <div class="stat"><b>${summary.totalCost > 0 ? "¥" + fmt(summary.totalCost, 0) : "-"}</b><span>月間概算料金（単価入力分のみ）</span></div>
  `;
  card.appendChild(summaryDiv);

  if (!isSimple) {
    const quoteBox = document.createElement("div");
    quoteBox.className = "quote-box";
    quoteBox.innerHTML = `
      <div>
        <div class="quote-label">ご提示金額</div>
        <div class="quote-amount">¥${fmt(summary.quoteTotal, 0)}</div>
        <div class="quote-note">内訳：月額概算 ¥${fmt(summary.totalCost, 0)}${site.includeSetupFee ? ` ＋ 初回手数料 ¥${fmt(SETUP_FEE, 0)}` : ""}</div>
      </div>
      <label class="setup-fee-toggle">
        <input type="checkbox" data-role="setupFee" ${site.includeSetupFee ? "checked" : ""}>
        初回手数料（¥3,000）を含める
      </label>
    `;
    quoteBox.querySelector('[data-role="setupFee"]').addEventListener("change", (e) => {
      site.includeSetupFee = e.target.checked;
      render();
    });
    card.appendChild(quoteBox);
  }

  head.querySelector('[data-role="site-name"]').addEventListener("input", (e) => {
    site.name = e.target.value;
    saveState();
  });
  head.querySelector('[data-role="delete-site"]').addEventListener("click", () => {
    if (!confirm(`「${site.name}」を削除しますか？`)) return;
    state.sites = state.sites.filter(s => s.id !== site.id);
    render();
  });

  return card;
}

function renderItemRow(site, item) {
  const tr = document.createElement("tr");
  const c = computeItem(item);
  const isCustom = item.type === "その他";
  const isSimple = state.mode === "simple";

  const typeCell = `
    <td>
      <select class="type-select" data-role="type">
        ${TYPE_PRESETS.map(t => `<option value="${t}" ${t === item.type ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      ${isCustom ? `<input type="text" class="custom-type-input" data-role="customType" value="${escapeAttr(item.customType)}" placeholder="種別名">` : ""}
    </td>`;
  const qtyCell = `
    <td>
      <div class="qty-pair">
        <input type="number" min="0" step="0.5" data-role="qtyMin" value="${item.qtyMin}"> 〜
        <input type="number" min="0" step="0.5" data-role="qtyMax" value="${item.qtyMax}" placeholder="－" title="数量が1つだけの場合は空欄でOK（最小値のみで計算します）">
      </div>
    </td>`;
  const monthlyCell = `<td class="num-col">${fmt(c.monthlyAvg)}<br><span class="note" style="margin:0;">(${fmt(c.monthlyMin)}〜${fmt(c.monthlyMax)})</span></td>`;
  const deleteCell = `<td class="row-actions"><button class="btn-danger" data-role="delete-item" title="削除">×</button></td>`;

  tr.innerHTML = isSimple ? `
    ${typeCell}
    ${qtyCell}
    <td><input type="number" min="0" max="7" step="1" data-role="daysPerWeek" value="${item.daysPerWeek}" style="width:70px;"></td>
    ${monthlyCell}
    ${deleteCell}
  ` : `
    ${typeCell}
    <td>
      <select data-role="unit">
        <option value="袋" ${item.unit === "袋" ? "selected" : ""}>袋</option>
        <option value="枚" ${item.unit === "枚" ? "selected" : ""}>枚</option>
      </select>
    </td>
    <td>
      <select data-role="freqMode">
        <option value="day" ${item.freqMode === "day" ? "selected" : ""}>◯袋/日 × 週の収集日数</option>
        <option value="week" ${item.freqMode === "week" ? "selected" : ""}>週あたり直接量</option>
      </select>
    </td>
    ${qtyCell}
    <td>
      <input type="number" min="0" max="7" step="1" data-role="daysPerWeek" value="${item.daysPerWeek}" ${item.freqMode === "week" ? "disabled" : ""} style="width:70px;">
    </td>
    <td><input type="number" min="0" step="1" data-role="bagSize" value="${item.bagSize}" style="width:80px;" placeholder="-"></td>
    <td><input type="number" min="0" step="0.01" data-role="weightPerUnit" value="${item.weightPerUnit}" style="width:80px;" placeholder="-"></td>
    <td><input type="number" min="0" step="1" data-role="unitPrice" value="${item.unitPrice}" style="width:90px;" placeholder="-"></td>
    ${monthlyCell}
    <td class="num-col">${fmt(c.monthlyVolumeL)}</td>
    <td class="num-col">${fmt(c.monthlyWeightKg)}</td>
    <td class="num-col">${c.monthlyCost !== null ? "¥" + fmt(c.monthlyCost, 0) : "-"}</td>
    ${deleteCell}
  `;

  tr.querySelector('[data-role="type"]').addEventListener("change", (e) => {
    item.type = e.target.value;
    if (item.type === "段ボール") { item.unit = "枚"; }
    item.weightPerUnit = suggestWeightPerUnit(item);
    if (PRICE_PRESETS[item.type] !== undefined) item.unitPrice = PRICE_PRESETS[item.type];
    render();
  });
  const customInput = tr.querySelector('[data-role="customType"]');
  if (customInput) {
    customInput.addEventListener("input", (e) => { item.customType = e.target.value; render(); });
  }
  const unitSelect = tr.querySelector('[data-role="unit"]');
  if (unitSelect) unitSelect.addEventListener("change", (e) => {
    item.unit = e.target.value;
    item.weightPerUnit = suggestWeightPerUnit(item);
    render();
  });
  const freqSelect = tr.querySelector('[data-role="freqMode"]');
  if (freqSelect) freqSelect.addEventListener("change", (e) => { item.freqMode = e.target.value; render(); });
  tr.querySelector('[data-role="qtyMin"]').addEventListener("input", (e) => { item.qtyMin = e.target.value; render(); });
  tr.querySelector('[data-role="qtyMax"]').addEventListener("input", (e) => { item.qtyMax = e.target.value; render(); });
  tr.querySelector('[data-role="daysPerWeek"]').addEventListener("input", (e) => {
    item.daysPerWeek = e.target.value;
    if (isSimple) item.freqMode = "day";
    render();
  });
  const bagSizeInput = tr.querySelector('[data-role="bagSize"]');
  if (bagSizeInput) bagSizeInput.addEventListener("input", (e) => {
    item.bagSize = e.target.value;
    item.weightPerUnit = suggestWeightPerUnit(item);
    render();
  });
  const weightInput = tr.querySelector('[data-role="weightPerUnit"]');
  if (weightInput) weightInput.addEventListener("input", (e) => { item.weightPerUnit = e.target.value; render(); });
  const unitPriceInput = tr.querySelector('[data-role="unitPrice"]');
  if (unitPriceInput) unitPriceInput.addEventListener("input", (e) => { item.unitPrice = e.target.value; render(); });
  tr.querySelector('[data-role="delete-item"]').addEventListener("click", () => {
    site.items = site.items.filter(i => i.id !== item.id);
    render();
  });

  return tr;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

document.getElementById("modeSimpleBtn").addEventListener("click", () => { state.mode = "simple"; render(); });
document.getElementById("modeDetailBtn").addEventListener("click", () => { state.mode = "detailed"; render(); });
document.getElementById("addSiteBtn").addEventListener("click", () => {
  state.sites.push(defaultSite(`新規案件${state.sites.length + 1}`));
  render();
});
document.getElementById("weeksPerMonth").addEventListener("input", (e) => {
  state.weeksPerMonth = Number(e.target.value) || 4.35;
  render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("全ての案件データを削除して初期状態に戻します。よろしいですか？")) return;
  state = { mode: state.mode, weeksPerMonth: 4.35, sites: [defaultSite("新規案件")] };
  render();
});

render();
</script>
</body>
</html>
